# 各小说的数据位于 /data/novels/<id>/；id 应保持不变。
novels:
  - id: zero-orders
    repository: GcMin/fanqie-novel
    branch: main
    book_id: "7684310849036504126"
    book_title: 零点异常工单
    enabled: true
    publish_enabled: true
    daily_upload_char_limit: 7000
    publish_interval_seconds: 7200
    heartbeat_interval_seconds: 300
    migrate_legacy: true

