    commitments:
      - 本人口述不替代纸档或业务记录；出现本人关联时先披露再交叉
      - 没有专业必要性不安排危险或多余现场验证
      - 不为弧名或收束需要强造异常样本
      - 不把普通数据/通知/地址/内部编号/操作遗漏、普通高龄失联、普通安全违规或普通道路污染直接命名为主动删除、失址或记忆异常
      - 现场专业/行政/医学/机械救援/道路清理判断交给有权限责任方，中心和普通协助者不越权
