      - 704字段反转、青梧苑历史分叉、旧站/物资、永安里公共导向/正式地址/分户/住房使用关系的主要证据边界
      - ARC-008—ARC-021所有当前样本均按各自普通原因闭环，不形成新的异常候选
      - 原始错误、旧文本、空签认、风险描述、设备保护、许可证原文与实际执行必须分别留痕
      - 第104章压缩车在首次压缩前急停，消防确认被困人员未被机械部件压住；监控支持尾随进入和堆物倒下，责任方确认装车前完整目视清场未做完
      - 被困人员自述/监控路径/消防受力确认/120评估/清场执行属于不同证明层，任何一层不能替另一层完成
      - 第105章市民“像水”只属于原始观察；食品配送车破损食用油桶及连续车尾油迹支持当前污染来源；道路保洁清理完成与市民回访分别留痕
      - 精确泄漏起点、桶破损机制和责任认定当前未证且没有必要为本次工单继续扩查
    commitments:
      - 不删改原始记录来让数据自洽；后续纠正与原始事实分开保存
      - 现实处置与记录差异分别核验，不让一个解释自动覆盖另一层事实
      - 普通原因足以解释就正常收口，不为剧情弧强留伪疑点
      - 业务纠错、专业操作、医学判断、身份核验、机械救援和道路污染清理由责任单位按权限完成，中心只记录、联动和核结果
      - “本轮未形成候选”不扩大为“城市不存在此类异常”
      - 当事人自述与发现人观察都按来源保存，不预填疾病、身份关系或异常结论
