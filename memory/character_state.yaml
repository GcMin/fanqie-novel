    current_goal: >-
      ARC-020 complete。第105章只从04:31后的下一件真实城市服务事件重新建立地点、诉求、风险和责任链；继续改变事件类型，不继承花圃路垃圾房或ARC-008—020任何已闭合案件作为异常前提。
