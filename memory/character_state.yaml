      - 当前城市服务继续拆分设施实体/业务状态/任务调度/实际执行/责任值守/对外信息；一个层级的差异不自动替代另一层结论
      - “未证”只记录证据边界，不自动生成待办；继续查询必须有新的独立来源或现实处置必要性
      - 正常责任单位后续与异常调查待核分开，最终回执尚未取得不等于异常候选
      - 市九中停水普通故障与教育目录/数据生成差异是独立事实，不建立虚假因果
      - 当前只核北校区单位/办学地点与中心目录生成链，不以学生个人名单或身份信息证明校园存在
      - 源包存在、接收暂存成功、对象归一、服务地点表生成、搜索索引分别是不同处理层，不因前层成功自动补成后层成功
