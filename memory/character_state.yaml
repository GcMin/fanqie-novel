      - 没有专业必要性不安排危险或多余现场验证
      - 不为弧名或收束需要强造异常样本
      - 不把普通数据/通知/地址/内部编号/操作遗漏、普通高龄失联、普通安全违规、普通道路污染、正常急救取用、普通交接遗漏或公共导向设施转位直接命名为主动删除、失址或记忆异常
      - 现场专业/行政/医学/机械救援/道路清理/急救设备维护/施工通行/公共导向设施确认交给有权限责任方，中心和普通协助者不越权
