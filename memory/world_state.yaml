      - 源交换、接收暂存、对象归一、重复合并、服务地点表和搜索索引属于不同处理层；某一层的页面未显示对象，不等于对象从未被处理
      - 临时安置短信中的入口名称与现场可进入位置必须分开核实；先保证居民获得遮雨和接应，不得让老人儿童为验证入口继续淋雨或冒险绕行
