      - 公共险情的临时应急处置责任与长期管养/资产/赔偿责任分层；长期归属未即时确认不能阻止先排除眼前危险，应急先处置也不能自动证明长期归属
      - 历史单株编号、历史内部点位或旧资产键没有沿用，只证明识别/索引颗粒度变化；若正式移交与当前巡检责任仍连续，不得写成实体或责任链消失
      - 没有专业必要性不得安排夜间下井、示踪、重新堵塞设施、强行复位安全设备、拆门禁、翻越围栏、让非专业人员操作阀井泵房、广播控制箱、配电柜、燃气阀门、污水井盖或进入未排险树冠/绿化作业区
      - 中心只联动、暂停协调、核信息和记录结果；专业技术操作必须由有权限责任人员按既有规程执行
      - 正常责任单位后续与异常调查待核分开；维护、纠错、回填、模板修正、配置清理、操作复盘、树体复检、管养边界核定、排水维护复盘或流程整改尚未取得最终回执，不自动构成异常证据
      - “未证”只描述证据边界，不自动生成下一张查询单；继续查询必须有新的独立来源直接落到对应层级，或现实处置产生明确必要性
      - 业务自由文本能够被长期复用，只证明该业务系统保存并继续下发该文本；不能据此证明其仍是现行正式门牌。修改未来默认值不得覆盖原始订单记录
      - 原始错误、旧文本、空签认、历史编号、原始风险描述和后续纠正必须分别留痕；不得用后来的正确状态覆盖此前缺项或把来电事后改写成误报
      - 夜间现场观察若不足以完成专业诊断，只记录可见状态与复检需求，不得把“需复检”越级写成已确认腐朽、失效或责任结论
