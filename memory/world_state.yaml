    evidence_protocol:
      - 保留完整页面、原始上下文、来源与时间；当前字段与原始来源冲突时禁止直接覆盖
      - 历史记录与人物当前记忆分开记录，多媒介副本与后续查询分开
      - 普通地址库滞后、业务系统分链、未数字化、资料移交、工程变更、数据迁移、路线版本、配置同步、计划检修、安全保护、临时调度、组织编码、字段映射、重复合并、模板版本、设备退网、历史内部点位、业务自由文本、计划作业条件、绿化边界、维护遗漏、供水/道路故障、许可范围误读、普通人员走散、普通人机安全违规等解释必须先按正常流程核实
      - 公共导向、工程/物资、正式建筑地址、分户地址、住房使用关系、具体居民身份、设施实体、资产业务记录、任务调度、实际执行、责任值守、计划批准、当前执行条件、原始风险描述、专业检测、设备保护、故障证据、当事人自述、发现人观察、医学现场评估、警方身份/家属核验、机械停机状态、消防现场受力确认、监控进入路径、清场执行属于不同对象层，不得互相替代
      - 704当前“周衡/永安里6栋201”只证明系统当前如此显示，不能替代独立历史地址、住房使用或居民来源
      - 永安里6栋201地址层与2010-06-29住房使用关系已证；实际居住与关系终止时间未证且当前暂停继续申请
      - 当前城市服务调查先解决现实安全、卫生、通行、出行、用药、人员失联和基本服务需求；普通原因足够解释时必须正常收口并修改后续粗纲
      - 对会主动改变供电、通行、阀门、门控等现实状态的操作，批准/计划记录不能自动证明当前可执行；执行前需由责任方确认现实保障和回退条件
      - 对疑似燃气、消防等高风险来电，原始居民描述不能替代专业检测；最终普通原因也不能倒推最初专业处置多余
      - 公共险情临时应急处置责任与长期管养/资产/赔偿责任分层；长期归属未即时确认不能阻止先排除眼前危险
      - 历史编号或旧资产键未沿用只证明识别颗粒度变化；若正式移交与当前责任连续，不得写成实体或责任链消失
      - 设备进入保护状态只证明系统安全响应，不能直接作为根因；恢复公共服务前应由有权限专业人员确认故障条件解除并验证
      - 可能存在地下淘空的道路险情先封控并让人员离开不确定承载范围；供水修复、车辆脱困、道路临时恢复和永久修复分别记录
      - 有效许可必须同时核时间、对象与行为范围；是否覆盖当前实际行为由有权限责任链核定
      - 人身安全协助中，普通发现人不承担诊断、身份核验或私自转运；当事人能对话不等于没有失联/健康风险
      - 当事人自述按来源保留，不能因普通口误、等车习惯、记不清门牌或家庭沟通分歧直接建立记忆异常
      - 机械/清运险情先保持停机和隔离，普通人员不得为抢救进度擅自进入料斗、移动可能受力堆物或重新送电；设备未启动不等于装车前清场已完成
      - 人员自述、机械实际状态、专业救援受力确认、监控进入路径和清场执行分别记录；“以为无人”不等于已确认无人
      - 没有专业必要性不得安排危险或多余现场验证；中心只联动、记录、必要暂停协调和核结果
      - 正常责任单位后续与异常调查待核分开；未取得最终回执不自动构成异常证据
      - “未证”只描述证据边界，不自动生成下一张查询单；继续查询需新的独立来源或现实处置必要性
      - 原始错误、旧文本、空签认、历史编号、风险描述、设备保护事件、许可证原文、实际执行记录和后续纠正分别留痕
