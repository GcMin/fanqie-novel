      - 当前城市服务调查先解决现实安全、卫生、通行、出行、用药、人员失联和基本服务需求；普通原因足够解释时必须正常收口并修改后续粗纲
      - 没有专业必要性不得安排危险或多余现场验证；中心只联动、记录、必要暂停协调和核结果
      - “未证”只描述证据边界，不自动生成下一张查询单；继续查询需新的独立来源或现实处置必要性
      - 原始错误、旧文本、空签认、历史编号、风险描述、设备保护事件、许可证原文、实际执行记录和后续纠正分别留痕
      - 当前供水服务点/历史服务标签只能证明供水业务和资产定位，不替代正式门牌、产权、户籍或居民身份
