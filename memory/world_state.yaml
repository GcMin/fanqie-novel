    - 不把钱先生定性为身处过去，不拿其身体/药物做异常实验
    - 不把HY-QK-02文本对应定义为旧广播系统重新运行证明
    - 不把P17/D-17历史现行对应、P17无人、临时标记或普通乘客观察差异定义为钱先生位置证明、互相不可见规则、时间穿越或双空间机制
    - 不把实时感知差异计入F008具体事件记忆冲突；F008仍仅有王启明明确样本
    - 不提前完成M003或锁定永安里最后相关夜间处置者
