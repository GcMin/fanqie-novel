  xi_cha_night_shift: "Day397原失动力工作艇仍在江上未真归泊却由旧错误归泊展示进入新班可派；刘树成拦班员登艇，21:31有责主管单次撤班停派并保留原错和源记录；工作艇拖带复航、全量系统修复和工时仍待核。"
  beacon_light: "近岸航标灯专业有责单位评估并获合规保障船/人员/窗口，23:27只确认本灯位当次专业复测正常，其他航标和持续正常未证。"
  unchanged: "徐桂枝工时及夜市清理、白杨活动室和新河里全楼水质等旧未决不随本案结；F008/M004/M005和2016/2022同一无新证。"

