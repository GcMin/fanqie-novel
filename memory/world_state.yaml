      - 当前城市服务调查先解决现实安全、卫生、通行、出行和基本服务需求；普通原因足够解释时必须正常收口并修改后续粗纲
      - 现场可见水流、车辆经过、室内灯亮、来电人口述或“现场找不到某入口”只作为现场观察，不自动替代完整设施、责任、调度或机制证明
      - 没有专业必要性不得安排夜间下井、示踪、重新堵塞设施、强行复位安全设备、拆门禁、翻越围栏、让非专业人员操作阀井泵房或其他危险验证
      - ARC-008中的南仓路、槐河路、玉泉巷、文化馆天桥、新槐路西口公交、河滨公园北门公厕均已由各自普通原因闭环，不得因外观相似重新焊成共同异常链
      - 正常责任单位后续与异常调查待核分开；维护、纠错、回填、服务提示或流程整改尚未取得最终回执，不自动构成异常证据
      - “未证”只描述证据边界，不自动生成下一张查询单；继续查询必须有新的独立来源直接落到对应层级，或现实处置产生明确必要性
