      - 2019 S2-07留样与当前授权范围未见后续出库/报废不能替代Day 9当前实物盘点
      - DQ-JS-2010-MLP-04→B3→DQ-DZHD-2010-17证明永安里进入正式门楼牌沿革并展开到1—8栋；6栋已证，201/单元/住户未证
