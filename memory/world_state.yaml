    evidence_protocol:
    - 保留原始页面、文件、上下文、来源与时间；后续解释或纠正不得覆盖最初记录。
    - 人物自述、现场观察、标准地址、历史别名解析、街道资产名称、住房使用关系、保障房合同、物业名册、门禁授权、设备资产/通信状态、运营调度、公众信息、机构状态、设施用途与实际执行属于不同证明层，不得互相替代。
    - 同一对象在不同时间读取到不同状态时，两份带时间的原始状态都必须保留；后状态不能反向改写前状态。
    - 标准地址显示文字、内部对象ID、历史别名与现实现场名称属于不同层；同名、旧名、别名碰撞或错误映射必须先按普通数据治理核验。
    - 公用事业资产地址、抢修定位、实体门牌与标准地址对象属于不同数据/实体层；任一层继续使用旧地址都不能自动替代现行标准地址状态。
    - 住房租住关系与门禁权限属于不同业务对象；门禁授权终止不能替代退租/腾退事实，临时通行恢复也不能替代永久权限修复状态。
    - 交通信号中心最后下发主方案与控制器失联后LOCAL本地实际运行方案属于不同状态；主方案正确不能替代实际运行核验。
    - 历史别名源表、候选排序、经办选择、审核/抽查和最终解析结果属于不同处理节点；最终错误关联不能反向证明源表本身错误，后续停用关系也不能覆盖历史误导事实。
    - 设备资产在用、维修系统故障停运、公共导向服务状态、现场提示与人员实际通行结果属于不同状态；设备因安全条件被正确锁闭时，公开端仍可能因普通状态提交遗漏而显示错误，人员经替代路线完成服务也不等于设备已经修复。
    - 多入口设施的提示执行必须按实际入口核验；单一“已放置提示”勾选项不能替代每个入口均已完成提示的现场事实。
    - 普通数据迁移、历史服务点、项目边界、门牌停用/并号、版本交接、设备更新、字段映射、信息同步、机构撤并后房屋移交、目录口径、设施运营主体变更、历史别名未关联/错误关联、重复对象治理、夜间交换同步、定时批次、权限任务时序、道路施工/恢复后的配置遗漏、候选误选/抽样漏检、设备维修状态与公共服务状态分离、现场提示执行遗漏等原因必须优先核实。
    - 现实安全与基本服务优先；普通原因足够解释时必须关闭，不把档案兴趣、后台维护等待、配置修复等待、设备维修等待或预防性复核等待包装成夜间急单。
    - 医疗事件由120/医疗机构判断，中心只做职责内联动，不补写诊断。
    - “未证”只描述证据边界，不自动生成下一张查询单；继续查询需新的独立来源或现实处置必要性。
    - 永安里6栋201正式地址与2010-06-29住房使用关系已证；实际居住、具体居民身份与关系终止时间继续未证且暂停申请。
    - F008严格维持“本人具体亲历事件记忆与本人保留记录/当前实体发生稳定直接冲突”标准；普通业务或数据差异不计入。
    - F009已resolved：2018保留31/33/35/37号建筑，2019旧门牌停用并号至河湾路178号院；HWX-17作为未关联标准地址供水资产点独立运行。
    - F010已resolved：A731/B184是同名同址重复标准地址对象，A731按此前审批任务在22:52:07夜间交换停用，B184持续在用。
    - “已提交”“已受理”“已安排”“已执行”“已修复”必须分开记录。
