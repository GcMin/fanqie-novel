    evidence_protocol:
    - 保留原始页面、文件、上下文、来源与时间；后续解释或纠正不得直接覆盖最初记录
    - 人物自述、现场观察、正式地址、住房使用关系、业务服务状态、设备资产/通信状态、运营调度、公众信息、机构状态、设施用途、设施运营对象与实际执行属于不同证明层，不得互相替代
    - 普通地址库滞后、数据迁移、历史服务点、项目边界、门牌停用/并号、外包交接、表单版本、设备更新换代、快捷入口映射、服务责任片区调整、旧新枚举映射、设备原址保留、运营补充单、公众信息同步滞后、机构撤并后的房屋移交、目录对象口径、历史资产命名、设施运营主体变更、空间部分移交、历史别名未关联和现场旧标识残留等原因必须优先按正常流程核实
    - 现实安全与基本服务优先；普通原因足够解释时必须关闭，不把档案兴趣或后台维护等待包装成夜间急单
    - “未证”只描述证据边界，不自动生成下一张查询单；继续查询需新的独立来源或现实处置必要性
    - 704当前“周衡/永安里6栋201”只证明系统当前如此显示，不能替代历史住址、住房使用或具体居民来源
    - 永安里6栋201正式地址与2010-06-29住房使用关系已证；实际居住、具体居民身份与关系终止时间继续未证且暂停申请
    - F008严格维持“本人具体亲历事件记忆与本人保留记录/当前实体发生稳定直接冲突”标准；普通旧称、地址整编、市场表单、资产映射、业务状态、公众信息同步、机构/设施目录差异或停车设施移交/名称衔接都不计入
    - F009已resolved：2018保留31/33/35/37号建筑，2019旧门牌停用并号至当前河湾路178号院；HWX-17继续作为未关联标准地址的供水资产点独立运行
    - 居家安护现实求助、本人自述、服务对象状态和终端硬件通信分别属于不同层；QY-OUT源义为退出原服务责任片区，现平台“迁出本辖区”不得作为居民迁址依据
    - JH-07-102-44同期设备处置为原址保留，独立紧急通信继续接市级运营席；服务档案终止与设备在线报警可以正常并存
    - 公交主调整单、补充运营单、公众线路页、站端电子屏和车辆实际停靠分别证明不同层级；公众页面“暂停使用”不能覆盖已证夜班时段例外，实际停靠也不能倒推公众页面已经修正
    - 教育机构撤并/原校址停用只证明教育组织或办学点状态，不自动等于建筑物理拆除或停止其他合法用途；后续房屋移交与当前设施管理需看独立来源
    - 市级公开设施目录未单列某内部服务点可由目录收录对象口径解释，不能从名称搜索无结果直接推出现实地点不存在
    - 历史供水户名可以与当前设施用途不同步；只要资产点、位置、计量和责任链正常，不得把旧户名越级作为教育机构仍在或地点异常的证明
    - 旧停车设施对象“停用”与原空间部分区域后来正式移交并建立新停车设施可以正常连续成立；旧设施停用记录不得替代现设施运营状态，新设施入场记录也不得反向改写旧设施停用事实
    - 停车出口设备故障与旧名/旧客服/历史别名未关联属于不同因果层；东出口B控制器离线解释车辆受阻，名称衔接问题只解释市民为何得到互相冲突的信息
    - “已提交”“已受理”“已安排”“已执行”“已修复”必须分开记录；第119章公众数据维护仍为待处理，第121章公开页历史别名关联仍为待审核且东出口B仍待维修
