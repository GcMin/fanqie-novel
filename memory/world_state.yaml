      - 第67章确认《来话地址补核登记簿》是一类正常历史业务记录：当来话地址未直接匹配当时现行地址表但位置描述足以继续核查/转办时，原来话地址照录保留，核定地址/转办去向/核址结果另栏，不得覆盖原字段
      - 《来话地址补核登记簿》目录包含旧门牌、居民俗称、地址表同步滞后、来话表述不完整等普通原因，因此不得将整个类别解释成失址清单、异常地址名单或完整旧夜联制度
      - 2010-10-18乙班第17项只证明永安里第17组当时进入“现行地址表未直接命中→转补核→关联DQ-YH/夜联第43页”的业务流程；不提供201、单元、住户、核址原因或具体落笔人员
      - 梁策正式册名记忆误差属于普通十六年记忆边界，不构成F008新样本
      - 普通设施/安全工单继续只在责任范围内判断；第67章污水检查井冒溢工单只记录排水维护清掏后水位恢复，不由中心猜测具体堵塞成因
