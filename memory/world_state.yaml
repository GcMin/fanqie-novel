    evidence_protocol:
      - 保留完整页面、原始上下文、来源与时间；当前字段与原始来源冲突时禁止直接覆盖
      - 历史记录与人物当前记忆分开记录，多媒介副本与后续查询分开
      - 普通地址库滞后/业务系统分链先作为普通流程问题核实，不能直接命名异常
      - 未见入库/删除/出库/报废记录只能证明当前可查链没有对应操作
      - 历史图与现行图不得拼接成空间重合证明；P17/D-17只是候选结构锚点
      - 黑包00:28回库清车与05:08“车刚开走”只构成时间对照，不定性穿越/说谎/完整机制
      - Day 3 02:16在现行临江南找到钱先生只解决现实人员接管，不倒推过去空间/双空间/异常入口
      - 钱先生获救后旧站务亭男性值班人员与环境变化描述只属于本人证词，不按证词追具体人
      - 2016改造影像/拆除/移交与北库物资记录按正常档案/物资权限调阅，不以“永安里”泛搜
      - 2016影像“永安里”属于公共导向设施证据，不得直接当作永安里6栋201正式地址/门牌/住户证明
      - DX-B-06、BZ-YJ-160114-02、BK-JBS-160114-03分别只代表项目拆改对象编号、交接单号、北库旧标识分类登记号
      - 2019留样与当前授权范围未见后续出库/报废不能替代Day 5当前实物盘点；S2-07必须由有权限人员按正常流程核验
      - 公共导向资料、轨道导向资料、工程/物资台账、标准地址/门楼牌/住户登记、居民口头俗称/维护现场别名属于不同业务层，不得互相替代
      - 公共导向点可以使用历史沿用名或约定俗成居民地名，不生成门楼牌编码、不替代标准地址基础库、不作为住户登记依据
      - 标准地址历史快照中目标图幅未见某名称，只能保存该版本/图幅/可见范围阴性结果，不能扩大成历史上从未存在
      - 704当前字段“周衡/永安里6栋201”只证明系统当前如此显示，不能替代独立历史门楼牌/建筑地址/住户登记来源
      - 正常旧号→新号样本只说明正常流程可能保留的字段，不能反推永安里必然经历同类变更
      - 已知来源文书时按行政区片→年度/批次→条目定位并用现行地址卡反核；未知来源文书时先按行政区片+历史图幅/旧道路范围+大致年代申请候选索引
      - 同一变更批次可包含不同处置类型；目录只证明索引关系，不等于底册正文
      - 2008—2012只代表既有历史资料形成期的首轮申请范围，不得写成永安里正式地址存在期；历史图幅只作位置范围条件
      - 目录若不开放完整门牌字段，“未见永安里”不构成有效阴性结果
      - 2014数字化“纸页在场/初扫质检不合格/随册退还”只证明当时作业状态；2017整册移交只证明原卷进入东桥区历史资料保管体系
      - 第55章东桥区Day 4当前实物核验才证明DQ-JS-2010-MLP-04原卷117—146页当前在馆、页序连续且129页在册；不得反向把这一结论写回2014/2017时点之外的其他事实
      - 2021保护性利用采集仅用于馆内查阅/调阅复制，不替代正式数字化归档状态，也不消除129页内侧靠装订线仍有少量遮挡的限制
      - 126—131页只读授权必须按核定范围使用，不得因目标字样出现就扩大整卷下载或无关附件调阅
      - 129页的“历史登记片区=永安里”证明该名称进入正式门楼牌沿革资料链；该字段不是现行标准地址、不是具体门牌正文、不是建筑地址或住户登记
      - 129页没有6栋、201、住户或具体门楼牌详项；其“旧城居住区整编转出”只说明该批处置关系，具体对象须由DQLP-2010-04-B3继续核对
      - DQLP-2010-04-B3的“迁出”仅指本批门楼牌登记对象转入后续住址核对专卷，不等同人口迁移/户籍变更/居民搬离
      - B3-17是清册分组号，不是门牌号；“8项”是登记对象数量，当前不得解释成8栋，也不得由此补出6栋201
      - 第56章开放片段只证明永安里对应B3-17属于建筑门楼牌登记对象组，并承接至DQ-DZHD-2010-17；具体建筑/门牌仍须下一层来源核对
      - DQ-DZHD-2010-17目录存在建筑地址对应表、门楼牌来源核对表、居住登记关联索引、来源核验附件目录；目录存在不等于正文已读，也不自动授权居民姓名层
      - 居住登记关联索引属于更敏感业务层；未取得具体建筑对象和必要性前不得先扩大到居民姓名查询
      - 社区俗称/维护现场别名可以长期稳定并真实服务定位；被居民广泛使用或被业务系统保存为“别名”不等于其曾是正式地址
      - 民间对俗称来源的解释若无独立资料，只能作为口述保存
      - 普通设施工单中中心只做责任范围/风险边界/联动/结果核验；专业检测结论必须注明责任单位/维保来源
