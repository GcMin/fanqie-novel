    evidence_protocol:
      - 保留完整页面、原始上下文、来源与时间
      - 多媒介副本与后续查询分开；当前字段与原始来源冲突时禁止直接覆盖
      - 历史记录与人物当前记忆分开记录
      - 普通地址库滞后/业务系统分链必须先作为普通流程问题核实，不能直接命名异常
      - 未见入库/删除/出库/报废记录只能证明当前可查链没有对应操作
      - 历史图与现行图不得拼接成空间重合证明；P17/D-17仅是候选结构锚点
      - 跨系统时间不得强行对齐到同一秒；轨道视频/行车/失物交接、中心通话录音按来源和事件顺序核对
      - 黑包00:28回库清车记录与05:08热线“车刚开走”只构成时间对照，不得升级为时间穿越/说谎/完整机制
      - Day 3 02:16在现行临江南找到钱先生只解决现实人员接管，不得倒推过去空间、双空间、异常入口或完整失址机制成立
      - 钱先生获救后旧站务亭男性值班人员与环境变化描述只属于本人证词，不按证词追身份
      - 2016改造影像/拆除/移交资料及北库物资记录必须按正常档案/物资权限调阅，不以“永安里”文字泛搜
      - 2016影像中“永安里”属于公共导向设施证据，不得直接当作永安里6栋201正式地址/门牌/住户证明
      - DX-B-06仅是改造项目拆改对象编号；BZ-YJ-160114-02仅是交接单号；BK-JBS-160114-03仅是北库旧标识分类登记号
      - 北库2019留样移转与当前授权范围未见后续出库/报废不能替代Day 4当前实物盘点；S2-07必须由有权限人员按正常盘点流程核验
      - 公共导向资料、轨道导向资料、工程/物资台账与标准地址/门楼牌/住户登记属于不同业务层，不得互相替代
      - 公共导向点可以使用历史沿用名或约定俗成居民地名，不生成门楼牌编码、不替代标准地址基础库、不作为住户登记依据
      - 标准地址历史快照中目标图幅未见某名称，只能保存该版本/图幅/当前可见范围的阴性结果，不能扩大为历史上从未存在
      - 第48章固定规则：同名信息按来源和业务用途分别保存；每份材料同时记录“能证明”和“不能证明”
      - 青梧苑2015业务层分叉只能作为方法案例，不得用于证明永安里与青梧苑属于同一异常机制
      - 704当前字段“周衡/永安里6栋201”只能证明系统当前如此显示，不能替代独立历史门楼牌、建筑地址或住户登记来源
      - 正式地址层当前状态必须写“未取得”，不是“无”；后续只从门楼牌编制底册、建筑地址登记、住户登记/迁入迁出等对应业务源进入
      - 第49章新增正常地址沿革规则：旧实体门牌物理残留、居民口头旧称、当前有效门牌和正式沿革记录必须分别保存；旧牌仍挂墙不等于旧号仍有效
      - 一个正常旧号→新号样本只能说明正常流程可能保留的字段，不能反推永安里必然经历同类变更，也不能用“查不到同类记录”直接定义异常
      - 历史门楼牌后续检索优先使用行政区片、变更批次、来源文书和沿革索引，不以“永安里6栋201”无来源全文搜索
      - 普通设施工单中中心只做责任范围/风险边界/联动与结果核验；责任单位或专业维保的专业检测结论必须注明来源，不得写成中心自行检测
