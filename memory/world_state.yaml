    evidence_protocol:
    - 保留原始页面、文件、上下文、来源与时间；后续解释或纠正不得覆盖最初记录。
    - 人物自述、现场观察、标准地址、住房使用关系、业务服务状态、设备资产/通信状态、运营调度、公众信息、机构状态、设施用途与实际执行属于不同证明层，不得互相替代。
    - 同一对象在不同时间读取到不同状态时，两份带时间的原始状态都必须保留；后状态不能反向改写前状态，前状态也不能证明当前仍有效。
    - 标准地址的“显示门牌文字”与内部对象ID属于不同层；同一门牌文字可能因历史迁移出现重复对象，停用重复对象不自动等于现实门牌、建筑或业务资产被停用。
    - 公用事业资产地址、抢修定位、实体门牌与标准地址对象属于不同数据/实体层；任一层继续使用旧地址都不能自动替代现行标准地址状态。
    - 普通数据迁移、历史服务点、项目边界、门牌停用/并号、版本交接、设备更新、字段映射、信息同步、机构撤并后房屋移交、目录口径、设施运营主体变更、历史别名未关联、标准地址整编/拆分/并号/纠错、重复对象治理及夜间交换同步等原因必须优先按正常流程核实。
    - 现实安全与基本服务优先；普通原因足够解释时必须关闭，不把档案兴趣或后台维护等待包装成夜间急单。
    - “未证”只描述证据边界，不自动生成下一张查询单；继续查询需新的独立来源或现实处置必要性。
    - 永安里6栋201正式地址与2010-06-29住房使用关系已证；实际居住、具体居民身份与关系终止时间继续未证且暂停申请。
    - F008严格维持“本人具体亲历事件记忆与本人保留记录/当前实体发生稳定直接冲突”标准；普通业务或数据差异不计入。
