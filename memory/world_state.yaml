      - 历史改造项目公开摘要“拆除完成”只能证明摘要口径；具体拆除对象以清册、验收界址、保留建筑说明等附件核定
      - 第111章已确认2018本期拆除对象为39、41、43、45、47号旧宿舍及六处附属建筑；31、33、35、37号当时保留使用
      - 历史标准地址对象“停用/并号”与建筑实体拆除属于不同状态；第112章已确认31/33/35/37号2019年因统一出入口和门牌整编停用，并入当前在用的河湾路178号院
      - 居民继续使用旧称、自述旧门牌与现行标准地址已变更可以同时成立；不得用后来的地址结论覆盖原始来电
      - 河湾路178号院只证明院落级现行标准地址，不能证明具体居民、房号、产权、户籍或旧实体门牌仍在
      - F008严格维持“本人具体亲历事件记忆与本人保留记录/当前实体发生稳定直接冲突”标准；旧称沿用、熟悉资产路线、历史位置文本、项目保留建筑、普通地址整编、市场表单冲突都不计入
      - 市场现场有人、当前过渡经营清单、施工封闭分区表和夜保巡查表分别证明实体使用/经营管理/改造区域管理/夜保执行口径，不得跨层推成产权、正式地址、长期营业权或异常机制
      - QSB-YB-0903页脚9月3日只证明模板生成/下发时间，不证明当天逐铺核过人员状态；外包交接遗漏例外附件和字段压缩可以完整制造“停用、无人”结果
