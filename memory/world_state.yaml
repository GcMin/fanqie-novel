      - 普通地址库滞后、业务系统分链、未数字化、资料移交、隐私遮蔽、权限等待、工程变更、竣工回填、数据迁移、路线版本、配置同步、计划检修、保护停机、临时调度、门禁状态、组织编码、办学地点归类、字段映射、状态过滤、父子关系、去重/合并、ETL、模板版本、设备退网、本地控制器默认配置、资产移交、台账颗粒度、维保权限、历史内部点位、业务自由文本、计划作业条件、执行前现场状态、保障/回退条件、绿化管养边界、合同换期、巡检颗粒度与服务目录索引生成等普通解释必须先按正常流程核实
      - 公共导向、工程/物资、正式建筑地址、分户地址、住房使用关系、具体居民身份、设施/站点实体、资产业务记录、任务/调度、实际执行、责任/值守、计划/批准、当前执行条件、公共险情应急处置、长期管养、历史单株编号与面向市民的信息属于不同对象层，不得互相替代
      - 704当前“周衡/永安里6栋201”只证明系统当前如此显示，不能替代独立历史地址、住房使用或居民来源
      - 永安里6栋201地址层与2010-06-29住房使用关系已证；实际居住与关系终止时间未证且当前暂停继续申请
      - 当前城市服务调查先解决现实安全、卫生、通行、出行、用药和基本服务需求；普通原因足够解释时必须正常收口并修改后续粗纲
      - 对会主动改变供电、通行、阀门、门控等现实状态的操作，批准/计划记录不能自动证明当前可执行；执行前需由责任方确认现实保障和回退条件
      - 公共险情的临时应急处置责任与长期管养/资产/赔偿责任分层；长期归属未即时确认不能阻止先排除眼前危险，应急先处置也不能自动证明长期归属
      - 没有专业必要性不得安排夜间下井、示踪、重新堵塞设施、强行复位安全设备、拆门禁、翻越围栏、让非专业人员操作阀井泵房、广播控制箱、配电柜或进入未排险树冠/绿化作业区
      - 中心只联动、暂停协调、核信息和记录结果；专业技术操作必须由有权限责任人员按既有规程执行
      - 正常责任单位后续与异常调查待核分开；维护、纠错、回填、模板修正、配置清理、操作复盘、树体复检、管养边界核定或流程整改尚未取得最终回执，不自动构成异常证据
      - “未证”只描述证据边界，不自动生成下一张查询单；继续查询必须有新的独立来源直接落到对应层级，或现实处置产生明确必要性
      - 业务自由文本能够被长期复用，只证明该业务系统保存并继续下发该文本；不能据此证明其仍是现行正式门牌。修改未来默认值不得覆盖原始订单记录
      - 原始错误、旧文本、空签认、历史编号和后续纠正必须分别留痕；不得用后来的正确状态覆盖此前缺项
      - 夜间现场观察若不足以完成专业诊断，只记录可见状态与复检需求，不得把“需复检”越级写成已确认腐朽、失效或责任结论
