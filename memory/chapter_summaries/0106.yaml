  Day 19 05:29，第十八次夜班继续。晨湖体育公园保洁员发现东门公共AED柜门打开、设备不在，柜体外观无明显破坏，最初只能确认公共急救设备当前离开固定点位。中心没有先按盗窃处理，也没有让保洁员追人，而是根据柜体“紧急时直接取用”提示联动120核附近急救事件。120确认05:24荷花巷早市南口已有人员突发倒地急救呼叫，调度过程中有人被指引到晨湖体育公园东门取用AED；05:38专业急救人员到场并确认该设备已在现场启用。中心只保留完成联动所需的急救状态，不查询患者姓名、诊断或最终预后。公共AED维保人员05:42抵达早市外侧并等待120完成现场使用，05:51医疗处置进入转运阶段后完成设备交接。已使用的AED-CY-03因电极片已启用，需要进入使用后耗材更换和状态检查，不能直接塞回公园柜；管理方从值守点调周转备用机，06:07完成东门柜装机与状态确认，06:09点位恢复可用。06:11医疗联动退出中心协同，06:12工单关闭。ARC-022按“公共AED被用于附近真实急救，使用后由管理方完成设备接回和备用机补位”的普通事件闭环，不建立异常候选。
