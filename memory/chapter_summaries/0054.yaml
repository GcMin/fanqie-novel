chapter: 54
title: 大家都这么叫
arc: ARC-005
summary: >-
  Day 4 20:11，周衡、梁策、夏宁进入第四次夜班后先处理一张老城区普通公共照明工单。来电人只用社区长期俗称“石桥口”报位置，现行标准地址/地名服务没有该正式对象；夏宁没有否定来电人口述，而是通过“槐北路88号斜对面支巷入口”与照明设施编号L-1782完成精确定位，并将“群众口述：石桥口”单独保留。市政照明夜间值守确认L-1782的巡检路线备注本身也保存“石桥口”作为现场别名，维修班和附近居民常用，但资产正式定位仍为槐北路支巷+设施编号，维护备注不参与门楼牌地址编制。来电人又称该俗称来自几十年前的一座小石桥，周衡只按个人口述保存，没有把桥的历史当作已核事实。20:29维护人员到场并由专业人员确认灯具电源模块故障，完成更换与试亮；20:37来电人确认复亮且不再闪烁，20:44现场短时试亮正常，20:47工单完成。周衡在回单中明确把故障原因标为市政照明现场反馈，并把位置写成现行道路/设施编号，未把“石桥口”写成历史正式地名。与第49章花枝巷正式旧号样本相比，本章建立另一种正常控制样本：一个名称可以被居民长期使用并被专业维护系统保留为现场别名，现实定位价值很高，但仍不等于正式地址或历史门楼牌。章尾东桥区资料室申请仅显示“馆藏核验中”，未返回馆藏号、页序或正文；S2-07继续待实物确认。
meaningful_changes:
  - 周衡新增一个与花枝巷不同的正常控制样本：社区俗称/维护现场别名可以真实、稳定且具有服务定位价值，但并不自动成为标准地址或历史正式地址
  - 普通路灯工单通过现行道路、附近门牌和设施编号完成派单，市政照明专业人员完成故障判断、更换、试亮和现场反馈，中心完成回访/回单闭环
  - 对“以前有小石桥”的说法只保存为来电人口述，没有把民间来历解释升级为历史事实
  - 东桥区卷级调阅申请只自然推进到“馆藏核验中”，仍未返回任何卷内内容；S2-07继续等待正常盘点
new_information:
  - 老城区普通市政维护系统可保留“现场别名”帮助班组定位；该字段与资产坐标/道路段/设施编号并存，但不参与标准门楼牌地址编制
  - “石桥口”在本章被居民和照明巡检路线共同使用，但当前没有证据证明它曾是正式门楼牌或标准地址对象
  - L-1782位于槐北路88号斜对面支巷入口内约十余米；据市政照明现场人员反馈，本次故障为灯具电源模块故障并已完成更换/复亮
open_questions:
  - 东桥区资料室对2010年第4批原卷的当前馆藏号、卷册/页序状态和可开放范围仍待核验；129页正文仍未知
  - BK-JBS-160114-03对应旧导向牌Day 4是否仍在S2-07仍未知
  - 永安里6栋201独立正式地址证明、M003目标人员、完整失址机制、工单系统来源及周衡为何保留永安里记忆仍未解决
ending_state: Day 4约20:47，第四次夜班刚开始不久。“石桥口”路灯普通工单已闭环，周衡明确掌握“能定位/被长期使用/进入维护别名备注”与“正式地址”可以正常分离。东桥区资料室申请为馆藏核验中，S2-07仍待实物确认。第55章可在不复述本章案例的前提下继续等待或读取东桥区卷级核验的正常结果
