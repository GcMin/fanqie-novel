title: 他们正在忘记
arc: ARC-001
summary: >-
  Day 2约04:36，青梧苑门岗王启明来电说明地下2015纸质资料需等待约07:30白班工程主管按手续开启，并顺口把此前找到的旧钥匙称为“12屋面”。夏宁没有告诉他正确答案，先确认01:49由王启明本人发送的原图仍清楚显示“13屋面”，随后让他在不看聊天记录的情况下重新到旧钥匙柜现场读标签。04:41王启明直接读出实体标签“13屋面”，却坚持自己先前记得是12屋面；查看本人聊天记录后，他确认01:49照片确由自己发送、柜子和手套等细节也属于本人，但完全不记得拍摄该照片。04:44王启明重新拍摄同一钥匙，新旧两张原图都显示13屋面，标签裂纹、钥匙圈和齿口细节当前可以对应。三人仍保留夜班疲劳等普通原因，不把单一样本写成固定异常规律；梁策也阻止继续追问王启明其他13栋细节。04:48，周衡、梁策、夏宁在不讨论的情况下分别写下三项当前核心记忆，三份内容一致并分开保存；04:51周衡追加记录自己仍记得以上三项。
meaningful_changes:
  - 第一次出现既有知情者的具体事件记忆与其本人聊天记录、当前实体物件同时发生冲突，风险从记录层扩展到人员认知层
  - 王启明当前仍能直接读出“13屋面”，但缺失01:49亲手拍摄/发送该照片的事件记忆，且一度稳定记成“12屋面”
  - 周衡、梁策、夏宁新增“给当下记忆留时间与个人来源”的处置方式，分别建立04:48即时记忆基线并分开保存
  - 对认知异常的核查边界被明确限制为单一样本，不继续盘问其他知情者，避免暗示和变量污染
new_information:
  - 王启明01:49本人聊天记录仍保留13屋面照片，04:44新照片也仍显示13屋面
  - 新旧照片中的标签裂纹、钥匙圈和钥匙齿口当前可对应，暂未发现实体标签被更换的可见迹象
  - 王启明能够识别照片中的旧钥匙柜和本人手套，却无法回忆拍摄01:49照片
  - 青梧苑地下资料间白班工程主管约07:30到岗，六箱2015纸质资料仍未提前开启
open_questions:
  - 王启明的记忆差异是夜班疲劳、普通记错还是与13栋记录变化有关
  - 这种认知差异是否会扩大到其他知情者、影响哪些事实以及按什么顺序发生
  - 三人04:48即时记忆记录及既有纸面/照片证据后续是否会继续保持当前内容
  - 青梧苑地下六箱2015维修/回访资料中是否存在13栋、804或陈德福对应记录
ending_state: Day 2约04:51，周衡、梁策、夏宁仍在临江市夜间综合服务中心且三人当前记忆一致；王启明留在青梧苑正常门岗，实体“13屋面”钥匙仍原位保留，但他不记得01:49拍摄过对应照片；地下纸质资料等待白班手续
