chapter: 51
title: 图幅索引
arc: ARC-005
summary: >-
  Day 4 00:38起，周衡、梁策、夏宁继续第三夜班，并重新打开第50章留下的旧B口门楼牌目录范围申请草稿。草稿已有行政区片和2010公共导向底图历史图幅，但时间范围/理由为空。三人没有用“永安里”或“6栋201”作为检索词，而是只依据此前独立核实的历史节点定首轮范围：2008年槐荫路仍为二号线终点、2010年市级公共导向底图存在YD-073、2011年轨道B口导向引用该点、2012年线路延伸后槐荫路不再是终点。周衡据此提出2008—2012作为“已知历史资料形成期”的首轮定位范围，梁策明确不能写成“永安里存在期”。夏宁将申请理由写为核对旧B口历史图幅覆盖区2008—2012年门楼牌沿革目录，用于历史服务记录地址归属核验，并注明历史图幅只限定位置、不构成正式地址证明。00:44提交目录级申请。等待期间中心照常处理一张夜间垃圾清运延误投诉。00:51申请返回三组目录候选：2008—2009旧城门楼牌年度维护索引、2010—2011旧城门楼牌整编索引、2012门楼牌调整补录索引；均只开放卷册/来源批次/纸质页段/数字化状态等目录元数据。三人因2010—2011与既有公共导向/轨道资料形成时间重合，先进入该组，再按历史图幅覆盖关系筛到2010年第4批与2011年第2批。2011年第2批纸质页段与数字化页序一致；2010年第4批纸质登记册页段为117—146，而数字化影像仅挂接117—128、130—146。129页状态栏明确为“纸档页号存在；数字化影像未挂接；保管状态待核”。周衡起初口头说“缺一页”，经梁策追问后主动收窄为“129页数字化影像未挂接，纸档状态待核”。当前目录只显示来源文书标题/文号索引、道路段、调整数量和登记页位置，不开放足以判断具体门牌的底册正文，因此连“当前没见永安里”都不能形成有效阴性结论。00:58夏宁只针对2010年第4批登记册129页提交最小范围保管状态核验，请求确认纸页是否存在、是否未数字化、是否有移交/重装订记录及当前保管位置，不预选损毁或删除原因。01:04该核验仍待回复，BK-JBS-160114-03/S2-07实物盘点也仍无新结果。调查从“知道如何申请历史索引”推进为取得旧B口图幅2008—2012的具体候选目录，并锁定一个可验证的普通档案状态缺口：2010年第4批登记册129页。
meaningful_changes:
  - 旧B口历史图幅的未提交草稿首次补上2008—2012合理时间范围并完成目录级提交，正式地址调查从方法层进入具体历史候选卷册/来源批次
  - 目录返回2008—2009、2010—2011、2012三组候选，三人只按已知资料形成期与图幅覆盖关系把优先入口缩到2010年第4批和2011年第2批，没有使用目标地名全文搜索
  - 2010年第4批登记册纸质页号117—146连续，但数字化影像未挂接129页；该现象被限定为“数字化缺项/纸档状态待核”，未被升级成人为删除或异常
  - 00:58已提交仅针对129页保管状态的核验请求，第52章获得单一、可执行的新入口：先确认纸页当前状态和影像缺项原因，再决定是否申请内容调阅
new_information:
  - 旧B口图幅在2008—2012范围内可定位到三组历史门楼牌目录候选：2008—2009年度维护索引、2010—2011整编索引、2012调整补录索引
  - 2010—2011候选组按图幅覆盖关系包含2010年第4批与2011年第2批；前者纸册页段117—146、当前数字化影像117—128与130—146，后者目录状态完整
  - 2010年第4批129页目录状态为纸档页号存在、数字化影像未挂接、保管状态待核；当前没有证据证明纸页丢失、损毁、被删或异常变化
  - 当前目录层并不开放完整门牌正文，因此不能据“未见永安里”形成有效阴性结论
open_questions:
  - 2010年第4批129页纸质原页当前是否存在，数字化影像未挂接究竟源于未数字化、移交、重装订、损毁、目录错误或其他普通档案原因
  - 若纸页存在并获正常调阅权限，其实际内容是否与旧B口图幅正式门楼牌沿革有关仍未知
  - BK-JBS-160114-03对应旧导向牌当前是否仍在S2-07，仍待正常盘点
  - 永安里6栋201独立正式地址证明、M003目标人员、完整失址机制、工单系统来源及周衡保留记忆原因均未解决
ending_state: Day 4约01:04，周衡、梁策、夏宁仍在临江市夜间综合服务中心第三夜班。旧B口2008—2012门楼牌目录范围申请已完成并返回候选卷册；2010年第4批登记册129页当前只有“数字化影像未挂接/纸档状态待核”的目录事实。夏宁已提交最小范围保管状态核验，结果待定；S2-07实物盘点继续等待。第52章只能先处理129页的普通档案保管/数字化原因，不得先猜页面内容或异常删除
