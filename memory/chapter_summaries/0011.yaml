schema_version: 1
chapter: 11
title: 804
arc: ARC-001
summary: >-
  周衡与梁策在新增八楼804门外先按正常住户接触流程处理门内三下轻敲。周衡敲门、联系刘桂兰核对804过去住户与门口细节，并确认没有烟、水等需要立即强行进入的紧急迹象。804内随后出现男性声音，起初只重复“门没锁”，在周衡明确询问进入许可后两次说“进来吧”。二人记录原话、保持调度联系并用门挡固定房门，只进入玄关和客厅入口范围。屋内有长期封闭的灰尘与旧家具，门内贴着褪色福字，鞋柜内鞋子落灰；客厅中央一把木椅留下从餐桌旁新拖出的擦痕，但视野内没有任何人。更深处一扇房门自行开出一条缝，只露出相框与发黄照片纸的一角。二人没有继续深入，退回804门口时木椅再次发出摩擦声。
meaningful_changes:
  - 804从门外声源升级为已获得口头许可并可进入的具体室内调查现场
  - 首次听见804内明确男性人声，但声音来源与人员身份仍无法确认
  - 屋内实体木椅与新擦痕为长期噪音提供可见现场对象，同时现场没有可见操作者
  - 804深处首次出现未检查的照片/相框视觉线索，为后续F004调查建立入口
new_information:
  - 刘桂兰记得804过去门口有红垫和福字，并称老陈曾因漏水进入过这户
  - 804当前门未上锁，门内男性声音会在特定询问后给出进入许可
  - 804玄关与客厅存在旧鞋、家具、灰尘和旧台历等生活遗留，但入口视野内无人
  - 客厅一把木椅存在新鲜拖动擦痕，并在二人退出时再次发出摩擦声
open_questions:
  - 男性声音来自谁，是否对应804真实住户
  - 804当前是否仍有人实际居住，以及室内生活痕迹属于什么时间
  - 木椅为何在无人可见时产生拖动声
  - 深处房门后的相框/照片内容是什么，是否与当前案件有关
ending_state: Day 2约02:18，周衡与梁策退回804门口/玄关边界，门挡仍固定房门且七楼退路可见；804客厅木椅再次发出摩擦声，深处房门已开出一条缝
