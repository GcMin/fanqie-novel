ending_state: "Day655夜母亲仍合法真住新荷街，青白碗与个人单碗双碗作品归自己；韩姨独持高结加三针的菜车与购物小票，当前试走无擦而长效未知；孩子自持红七角轮左偏纸车和不同路由，旧仁合里四楼禁返住及F014/R-12未证。"
