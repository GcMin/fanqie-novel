ending_state: "Day217 20:00第215夜班，窄铁片受控移入市政设施技术保管室至Day222 16:00，原设施所仍管历史来源与另两拆件，旧原柜环境异常记录留存；14错路原印11控3未收及两影印独立，沈家私人册不交，旧字作者与F008/M004/M005未证。"
