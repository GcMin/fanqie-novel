ending_state: >-
  Day 22 22:25，第二十一次夜班继续。四辆受阻车辆已全部安全离开，东出口B保持封闭待维修，西出口正常承担离场；旧商业停车场停用与现公共停车场CPT-206在用已有完整普通连续链。ARC-031 complete，不建立异常候选。
next_entry: >-
  第122章只能从22:25之后新的现实服务需求重新建立事件。不得把汇景广场旧商业停车场、CPT-206、历史别名待审核或ARC-031继承为异常前提；先处理人员安全/基本服务，再判断是否存在最小核验必要。普通原因足够即收口，不新增F008，不重开F009，不提前确认M004，不触碰M005。
