chapter: 32
title: 夜班旧册
arc: ARC-002
summary: >-
  Day 2 20:41起，周衡、梁策、夏宁沿第31章旧回访附件留下的原册索引“夜联-2015-09-B”追查中心自身纸质历史。现行文档目录不能直接识别旧册号，但2016年纸档数字化移交清单确认该编号是2015年9月同月分册之一，2016年3月补扫，146页，后续盘点状态仍为在库；A/B/C只是同月实体分册顺序，不代表上下半月。三人依中心历史业务资料夜间查阅规则完成双人登记，在三楼历史业务资料间找到实体档案盒，先保留箱标、封条、页序与登记来源，再按日期和流水号定位到第87页。该页00:46记录LJ-150907-0041，地址“青梧苑13栋”，事项为东梯公共照明反复熄灭，00:49转安泰物业，00:52物业登记WX-150907-041，01:12反馈已修复；页边手写备注明确写“地址索引未检13栋 / 按原述转物业核址”。页脚只有“夜联二席”席位章和不完整交班号，不能锁定具体人员。前后页另有新路名/新交付小区因地址库滞后而被标记“地址未更新/待核”的普通案例，后续均补回标准地址，因此“地址未检”本身不能被当作异常专用标签。0041页特别之处在于安泰仍能正常接单、到场、维修和回访，且现有E-07/WX/HF/旧回访附件又能独立证明历史13#建筑与住户链，而2016接管表和现行资料后来不再承认13栋。页后内部回执索引条同时保留2016.03扫描号ATT-20150907-041-2，使纸册、补扫清单与第31章电子附件形成实体来源链。21:15夏宁续联钱先生，其仍可正常应答、无新不适、自述在原长椅附近；轨道方仍未定位本人或黑色帆布包，也没有新的精确电量。21:29原册按页序归还并完成登记，三人决定下一步先查2015年夜联使用的地址索引版本及交接方式，不按“夜联二席”追具体人员。
meaningful_changes:
  - 第31章只存在于附件索引中的“夜联-2015-09-B”被确认有可追溯实体原册、2016补扫移交链和后续在库盘点记录
  - 中心2015纸质夜联原记录第一次明确证明当时值班人员已经人工意识到“青梧苑13栋”无法在地址索引中检出，但仍按原述转安泰物业核址处置
  - 通过相邻普通地址库滞后案例建立对照，确认“地址未检/待核”不是异常专用分类，避免把普通职业流程误写成秘密规则
  - 0041纸册页、内部回执索引条、2016补扫清单与ATT-20150907-041-2电子附件形成完整实体来源链，调查从物业历史正式进入中心自身纸质职业史
  - 钱先生第二张工单继续维持安全联系，位置和黑包仍未解决
new_information:
  - 夜联-2015-09-B为2015年9月同月分册之一，2016年3月补扫，现册146页，后续盘点仍标记在库
  - 第87页00:46原始纸质登记为LJ-150907-0041/青梧苑13栋/东梯公共照明反复熄灭，00:52已形成WX-150907-041，01:12反馈修复
  - 第87页备注为“地址索引未检13栋 / 按原述转物业核址”，说明地址冲突在2015人工纸质流程中已被明确记录
  - 页脚只有“夜联二席”席位章和不完整交班号，当前不能用于锁定具体经办人员
  - 相邻普通事项也有地址索引未更新或地址待核记录，并能在后续补成标准地址
  - 页后回执索引条注明2016.03扫描ATT-20150907-041-2，连接实体原册和第31章旧附件
open_questions:
  - 2015年夜联使用的是哪一版地址索引，青梧苑13栋为什么当时检索不到而安泰物业仍能正常核址处置
  - 这套纸质地址索引/交接资料后来如何迁移到2016后的体系，是否留下13栋被删除或未移交的正常业务痕迹
  - “夜联二席”对应的具体人员当前不应追查；永安里最后一次相关夜间处置者仍不得提前锁定
  - 2016接管楼栋表为何只列7至12，而2015中心/物业/工程资料形成完整13#建筑及住户链
  - 永安里6栋201仍缺独立历史纸档证明，失址完整机制与工单系统来源仍未知
  - 钱先生实际位置和黑色帆布包仍在哪里
ending_state: Day 2约21:29，周衡、梁策、夏宁已归还夜联-2015-09-B原册并回到夜间综合服务中心正常工位；可确认2015纸质夜联人员当时已人工记录13栋地址检索冲突并完成正常物业转办。下一步优先查当年的地址索引版本/更新与交接记录，而不是按席位章追人或把旧册解释成系统起源
