schema_version: 1
chapter: 14
title: 永安里
arc: ARC-001
summary: >-
  周衡在804门外第一次向梁策说出自己记忆中的地名“永安里”，但仍明确区分私人记忆与外部证据。由于此前许可只用于检查故障灯和人员位置，二人重新取得804未知男性“看吧”的口头许可后，仅从深处房间门口继续拍摄墙面旧照片，不移动相框。最上方一张旧集体照中出现白色搪瓷牌“永安里居民区”；周衡先保留全景和原图，再在不告知目标地名的情况下把照片发给夏宁，夏宁独立读出“永安里”，使该地名第一次成为可由他人复核的外部物证。周衡随后向梁策说明自己长期记得住址为“永安里6栋201”，父母却一直否认曾在那里居住，并在记录中注明照片只确认永安里与6栋，不证明201。墙上另两张维修/集体照片带有2015.08与2015.09冲印日期，其中仍可见疑似年轻陈德福。二人完成拍摄后退出804，未知男性要求“老陈回来让他进来”；周衡将下一步明确为核查十一年前的物业、维修和地址记录。
meaningful_changes:
  - 永安里从周衡私人记忆疑点升级为梁策、夏宁均可独立复核的照片文字证据
  - 周衡第一次向梁策完整披露自己记忆中的童年住址“永安里6栋201”以及父母否认该经历的事实
  - F004完成阶段性回收：804墙面视觉证据明确指向永安里
  - 2015年冲印日期把调查方向从804现场核查扩展到十一年前的历史物业/维修/地址记录
new_information:
  - 804墙面旧集体照可清楚辨认白色搪瓷牌“永安里居民区”
  - 夏宁在未获知目标答案的情况下独立读出该地名
  - 周衡明确记得童年住址为永安里6栋201，且父母长期否认曾在那里居住
  - 两张804旧照片冲印日期分别为2015.08、2015.09，维修照仍可见疑似年轻陈德福
  - 804未知男性同意查看照片，退出前仍要求老陈回来后进入804
open_questions:
  - 2015年前后永安里、13栋和陈德福之间发生过什么
  - 正常物业、维修和地址档案中是否还保留永安里或13栋记录
  - 照片中疑似年轻陈德福的人是否确为陈德福
  - 周衡为何仍能记住永安里，而父母和公开记录均否认其存在
  - 804未知男性的身份与其时间认知状态
ending_state: Day 2约02:44，周衡与梁策已退出804站在新增八楼走廊，804门恢复关闭但未反锁；手机与夏宁本地均已保存“永安里居民区”及2015冲印日期照片，下一步准备核查十一年前的物业/维修/地址记录
