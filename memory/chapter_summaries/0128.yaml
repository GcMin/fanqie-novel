summary: >-
  方女士陪坐轮椅的母亲在新港路—栖霞街人行天桥东侧遇到无障碍升降平台PL-17锁闭，现场终端却仍显示“设备可用”。中心先确认两人均安全、无急性医疗需求，并明确不得抬轮椅走楼梯或进入机动车道。道路设施夜间值守确认PL-17因下层门联锁闭合信号不稳定已于19:59按规范切断运行授权并机械锁闭，不能旁路载人。路面巡查实走约470米的栖霞街北口地面信号过街无障碍绕行路线，确认坡道、照明、信号正常并清理坡道口横倒单车，随后现场引导两人于20:57安全到达西侧公交站附近。现场复核查明东侧绕行牌被维护员临时放进维护间后遗漏；维修工单只有单一“已放置提示”勾选项。公开终端持续显示可用则因设备故障停运与公共服务中断需分别提交，本单漏提后者。20:49夜间值守补提后终端改为故障停运并显示北口绕行，东、西两端提示也补齐。PL-17仍保持锁闭、待配件复检；20:59只建立双入口提示/状态联动的白班整改项，不写成流程已完成。ARC-036普通闭环，不建立异常候选。
meaningful_state_changes:
  - 方女士与母亲从无法判断如何无障碍过街推进为经现场确认的安全替代路线抵达西侧公交站附近。
  - 东侧公开终端由错误“可用”纠正为“故障停运+北口绕行”，东、西两端现场提示均实际补齐。
  - PL-17继续保持故障锁闭、待配件复检，人员服务完成与设备修复状态明确分层。
  - ARC-036建立并在同章以普通设施故障、提示执行遗漏和服务状态漏提完成闭环。
knowledge_updates:
  - PL-17门锁着是门联锁不可靠时的规范安全隔离，不是异常或错误停运。
  - 维修系统设备故障停运与公共导向服务中断当前为两个需分别提交的状态，本单漏提交服务中断。
  - 多入口设施使用单一提示勾选项可能遗漏入口级执行，本次东侧提示牌实际遗留在维护间。
open_questions:
  - PL-17何时完成配件维修与复检属于正常设施维护，不构成下一章调查任务。
  - 白班是否最终修改多入口提示确认/状态联动流程尚未完成，仅记录整改项已建立。
