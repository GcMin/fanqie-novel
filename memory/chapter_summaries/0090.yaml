chapter: 90
title: 北校区挂在哪里
arc: ARC-009
summary: >-
  Day 17 00:31—00:38，第十六次夜班尾段，三人在第89章供水工单已经普通闭环后，只围绕“市九中北校区现行目录归属”提交最小协查：读取中心教育基础服务目录数据说明后确认目录每日接收教育基础信息交换数据，对象层同时包含“教育单位”和“办学地点”；责任挂接以单位为主，但地址检索理论上也应索引办学地点。柳桥路142号当前无法命中，因此协查只问市九中近三年组织/校区调整、柳桥路142号现行单位/办学地点代码与状态，以及教育交换源数据实际向中心发送的对象，不查询学生名单。Day 17 20:12第十七次夜班读取白班回函：三年前教育资源调整后，北校区不再作为独立教育单位编码，组织主体统一挂在“临江市第九中学”下；柳桥路142号并未撤点，而是状态“在用”的附属办学地点，代码`LJ09-S02`，主校区为`LJ09-S01`。区教育夜间值守表、供水客户等继续使用“北校区”作为实际地点标签并不等于其拥有独立单位代码，因此“中心目录没有第二个独立学校单位条目”由普通组织口径完整解释。继续核中心目录为何地址搜索仍无法命中时，最近一次教育交换源包显示市九中一条单位记录及S01/S02两条办学地点记录均已发送；中心接收摘要记录总数一致，`LJ09-S02`在02:13:44进入“写入成功”，但字段说明表明该状态只代表接收暂存区写入成功，后续还需对象归一后生成服务地点表与搜索索引。当前服务地点表按市九中上级单位代码只返回S01，在线归一日志能看到S01完成，却没有S02的成功、失败、拒绝或过滤记录。团队因此把疑点从“学校/校区是否存在”继续收窄为“已成功进入接收暂存的S02为何没有进入当前服务地点表”，当前仍不建立异常候选；20:34只提交同批次其他`site`归一结果、S02字段命中情况和02:13后的处理轨迹核验，优先普通映射、状态过滤、父子关系或ETL/索引规则原因。
meaningful_changes:
  - 市九中北校区现行组织归属首次明确：北校区不是独立教育单位，而是临江市第九中学名下状态在用的附属办学地点`LJ09-S02`；“未单列第二个学校单位条目”由普通制度口径闭环
  - 柳桥路142号没有撤点，主校区`LJ09-S01`与北校区`LJ09-S02`的单位/地点层级被分开，夜间值守表和供水业务中的“北校区”名称不再被误当成独立组织代码证明
  - 最近教育交换源包与中心接收暂存均明确包含S02，但当前服务地点表/搜索索引没有S02，调查从机构归属问题收窄到“接收暂存→对象归一→服务地点表”这一具体数据生成链
  - 当前无证据支持主动删除或失址，团队只保留S02归一规则/处理轨迹最小核验，不查询学生个人身份、不重开永安里居民层，也不触碰M004/M005
new_information:
  - 三年前组织调整后市九中只有一个教育单位主体；柳桥路142号作为附属办学地点继续在用，代码为`LJ09-S02`，主校区为`LJ09-S01`
  - 中心教育基础服务目录每日接收教育单位`unit`与办学地点`site`两类对象；责任单位展示与地址索引并非同一对象层
  - 最近完整教育交换源包含S02，中心接收暂存于02:13:44记录S02写入成功；该成功不等于后续服务目录生成成功
  - 当前服务地点表只返回S01，在线归一日志有S01而无S02对应处理记录，S02在暂存后的具体去向尚未查清
open_questions:
  - 同批次其他`site`记录是否正常完成对象归一并进入服务地点表，S02是否因普通字段映射、状态过滤、父子关系、去重或ETL规则被处理
  - S02自02:13:44接收暂存成功后实际经过了哪些处理节点，是否存在正常日志留存/批次切换/索引生成原因
  - 若普通数据规则完整解释S02未进入当前服务地点表，应立即收口并重排后续；当前不得将缺失过程记录写成主动删除或失址
  - 永安里6栋201居民身份/实际居住/住房使用关系终止时间、M004/M005、完整失址机制和周衡记忆原因继续未知且不重开
ending_state: Day 17约20:34，第十七次夜班进行中。市九中北校区“挂在哪里”已经得到普通制度答案：柳桥路142号作为市九中名下在用附属办学地点`LJ09-S02`存在，未单列独立教育单位正常；但最近教育交换源包与中心接收暂存均有S02，当前服务地点表/搜索索引却没有它。第91章只能核S02从接收暂存到对象归一/服务地点表的处理规则与轨迹，优先普通数据原因，不建立异常候选。
