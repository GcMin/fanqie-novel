schema_version: 1
chapter: 91
title: 送进来的那一条
arc: ARC-009
summary: >-
  Day 17 20:46—21:11，第十七次夜班继续。数据值守返回第90章20:34提交的S02最小核验：`LJ09-S02`接收暂存并未失败，状态、上级单位、地点类型均有效；教育交换近期对附属办学地点的字段填法调整后，实际地址稳定进入“详细办学地址”，而部分“通用地址”继续继承上级单位地址。中心仍使用旧版归一模板，办学地点优先读取通用地址，导致S02被归一成市九中主校区地址，与S01生成相同地点去重键，并于02:14:05进入“重复地点合并”。重复合并记录保存在独立批次审计中，不显示于此前查看的在线归一完成/失败/过滤结果页，因此形成“暂存有S02、当前地点表只有S01、在线归一页又看不到S02”的表面断点。同批次另有少数附属办学地点出现同类结果，排除市九中特例；数据组用修正字段优先级做只读重放后，S02以柳桥路142号独立生成且不再与S01重复，另外两条同类记录也恢复。中心不直接改教育源数据或夜间生产目录，规则修正、受影响批次复核和回填转数据组正常变更；市九中责任主体挂接始终可用，主要影响附属地点地址搜索/展示。21:06学校目录核验按普通地址映射兼容问题闭环，不建立异常候选，ARC-009学校数据线完成。21:11新的真实来电进入：东桥区广宁街五户居民因楼内水管爆裂已经撤离，无人受伤，街道短信要求前往“旧二职校西门”临时安置点，但现场沿西侧围墙找不到入口，老人和孩子在雨中；中心先让老人儿童到街角便利店檐下避雨，并准备核安置点实际开放位置和值守接应。
meaningful_changes:
  - S02暂存后的去向首次得到完整普通数据链解释：旧版地址映射误取主校区通用地址，随后与S01产生相同去重键并进入重复地点合并
  - “在线归一日志没有S02”被澄清为结果页不展示后续重复合并事件，不再作为未知处理断点
  - 同批次对照与修正规则只读重放确认问题属于中心附属办学地点地址映射兼容，不是市九中北校区被单独删除或失址
  - ARC-009学校目录线普通闭环，规则修正/回填转正常数据质量流程，不建立异常候选且不继续查询学生个人层
  - 21:11新真实工单建立下一入口：五户居民已安全撤离但在雨中找不到短信所指临时安置点西门，现实遮雨与接应优先
new_information:
  - S02源记录详细办学地址始终为柳桥路142号，通用地址则继承市九中主校区地址
  - 旧版中心归一模板对办学地点优先读取通用地址，造成S02与S01重复；02:14:05存在可审计重复地点合并记录
  - 重复地点合并记录位于独立批次审计，不出现在此前查看的在线归一完成/失败/过滤结果页
  - 修正字段优先级的只读重放可以让S02和其他同类附属办学点恢复为各自实际地址；生产修正仍需正常变更/回填
  - 广宁街五户居民因楼内水管爆裂撤离后，被短信导向“旧二职校西门”临时安置点，但现场未找到入口且开始下雨
open_questions:
  - “旧二职校西门”是入口名称变化、围墙/施工调整、临时安置点实际入口改设、短信模板滞后、值守接应问题还是其他普通原因，尚未核实
  - 五户居民需要先进入可遮雨且已确认开放的实际安置位置，不能为核门牌让老人儿童继续淋雨或翻越围栏
  - 永安里6栋201居民身份/实际居住/住房使用关系终止时间继续未证且无新必要性；M004/M005和完整失址机制继续未知
ending_state: Day 17约21:11，第十七次夜班继续。市九中北校区S02数据链已由普通地址字段映射兼容问题完整解释并转正常数据质量整改，ARC-009学校目录线收口。新的广宁街五户居民安置工单刚进入：居民已安全撤离、无人受伤，老人儿童先到便利店檐下避雨；短信所指“旧二职校西门”现场未找到入口。下一章必须先核真实安置接应与可进入位置，再查入口/值守/短信/资产记录的普通原因，不得直接写成地点消失。
