schema_version: 1
chapter: 55
title: 沿革底册里的名字
arc: ARC-005
summary: >-
  Day 4 21:03起，东桥区旧城历史建设资料室对第53章07:48提交的卷级调阅申请完成授权流转。回函确认2010年旧城门楼牌整编第4批原卷现行馆藏号为DQ-JS-2010-MLP-04，117—146页当前在馆且页序连续，129页在册；资料室16:42已完成卷册核验。2014数字化质检退件事实继续有效，2017整册移交后东桥区在2021年另做过馆内保护性利用采集，因此129页现有可读利用影像，但该采集不替代原件数字化归档。本次只读授权仅开放126—131页和对应目录/来源索引。三人先核126—128页及130—131页，确认这几页使用一致的“历史登记片区/原门楼牌对象/调整类别/来源依据/去向或后续索引”表式，且同册包含重编、注销、转后续批次等不同正常处置。129页的“历史登记片区”字段明确写“永安里”，调整类别为“旧城居住区整编转出”，来源为2010年第4批门楼牌整理通知，门楼牌详项指向后续索引DQLP-2010-04-B3；页脚注明详项随迁出对象清册核对、原登记片区名保留作历史检索。三人只据字段把结论推进为“永安里进入正式门楼牌沿革资料链”，没有将其扩大成“永安里6栋201已证”，因为129页本身没有6栋、201、住户或具体详项。21:24夏宁仅以129页自身后续索引申请B3迁出对象清册只读调阅，未输入周衡、6栋201或住户姓名。21:27本章结束，S2-07仍待实物确认。
meaningful_changes:
  - 2010年第4批原卷从“2017整册移交/Day 4馆藏未知”推进为东桥区当前实物核验已完成：117—146页在馆且连续，129页当前在册
  - 129页首次把“永安里”带入正式门楼牌沿革资料链，但实际字段仅为“历史登记片区”，不能替代具体门牌、建筑地址或住户登记
  - 126—131页前后连续样本证明129页属于正常同表式登记环境，而非孤立抽页；同册多种处置类型继续压住以批次替条目补原因的错误
  - 129页自身后续索引DQLP-2010-04-B3提供下一层迁出对象清册入口，21:24已提交最小范围只读调阅
new_information:
  - 东桥区现行馆藏号为DQ-JS-2010-MLP-04；Day 4 16:42完成卷册核验，117—146页在馆且页序连续，129页在册
  - 2021年东桥区做过馆内保护性利用采集，129页有可读利用影像；该影像只供利用，不替代2014正式数字化失败状态
  - 129页“历史登记片区”为“永安里”，调整类别为“旧城居住区整编转出”，来源依据为2010年第4批门楼牌整理通知
  - 具体门楼牌详项不在129页，后续索引为DQLP-2010-04-B3迁出对象清册
open_questions:
  - DQLP-2010-04-B3实际记录到片区、建筑、门牌还是其他对象层级，当前仍未知
  - B3是否包含能独立推进“永安里6栋201”的具体建筑/门牌/住户信息仍未知，不得预设正向结果
  - BK-JBS-160114-03对应旧导向牌Day 4是否仍在S2-07仍未知
  - M003目标人员、完整失址机制、工单系统来源及周衡为何保留永安里记忆仍未解决
ending_state: Day 4约21:27，周衡、梁策、夏宁仍在第四次夜班。永安里第一次出现在已获授权核验的正式门楼牌沿革底册中，但字段层级只是历史登记片区，6栋201与住户层仍未取得。DQLP-2010-04-B3迁出对象清册只读申请已受理，下一章只能按其实际开放字段继续，不得由129页先补出建筑/住户答案
foreshadowing_touched:
