summary: >-
  Day 19 03:57，第十八次夜班继续。北桥区清运司机在花圃路生鲜市场后巷封闭垃圾房准备执行凌晨收运时，清运工老邹听见纸箱暂存区有敲击声；司机在首次压缩前立即执行车辆急停并断开取力，中心要求维持停机、控制钥匙、禁止普通人员进入或移动可能压人的堆物，并联动消防、120和市场夜间值守。04:03市场按自身权限隔离垃圾房内电源，里面一名姓蒋的男子能够回应，自述为捡纸箱进入后右腿被纸箱和周转筐卡住。04:06消防到场，在确认压缩车停机后从外侧清理挡门纸箱，发现男子没有被机械部件压住；04:11移开周转筐和纸板后脱困。其右小腿存在擦伤和轻微肿胀，04:16接受120建议前往医院进一步评估。救援完成后只核事故直接链：03:41监控显示男子未经许可尾随水产档口员工刷卡进入垃圾房，侧门正常自闭；03:44其抱纸板接近出口时门边周转筐倒下，随后被堆物遮挡并受困；03:52保洁将整理好的纸箱推至暂存区外侧但未发现内部有人；03:56清运车进场。市场与清运单位确认当次装车前没有完成垃圾房内部、门后及纸箱暂存区的完整目视清场。04:23消防确认无其他人员，现场移除阻挡通道的堆物并重新完成清场；04:27清运恢复。市场将侧门禁止尾随、门口不得堆放遮挡内侧推杆/视线物品，以及“市场值守一次+清运司机一次”的双重清场确认纳入后续执行。04:31工单按“未经许可尾随进入+侧门自闭+门边堆物倒下受困+装车前清场确认不完整”的普通人机安全事件闭环，不建立异常候选。
meaningful_changes:
  - 被困人员从封闭垃圾房内受困且清运车即将开始作业，推进为压缩程序未启动、消防04:11安全救出并由120送医进一步评估。
  - 事故进入路径由监控确认：人员未经许可尾随刷卡员工进入，侧门正常自闭，门边堆物倒下后受困；不存在“人员异常出现”证据。
  - 当次装车前完整目视清场缺失被现场确认并修正；侧门口堆物清除、内侧推杆验证正常，04:27正常清运恢复。
  - 市场与清运单位新增双重清场确认并明确禁止尾随进入/遮挡门内推杆与视线，现实人机安全边界得到具体改变。
  - ARC-020完成，不建立异常候选，不新增F008，不重开永安里居民身份层，不触碰M004/M005。
knowledge_updates:
  zhou_heng:
    - 知道本次垃圾房被困险情有完整普通链：尾随刷卡进入、侧门自闭、堆物倒下受困、装车前清场不完整；监控和现场状态足够闭环，无需扩大调查。
    - 知道清运设备尚未执行首次压缩，老邹听见敲击后叫停和司机急停是避免人机事故的直接安全节点；险情未实际升级不等于前置安全检查可以省略。
  liang_ce:
    - 知道救援前普通人员不应自行进入、搬动压人堆物或操作清运设备；消防到场后由专业人员确认受力和脱困方式。
  xia_ning:
    - 知道本次记录必须区分被困者自述、消防现场受力确认、监控进入路径和清运清场执行状态；“我以为里面没人”不能写成已完成清场确认。
