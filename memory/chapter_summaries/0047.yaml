chapter: 47
title: 指向哪里
arc: ARC-004
summary: >-
  Day 3 22:16起，瑞景苑4栋普通工单完成后，周衡、梁策、夏宁继续第三夜班；BK-JBS-160114-03/S2-07实物核验仍在正常盘点队列，三人没有催样本间或绕过权限。周衡转而追问2011旧槐荫路B口导向图为何会写“永安里”。夏宁不按地名泛搜，而从该旧图图框的编制依据字段反查到市级公共导向底图来源GGDX-2010-11（临江市旧城片区公共导向底图，2010年11月版），再按来源编号与旧B口图幅调阅只读历史快照。该底图的数据字典说明“公共导向点”用于公共空间方向指引，可采用正式名称、历史沿用名、约定俗成居民地名等，但不生成门楼牌编码、不替代标准地址基础库，也不作为住户登记依据。旧B口图幅中存在公共导向点YD-073，名称“永安里”，类别“居民地（沿用名）”，状态“可用于公共导向”。随后核2011轨道旧导向图审核附件，确认B口导向项目明确引用YD-073，因此2011轨道资料中的“永安里”可追到轨道体系之外的市级公共导向来源，而非轨道资料内部自循环。22:36后三人又沿YD-073所在历史图幅查看同期可见标准地址快照；该快照的道路、门楼牌和建筑地址对象中未见以“永安里”为名称的标准地址对象，但只记录为该版本/图幅/当前可见范围的阴性结果，不扩大成“永安里从未有正式地址”。周衡最终把证据拆成两层：公共导向层已由2010底图YD-073、2011轨道引用和2016实体导向牌形成连续来源；正式地址层仍未取得“永安里6栋201”的独立门楼牌、建筑地址或住户登记链。22:49 S2-07仍无新状态，三人继续普通值守。
meaningful_changes:
  - “永安里”从2011轨道旧图和2016实体导向牌，进一步追到轨道体系之外的2010市级公共导向底图GGDX-2010-11及公共导向点YD-073，历史公共导向来源首次形成独立跨体系链条
  - 2011轨道B口导向审核附件明确引用YD-073，排除了目前证据仅为轨道系统内部材料互相引用的可能
  - 公共导向层与正式地址层被明确拆开：公共导向系统可使用历史沿用/约定俗成居民地名，但不生成门楼牌或替代标准地址基础库
  - 同期可见标准地址快照在目标图幅未见“永安里”标准地址对象，但该阴性结果被严格限制在版本/图幅/可见范围；永安里6栋201独立历史证明仍缺失，M003未提前完成
  - S2-07实物盘点继续按正常权限等待，没有因调查推进而强行取得结果
new_information:
  - 2011旧槐荫路B口导向图的公共导向底图来源编号为GGDX-2010-11，对应临江市旧城片区公共导向底图2010年11月版
  - GGDX-2010-11旧B口图幅中存在公共导向点YD-073，名称“永安里”，类别“居民地（沿用名）”，状态“可用于公共导向”
  - 公共导向数据字典明确该图层可使用历史沿用名/约定俗成居民地名，但不生成门楼牌编码、不替代标准地址基础库、不作为住户登记依据
  - 2011轨道B口导向项目审核附件明确引用YD-073
  - 同期目标图幅的可见标准地址历史快照中未见以“永安里”为名称的标准地址对象；当前只能保存该快照的阴性结果
open_questions:
  - 更早或其他来源的正式门楼牌、建筑地址、住户登记资料中是否存在永安里及6栋201，当前仍未知
  - BK-JBS-160114-03对应实物Day 3是否仍在S2-07，仍待正常盘点
  - 永安里6栋201独立历史证明、M003目标人员、完整失址机制、工单系统来源及周衡保留记忆原因均未解决
  - 钱先生旧站体验、旧广播、P17-D17观察差异和00:28/05:08时间差仍保持未解释
ending_state: Day 3约22:49，周衡、梁策、夏宁仍在临江市夜间综合服务中心第三夜班。永安里历史公共导向层已由2010市级公共导向底图YD-073、2011轨道B口导向引用和2016实体牌形成跨体系连续证据；同期标准地址快照当前可见范围未补上正式地址对象，6栋201仍无独立历史证明。S2-07实物核验继续等待正常盘点。第48章应收束第二卷阶段证据层级，而不是继续无边界扩搜
