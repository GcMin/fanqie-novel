  - "彭芮不尝试越过锁门，由道路岗核实并清障后实际步行到合法站前广场；未确认搭车或回家。"
  - "本商圈便民屏一处过期蓝线按源真实下架，但转发截图与其它地图副本是否修好仍待核。"
  - "2016年4月11日夜间临护得到另一个有实物出入登记的独立业务来源，仅支持临护实事而不认红痕作者或原物同一。"
