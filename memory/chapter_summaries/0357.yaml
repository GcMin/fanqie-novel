summary: >-
  Day219 20:23彭芮在白榆旧站东侧便利店合法公众侧收到旧路引导困惑，手机看的是别人转发的商圈便民屏错误步行图截图而非实时导航：西侧真实公众路面恢复字样套在旧全站图，蓝线错误穿越仍锁着的东工门，彭芮未翻围栏且仅同意本次回话号码。20:38道路有责值守确认东工门和维修便道仍非公众通道；21:06现场巡查实核南侧合法信号人行路并清移占道围栏后核净宽，21:17彭芮本人到达站前广场，不证明搭车或回家。22:04商圈便民屏运营岗位查旧手工路线与新文字错套，真实下架一处错误蓝线、保留操作源；其他商圈屏、截图传播及外部地图未核，不能冒称全网纠正。Day220 09:42马芸在可检目录找到2016年4月夜巡临护用品周转册，11:28获限项阅准，12:07见原册4月11日22:34两卷警戒带领给巡查小组、次晨07:51返库一卷另卷现场耗用及白班接续号；13:19出具去身份摘录，15:02资产主管核两独立来源只可支持当晚确有临护，17:27中心限项知悉。该周转册不记红痕、执笔者或旧衬身份，不能证明4月11日22:17巡修栏当时即时写成，旧字作者年代、2011相似衬件与Day195现片唯一同一、沈家原册同源均未知。16:48受托技术保管方仅回当日监测未报需升级的外部异常，不是长期保管合格证明。20:00第218夜班；带字窄片依旧技术受托至Day222 16:00，外板支件不随，14旧错原印11受控3未收及2照片复制分管，沈家私册仍妹妹家，东工门维修道禁公众，F008/M004/M005不证。
