chapter: 92
title: 安置点的西门
arc: ARC-010
summary: >-
  Day 17 21:12—21:34，第十七次夜班继续。广宁街五户居民因楼内水管爆裂撤离后，被街道短信导向“旧二职校西门”临时安置点，但现场找不到入口且开始下雨。中心先核当晚安置任务而不是让居民继续找门：街道确认旧二职校体育馆20:58已激活，现行任务入口为“广宁支路南门”，两名现场值守21:05已到岗。夏宁取得值守电话后让值守主动带伞前往西侧便利店接人；21:18确认五户全部接到，21:22五户居民均从南门进入体育馆临时安置区，照明、卫生间和饮水可用，现实安置需求闭环。随后核场地与通知链：旧校园原西侧人行门在两年前围墙/消防通道改造中正式封闭，竣工资料和照片均支持，现行场地基础信息早已只列广宁支路南门为夜间入口；当晚安置点激活任务也使用南门。错误来自居民转移短信模块仍调用改造前的旧模板，模板把“旧二职校西门”写死，因此形成值守按现行任务在南门、居民按短信到西侧的普通信息错位。21:25街道向本次五户补发南门更正短信，原错误短信保留；模板正式修正和其他旧入口文本排查转白班平台维护。21:28来电人确认五户均已入内，21:31该安置工单按“旧入口已改造封闭 + 通知模板滞后”普通闭环，不建立异常候选，ARC-010作为短弧完成。21:34公共线路再次出现来电提示，但地址、诉求和原因均未建立。
meaningful_changes:
  - 五户居民从雨中等待和入口未知推进为由安置点值守主动接应，并于21:22全部进入可用临时安置区
  - “找不到西门”取得普通实体解释：原西门在两年前围墙/消防通道改造中正式封闭，现行夜间入口为广宁支路南门
  - 当晚激活任务和值守位置本身正确，错误定位为居民转移短信模块仍使用改造前旧模板
  - 街道完成本次更正短信并保留原始错误通知，模板修正和旧文本排查转正常白班维护
  - ARC-010《雨里的安置点》普通闭环且不建立异常候选；下一章从21:34后的新来电重新建立事实
new_information:
  - 旧二职校体育馆临时安置点Day 17 20:58已激活，现行夜间入口为广宁支路南门，现场值守21:05已到岗
  - 原西侧人行门在两年前正常围墙/消防通道改造中封闭，当前西侧为连续围墙
  - 安置点基础资料和激活任务已更新为南门，但居民转移短信模板未同步，仍写旧“西门”入口
  - 本次五户21:25收到更正短信，正式模板修正需按正常配置审核执行
open_questions:
  - 21:34进入的下一通真实来电地址、诉求、现实风险和责任链尚未建立
  - 永安里6栋201居民身份/实际居住/住房使用关系终止时间继续未证且当前无新必要性
  - M004主动维持/删除因素、M005工单系统来源、完整失址机制及周衡为何保留永安里记忆仍未知
ending_state: Day 17约21:34，第十七次夜班继续。广宁街五户居民已完成临时安置；旧二职校原西门由两年前正常改造封闭，现行南门正常启用，居民误走西侧由旧短信模板滞后完整解释，ARC-010完成且不建立异常候选。公共线路刚出现下一通来电提示，下一章必须从接听后的真实地址和诉求重新建立事实，不得继承安置点已闭合事项作为异常前提。
