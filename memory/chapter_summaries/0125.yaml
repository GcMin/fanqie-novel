summary: >-
  Day 23 21:03，第二十二次夜班继续。两个独立来电分别从车辆与公交站方向报告槐滨路—春渡街路口南侧行人绿灯与东进口左转箭头同时放行，已发生一次急刹近险但无人受伤、无碰撞。中心立即联动交警与信号维护，不让市民自行进入车道指挥。21:08交警到场暂停冲突方向并人工控流。中心摘要页仍显示三日前下发的主方案B7，但原始状态确认20:58通信波动后控制器进入LOCAL并调用本地备用F-2。F-2形成于前三个月道路拓宽施工第二阶段，当时东进口左转车道被实体围挡封闭、相关灯头临时遮挡，因此其相位输出不会形成现实交通冲突。三日前道路恢复时左转车道与灯头重新启用，主方案B7、检测器映射与车道导向均已更新，但本地失联备用方案未被列入恢复通车核对项，F-2继续保留。今晚通信交换设备保护重启使控制器短暂掉入本地模式，旧备用方案才第一次在恢复后的道路组织下暴露冲突。21:24起交警封控相关进口，维护人员按现行道路组织写入新备用方案F-5并在人工控流条件下逐相位测试；21:34经交警同意恢复自动运行，21:38多周期稳定。维护方建立白班复核任务，只核近期道路恢复/车道重新开放路口是否同步更新本地失联备用方案，当前仅记录任务已建立，不写成全市已检查。21:42现实安全处置关闭。ARC-034按普通道路恢复配置漏项+通信失联调用旧备用方案完整闭环，不建立异常候选。
meaningful_changes:
  - 路口从存在行人/左转冲突放行和近险，推进为交警现场人工控流、维护更新备用方案并完成多周期验证，21:38恢复稳定自动运行且无人受伤/无碰撞。
  - “中心页面B7正常但现场两边绿灯”的表面矛盾被分层为最后下发主方案与控制器LOCAL本地备用实际运行状态；普通通信波动+旧施工备用方案未随道路恢复更新解释完整。
  - 维护方建立近期道路恢复路口备用方案白班复核任务，用于预防同类风险；仅为任务已建立，不提前写成已全面复核。
  - ARC-034在本章complete；不新增F008，不重开F009/F010，不提前确认M004，不触碰M005。
knowledge_updates:
  zhou_heng:
    - 知道信号中心摘要页“当前配时方案B7”实际描述最后确认下发的主方案，控制器掉通信进入LOCAL后可能运行本地备用方案，二者不能互相替代。
    - 知道本次F-2是施工阶段备用配置，三日前道路恢复时主方案已更新但备用方案漏出恢复通车核对项；20:58通信波动才使旧F-2暴露现实冲突。
    - 知道当前路口已由专业维护写入F-5并在交警控制下完成多周期验证，但其他近期恢复路口只进入白班复核任务，不能写成已经检查完成。
  liang_ce:
    - 知道交通信号专业判断与配置修改均由交警/信号维护负责，中心只做服务联动和证据分层；普通链完整后不扩大为异常调查。
  xia_ning:
    - 已分别保存两通原始来电、交警监控复现、主方案B7页面、LOCAL/F-2实际运行状态、恢复通车检查单、F-5测试恢复结果及白班复核任务状态。
    - 继续区分通信恢复、信号恢复、复核任务建立和全量复核完成，不以后一层状态覆盖前一层记录。
