schema_version: 1
chapter: 1
title: 夜班
arc: ARC-001
summary: >-
  周衡在失去原物业工程工作后，以外包身份进入临江市夜间综合服务中心上第一晚夜班。
  他认识调度员夏宁和资深外勤梁策，并通过工具检查与普通井盖工单建立了基本带教关系。
  零点十七分，系统生成“青梧苑13栋704”生活噪音投诉，但常规地图和夏宁的认知都确认青梧苑只有12栋。
  梁策没有要求修改地址，而是让周衡打印工单并直接接单。周衡点击受理后被系统列为现场处置人员，随后准备与梁策前往青梧苑。
meaningful_changes:
  - 周衡从新入职观察者转为异常地址工单现场处置人员
  - F001/F002正式激活
  - 周衡与梁策建立初步外勤带教关系
new_information:
  - 青梧苑官方资料只有12栋
  - 工单系统认可13栋704为有效地址
  - 梁策对地址矛盾表现出既往经验
open_questions:
  - 13栋704是否能在现场找到
  - 梁策为何要求保留纸质工单
  - 异常工单为何无法正常转派
ending_state: 周衡与梁策准备离开夜班中心前往青梧苑；夏宁留守调度
foreshadowing_touched:
