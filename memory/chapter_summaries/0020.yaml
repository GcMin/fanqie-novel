schema_version: 1
chapter: 20
title: 已经改名的车站
arc: ARC-001
summary: >-
  Day 2约05:24后，轨道运营方回传历史站务资料，确认临江南站旧名为“槐荫路站”：2008年投入运营时为二号线东南端终点，2012年9月东南延伸段新增六站后改为中间站，2016年1月才更名为临江南站，因此钱先生所说“槐荫路 + 二号线终点”对应的是2012年9月以前的站点状态。运营方同时提供2011版槐荫路站周边导向图扫描，B口附近历史地标中出现“永安里”；该扫描可追溯到运营方纸档目录号，但原纸档仍待白天借阅核验，当前临江南站站务库已无“永安里”地标。钱先生另报出当前临江南站已不用、但2011旧站务资料可对应的柱号格式。05:32现行临江南站首班车正常进出，站务与监控仍未找到钱先生或黑色帆布包；05:34钱先生却称自己所在站台刚才没有列车进站，且仍无明显身体不适。梁策决定与周衡在运营方人员陪同下前往现行临江南站公共区域核对旧站布局，不进入轨行区、设备房或封闭通道；夏宁留守中心继续联系钱先生并保存资料。
meaningful_changes:
  - 钱先生口中的“槐荫路终点站”被历史运营资料定位到2012年9月以前的真实站点状态，而非单纯错误站名
  - 轨道运营2011旧站务导向图当前可见“永安里”地标，建立独立于804照片之外的槐荫路旧站—永安里调查联系
  - 钱先生所报旧柱号格式也能在历史站务资料中找到对应，当前定位错误解释进一步承压但仍未被完全排除
  - 05:32现行车站首班车实时运行与钱先生05:34所述“没有列车进站”形成直接时点对照
  - 下一步从中心查档转为在运营方陪同下前往现行临江南站公共区域核对旧布局
new_information:
  - 槐荫路站2008年投入运营时为二号线东南端终点，2012年9月延伸段开通后不再是终点，2016年1月更名临江南站
  - 2011版槐荫路站周边导向图B口附近历史地标中出现“永安里”，当前站务库已无该地名
  - 该旧导向图扫描可追溯到轨道运营纸档目录号，原纸档仍待后续正常借阅核验
  - 钱先生当前口述的站台柱号格式与2011旧站务资料一致，但当前临江南站已不采用该格式
  - 05:32现行临江南站首班车正常进出时未发现钱先生；钱先生05:34称自己所在站台没有列车经过
open_questions:
  - 钱先生实际位于哪里，为什么其环境同时符合十余年前槐荫路终点站的多项细节
  - 黑色帆布包当前在哪一列车或哪个空间，能否由现行运营体系找回
  - 2011旧站务图中的“永安里”具体对应什么范围，原纸档内容是否与扫描一致
  - 槐荫路旧站与永安里之间的历史关系是否能通过现场旧结构或更多独立档案继续核实
  - 工单系统为何仍能把旧站名自动映射到现行临江南站
ending_state: Day 2约05:38，周衡、梁策仍在夜间综合服务中心并准备前往现行临江南站公共区域，梁策携带2011旧站务导向图打印件；夏宁留守调度席继续与钱先生/轨道运营方保持联系。钱先生仍可电话联系、无明显不适，但现行站务与监控仍未找到本人或黑色帆布包
