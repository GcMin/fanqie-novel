schema_version: 1
chapter: 87
title: 公厕门口的时间表
arc: ARC-008
summary: >-
  Day 16 23:08—23:26，第十六次夜班继续。河滨公园北门公厕来电人站在自动门外，门口固定标识和城市服务地图均显示夜间开放，室内照明正常，但外侧感应门无法进入。中心先解决现实如厕需求：核实南广场公厕当晚正常开放、北门至南广场约400米主步道照明正常且无施工封闭后，23:10让可正常步行的来电人先前往替代点，23:14确认已到达并可使用。随后分开核北门设施与信息：公厕状态在用，正式开放时段06:00—24:00，无季节调整、临时停用或当晚计划检修；固定标识和城市服务地图均与正式开放目录一致。自动门控制记录显示22:48进入保洁钥匙开关触发的“清洁锁闭”，该模式禁止外侧感应开门但不关闭照明、排风和清洁用水，且无门机故障、消防联动、断电或强制检修。保洁记录显示22:46开始清洁、计划短时封闭至23:00，22:58已在移动端提交清洁完成并离开，但“清洁锁闭解除确认”为空，控制器也没有解除事件；现场本应摆放的临时清洁提示牌同样缺失。23:16公园巡查到场，从管理侧进入后确认内部无人、地面基本干燥、无检修或施工条件需要继续封闭；按授权流程将钥匙开关从“清洁”拨回“自动”，23:18平台记录恢复，随后完成外侧感应、防夹、内部手动出门和紧急开门检查，23:20正式恢复开放。公园方确认移动端清洁完成和门边钥匙开关是两套不互校验的动作，现有离场清单虽写“恢复开放”却未单列门控确认，因此补充两项普通整改：短时清洁锁闭必须摆放临时提示并标最近可用公厕方向；保洁离场前增加“解除清洁锁闭并确认自动门恢复”的独立确认。23:23回访向来电人说明正式开放时段未变、当晚只是清洁结束后漏解除锁闭。三人不建立服务边界异常候选，也不要求城市服务地图同步每一次十几分钟的现场清洁状态。章末决定不再寻找新的服务点样本，下一步只整理这一轮当前城市服务案件中各层“已证/未证”，准备收束ARC-008。
meaningful_changes:
  - 来电人的现实如厕需求从“被北门自动门挡在外面”推进为23:14已实际到达南广场公厕并确认可使用
  - 北门公厕“正式开放信息正确但现场门无法进入”的差异由22:48清洁锁闭与22:58清洁完成后漏解除这一普通操作收尾遗漏完整解释
  - 23:20北门公厕经有权限巡查现场确认、恢复自动模式并完成门控安全检查后正式恢复开放
  - 固定开放时段、城市服务地图、自动门控制状态、保洁任务完成记录和现场巡查被固定为不同证明层，没有互相替代
  - 公园方形成“短时锁闭临时提示+离场门控恢复确认”两项普通整改；本案不建立服务边界异常候选
  - ARC-008第79—87章当前服务疑点均已由各自普通原因闭环，团队决定不再新增样本，第88章转为只收束已证/未证与方法边界
new_information:
  - 河滨公园北门公厕正式开放时段为06:00—24:00，Day 16 23:07处于正式开放时段，固定标识和城市服务地图信息本身正确
  - 自动门22:48进入“清洁锁闭”；该模式禁止外侧感应开门但保持照明、排风和清洁用水，因此“室内灯亮但门不开”可以正常同时成立
  - 保洁22:58已提交清洁完成但未解除现场钥匙开关，控制器无解除记录；当晚也未按规定摆放短时清洁提示牌
  - 23:16巡查确认内部无人、地面基本干燥且无继续封闭必要，23:18恢复自动模式并测试，23:20正式恢复开放
  - 公园方确认清洁移动端完成记录与门边钥匙开关当前不互校验，离场流程将增加独立门控恢复确认
open_questions:
  - ARC-008当前不再存在需要继续向异常层升级的服务点；第88章只需整理第79—87章各类设施/记录/任务调度/实际服务/公开信息的证明边界
  - 永安里6栋201具体居民身份、实际居住、住房使用关系终止时间及2010核址原因仍未知且当前不重开身份层
  - M004主动维持/删除因素、M005工单系统来源、完整失址机制及周衡为何保留永安里记忆仍未知
ending_state: Day 16约23:26，第十六次夜班继续。河滨公园北门公厕已恢复正常开放，来电人的现实需求此前已由南广场替代公厕解决；本次差异由例行清洁锁闭结束后漏解除、现场临时提示缺失这一普通操作原因完整闭环，不建立异常候选。第79—87章当前城市服务样本均已有独立普通解释。第88章只能收束“已证/未证”和证据层方法，不得为了弧末再制造新的服务点测试或提前触碰M004/M005。
