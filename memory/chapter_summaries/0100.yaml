summary: >-
  Day 19 00:29，第十八次夜班继续。上一章末尾公共线路响起后，网约车司机报告长汀路与明德街十字路口四向信号持续全红，车辆开始鸣笛和试图抢行但尚无事故。中心先让来电人保持停车、不下车自行指挥，并联动交警与交通信号夜间维护；平台只显示信号机自00:24:38进入“保护运行：全红”，没有计划封路或临时管制任务。00:33交警到场确认四向机动车灯全红、人行灯禁行并开始人工控流；中心没有远程强制恢复时段控制。平台另有“输出反馈冲突 / 南进口左转灯组”报码，但周衡只把它当作系统检测结果，不直接写成根因。00:42专业维护到场，确认信号机本体仍在运行且保护条件未解除。南进口信号杆接线箱现场发现凝露，左转灯组回路绝缘异常；进一步检查确认灯具和主干线路正常，异常集中在接线箱端子连接处，可见端子氧化、密封胶条老化及凝露。维护人员在交警继续人工控流期间隔离该灯组，更换受影响端子、清理干燥并恢复密封；00:56线路复测通过，随后逐组核灯色输出与反馈。00:59故障报码消失，交警清空路口后，01:01信号机退出全红保护并恢复夜间配时；连续观察两个完整周期后，01:05路口恢复常态通行。01:07专业处置结论明确区分故障原因、系统响应与现实处置：接线箱端子连接绝缘异常为当前故障证据，全红是检测到反馈冲突后的安全保护，交警人工控流和专业修复/测试是现场处置。白班只继续同一接线箱完整密封检查，不扩查附近路口。01:10工单普通闭环，ARC-016完成，不建立异常候选；01:12三楼短暂安静，下一事件尚未建立。
meaningful_changes:
  - 路口从四向全红且车辆开始自行试探通行，推进为交警人工控流、专业维护修复并于01:05恢复正常信号控制，全程无事故。
  - 平台“全红保护”和“输出反馈冲突”没有被越级当作根因；现场检查首次把当前故障落实到南进口左转灯组接线箱端子连接绝缘异常及可见氧化/凝露/密封老化。
  - 工单记录明确拆分“故障证据 / 系统保护响应 / 现实处置”，避免把保护机制写成故障原因或用最终原因覆盖最初交通风险。
  - ARC-016按普通信号设施故障完整闭环，不建立异常候选，不新增F008，不重开永安里居民身份层，不触碰M004/M005。
knowledge_updates:
  zhou_heng:
    - 知道信号机进入全红保护只能说明系统采取了安全响应，不能单靠保护状态反推根因；当前根因需要现场线路/设备证据支持。
    - 知道长汀路—明德街本次故障由南进口左转灯组接线箱端子连接绝缘异常解释，修复和逐组验证后已恢复正常控制。
  liang_ce:
    - 知道信号故障未排除前应由交警先接管路面秩序，中心不应为了尽快“灭掉红灯”远程强退保护。
  xia_ning:
    - 知道工单应分开保存最初全红风险、设备报码、现场专业故障证据和最终恢复结果，不能写成“全红导致全红”。
