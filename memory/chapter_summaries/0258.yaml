summary: >-
  Day122 09:07物业高勤发现昨夜未经准入的东门访客待核附件图中含“凭中心受理编号，可联系原岗位见证人补办缺席签认”；夜班此前只误选“有工作凭据”，没放人。10:15物业经正式渠道请求仅核该字样，保护邱素英居住隐私；邱本人不愿被迫签“伪造”定性或旧夜岗缺席证明，只要求有限书面告知。11:43韩文舟本人同意中心受控核原回执，未授权公开私人旧簿。13:27有权岗核中心当初发出的原版回执根本没有补签文字，物业附件却多了该句及“回问原受理席”半行，能确认版本不一致但不证制作人、手段和传播渠道。17:46物业把错误材料类型纠为“来源待核图像”并保留旧记录，正式访客界面修正仍未完成。20:06第120夜班承接白班结果，21:38门岗进一步限定核查无原申请获准开门记录，不宣称全网删除或从未存在别的版本。邱在本日夜间取出同日凌晨本人签的拒访声明和有限告知，不签他人历史负向证明。F003限于当代图片伪授权风险，1996普通照明及M004/M005同源仍不证。
