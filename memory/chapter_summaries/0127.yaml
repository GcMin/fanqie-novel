summary: >-
  Day 24 19:56，第二十三次夜班开始，白班返回南桐巷144号院楼栋沿革材料和两年前历史名称兼容映射源任务附件。旧公房资产交接档案确认院内三栋住宅原为6/8/10号楼；2019年转街道托管后仅将内部资产名称改为西楼/中楼/东楼，并明确“不涉及门牌及楼栋号变更”，因此老8号楼与街道资产“中楼”是同一栋楼的现场楼号和内部资产名，两种称呼可同时成立。历史别名源任务原始表把“临江机修厂职工宿舍8号楼”的历史位置和建议关联对象都写为南桐巷144号院，但当时144号院只有院落级标准地址对象，没有三栋老楼的独立标准建筑对象。兼容映射工具把名称完全命中“8栋”的南桐家园8栋排在144号院前，经办人员选择第一候选；该条又因系统判为高匹配而未落入当时逐条抽查样本，最终错误关联生效并持续两年。该链完整解释第126章120被误导至南桐家园8栋，不形成异常候选。地址业务岗随后先将错误历史别名关系置为待停用，并于20:17确认已停用；旧名当前临时引导至南桐巷144号院，并标注“中楼，旧称8号楼，现场楼号沿用”，更细的楼栋标准化继续走正常地址维护复核。原错误关系、昨夜误导路线和原始搜索截图均保留，同批历史别名复核任务仅记录为已建立，不写成全批已完成。20:23 ARC-035 complete；20:26新的公共线路响起，但下一事件尚未建立。
meaningful_changes:
  - 144号院楼号沿革从“是否正式整编未知”推进为有源材料确认：6/8/10号楼未被正式改号，西/中/东楼只是2019年后的街道内部资产名称，中楼与老8号楼可普通并存。
  - “机修厂宿舍8号楼”错误指向南桐家园8栋从原因待核推进为完整普通链：旧楼缺少独立标准建筑对象、候选排序偏向楼号完全匹配、经办误选第一候选、抽样复核未覆盖该条。
  - 错误历史别名关系已由待停用推进为20:17确认停用，旧名临时引导改回144号院并保留“中楼/旧8号楼”内部提示；更细标准建筑对象仍为正常维护待复核。
  - ARC-035由active推进为complete，不建立异常候选，不新增F008，不重开F009/F010，不提前确认M004，不触碰M005。
knowledge_updates:
  zhou_heng:
    - 知道144号院6/8/10号楼没有因街道托管被正式改号，西楼/中楼/东楼只是内部资产名，老8号楼与中楼是同一实体的不同管理称呼。
    - 知道两年前历史别名错误关联有完整普通数据处理链，不是后来突然改写；第126章保存的错误路线和搜索结果继续成立。
    - 知道错误关系已停用，但是否补建更细标准建筑对象仍属正常维护，不能把临时正确引导写成全部地址标准化完成。
  liang_ce:
    - 确认普通楼号/历史别名链已足够解释公共服务误导，应关闭ARC-035并停止扩查患者、住户、产权或无关身份信息。
  xia_ning:
    - 已分别保存楼栋沿革源材料、历史别名源任务、候选排序/经办日志、昨夜原始错误路线、错误关系待停用与已停用两个状态，以及当前临时正确引导。
    - 知道同批历史别名复核任务只是已建立，不能写成全批已经检查或修复。
