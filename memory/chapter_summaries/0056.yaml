schema_version: 1
chapter: 56
title: 迁出批次里的对象
arc: ARC-005
summary: >-
  Day 4 21:31起，周衡、梁策、夏宁继续第四次夜班，DQLP-2010-04-B3只读申请因需东桥区资料室工作时段人工核验而整夜保持等待，三人照常处理积水、单元门、设备噪音等普通夜间队列；BK-JBS-160114-03/S2-07仍为待实物确认。Day 5 07:26东桥区早班回函，仅开放B3与129页后续索引直接相关的表头说明、第四至第六页及前后正常样本，不开放整份清册或姓名类字段。B3全名为《2010年第4批门楼牌整编迁出对象清册》，填表说明明确“迁出”是本批门楼牌登记对象退出当前底册、转入后续住址核对专卷的业务动作，人口迁移/户籍变更另按相应登记资料核对，因此不能把清册标题直接理解为居民搬离。B3按历史登记片区、组号、对象类别、对象数量、原登记范围、处理方式、承接索引登记；永安里对应B3-17，对象类别为“建筑门楼牌登记对象”、对象数量8项、处理方式为“转住址核对专卷”，承接索引DQ-DZHD-2010-17。页脚同时说明组号只用于清册分组/承接索引，不替代门楼牌编号；当前开放片段没有6栋、201、具体门牌或住户姓名。07:39后三人只查看DQ-DZHD-2010-17目录元数据，确认该“东桥旧城住址核对专卷第17组”包含建筑地址对应表、门楼牌来源核对表、居住登记关联索引、来源核验附件目录等材料类别；居民姓名层需另说明具体业务对象和必要范围。07:43夏宁仅申请建筑地址对应表与来源核验附件目录，沿用历史服务记录地址归属核验用途，没有输入永安里6栋201、周衡或居民姓名。07:50交班前申请仍待核定开放范围。
meaningful_changes:
  - “永安里”从129页的历史登记片区字段进一步进入B3建筑门楼牌登记对象组，正式地址调查首次获得从片区层继续追建筑地址的独立业务承接链
  - B3中的“迁出”被明确限定为门楼牌业务中的登记对象转册，不等同人口迁移或居民搬离，避免把资料标题当作剧情事实
  - B3-17被确认只是清册组号，不是17号门牌；“8项”只是登记对象数量，不能写成8栋，更不能据此补出6栋201
  - DQ-DZHD-2010-17目录建立建筑地址、居住登记关联与来源核验附件的合法下一层入口，07:43已只申请建筑地址对应表和来源核验附件目录
new_information:
  - DQLP-2010-04-B3为2010年第4批门楼牌整编迁出对象清册，其业务“迁出”指登记对象转后续住址核对专卷
  - 永安里对应B3-17，对象类别为建筑门楼牌登记对象、数量8项，承接索引为DQ-DZHD-2010-17
  - DQ-DZHD-2010-17为东桥旧城住址核对专卷第17组，目录含建筑地址对应表、门楼牌来源核对表、居住登记关联索引与来源核验附件目录
  - 当前授权仍未开放永安里具体栋号、门牌号、房号或住户姓名
open_questions:
  - DQ-DZHD-2010-17建筑地址对应表实际记录哪些建筑/地址对象，是否存在可独立推进6栋201的字段仍未知
  - 来源核验附件目录中保存了哪些历史业务来源，是否会自然连接到夜间中心更早的纸质处置史仍未知
  - 居住登记关联索引当前只知道存在，尚无具体对象和必要性进入姓名层
  - BK-JBS-160114-03对应旧导向牌Day 5是否仍在S2-07仍未知
  - M003目标人员、完整失址机制、工单系统来源及周衡为何保留永安里记忆仍未解决
ending_state: Day 5约07:50，第四次夜班接近交班。B3已确认永安里对应的是8项建筑门楼牌登记对象并承接至DQ-DZHD-2010-17，但具体建筑、6栋201和住户姓名仍未取得；建筑地址对应表与来源核验附件目录只读申请已受理，S2-07继续待盘点。第57章只能读取下一层实际开放结果，若出现旧中心抄件也先核编号/来源链，不直接追具体人
foreshadowing_touched:
  - F003
