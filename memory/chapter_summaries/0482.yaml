  Day345 08:27西陇社区活动室志愿者小乔把第十二号箱旧卡似车轮画误宣传成“找到失散多年借书人”，配图仅新绘示意，非偷拍旧卡；借修车书父子当场质疑，社区群无证点名严师傅，令其受到熟人来电。08:41许汀查传播来源，09:08留存原错宣传有源记录并公开更正，活动取消旧卡认亲但不宣称外传旧截图全部收回。09:30活动照常，严师傅不愿被公开叫上台自证，按本人意愿借榫卯图册。10:19专业保护人员告第十二箱两组贴页与旧卡无新变化，姓名栏不得为展览临时揭开。孩子自绘自行车去学校班级、本人和监护人按位置期限撤回规则签当次同意；12:06新画展示墙实际办成，两篮分放可公开和不展示的新作。13:30季唯误扫更正资料仅转有权审核，原整车十二箱全到系统状态未改；旧屋后檐短管仅排查排期未正式修复复测。16:46严师傅自愿匿名留评，17:02新画墙授权保留至周末、旧卡仍受控身份未知，缪芸只给新画留“画得很好”，旧箱笔记留空。无F003独立史料，F008/M004/M005未确证。
