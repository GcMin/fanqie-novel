chapter: 78
title: 留在记录里的位置
arc: ARC-007
summary: >-
  Day 15 21:02—21:41，第十五次夜班继续。公共线路先接入南仓路旧机修厂北墙外连续多杆路灯熄灭工单：来电人报告从公交港湾到前方小桥至少十余盏灯全黑，现场无人员受伤、倒杆、外露线缆或配电设施冒烟；中心以最近可见317号杆定位并转市政照明夜间维护，不预判是支路掉闸还是控制故障。21:26现场人员到达并开始沿熄灭区段两端核查，21:41仅确认317号杆本体无故障，整段原因仍待逐杆/支路检查。等待现场回报期间，夏宁没有再打开新的历史资料申请，而是与周衡、梁策完成永安里6栋201阶段状态收束：`BK-JBS-160114-03`只保留“S2-11现物可定位/外部分类号与来源对象DX-B-06及架位匹配/牌面未复核”；`DQ-DZHD-2010-17`继续独立支持永安里6栋建筑地址；2010年6月六栋分户总表原卷第38页独立支持房号201当期状态“在用”；2010-06-29房管原卷独立支持六栋201一项“住房使用登记/登记使用/初始登记”。居民身份、实际居住和住房使用关系终止时间继续未证。周衡不再把这些空白写成默认“待查”，而明确记录“当前无必要新增身份层申请”；只有未来新的独立来源产生明确核验必要时，才重新判断是否打开身份层。夜间核址业务链继续按中心+东桥原记录保存，梁策本人只落在22:53 C-3转报人员节点，不被扩写为现场核址人员。内部状态由“继续核验”改为“阶段完成”，没有新建姓名、人口/户籍、公共服务或家庭关系申请。ARC-007因此完成；新的南仓路照明工单只作为下一阶段当前城市服务入口，章末仍是普通故障原因待现场核实，未被提前命名为异常。
meaningful_changes:
  - ARC-007《在架与在册》正式完成，永安里6栋201相关公共导向物证、建筑地址、分户地址、住房使用关系和具体居民身份被固定为不同证明层，不再互相替代
  - 居民身份/实际居住/关系终止时间从“空白就继续追”转为“未证且当前无必要申请”；身份层只有出现新的独立核验必要时才允许重新评估
  - 永安里当前调查状态由“继续核验”改为“阶段完成”，本章没有新增任何历史资料或身份字段申请
  - 周衡第一次在已经知道下一层可能存在的情况下主动停止沿家庭史继续下钻，把注意力转回当前夜班普通城市服务工单
  - 南仓路连续路灯熄灭工单建立新的现实入口：317号杆本体已确认无故障，但整段原因仍待现场排查，下一章只能读取真实现场返回
new_information:
  - Day 15 21:02南仓路旧机修厂北墙外出现连续多杆熄灭普通照明工单，最近可见灯杆为317号；暂无倒杆、外露线缆、冒烟或人员受伤
  - 21:26照明维护到场，21:41只确认317号杆本体无故障并继续向熄灭区段两端逐杆排查；故障原因尚未取得
  - 永安里6栋201居民身份层被明确标为“当前无必要新增申请”，不是“资料不存在”也不是“永远不查”
open_questions:
  - 南仓路连续熄灭区段的实际故障原因、受影响杆号/回路范围及恢复方式
  - 永安里6栋201具体居民身份、实际居住、周衡家庭关系以及2010-06-29住房使用关系后续是否/何时终止
  - 为什么2010-10-18夜间选择核4/6/7栋
  - 完整失址机制、工单系统来源、主动维持/删除主体及周衡为何保留永安里记忆
ending_state: Day 15约21:41，第十五次夜班继续。ARC-007《在架与在册》完成；永安里6栋201当前停在“地址层+具体住房使用关系时点已证，居民身份/实际居住/终止时间未证且无当前必要升级”的阶段结论。没有新的历史资料申请。南仓路连续路灯熄灭工单仍在处理中，317号杆本体无故障，现场正在沿熄灭区段继续排查；下一章只能依据后续现场真实回报推进，不能预设线路/资产记录异常。
