schema_version: 1
chapter: 57
title: 旧中心抄件
arc: ARC-005
summary: >-
  Day 5 20:06第五次夜班开始后，周衡、梁策、夏宁读取东桥区白班15:18完成的DQ-DZHD-2010-17授权结果。建筑地址对应表把此前B3-17的8项建筑门楼牌登记对象逐行展开为永安里1栋至8栋；因此第56章当时“8项不能先写成8栋”的保守结论仍然成立，而本章有了新来源后才可确认永安里6栋作为独立建筑地址对象存在。该表不含房号、单元或住户字段，所以201仍未取得。6栋与其他若干栋共同引用来源附件“附核-04”；来源核验附件目录将其标为2010年10月“夜间联动地址核查抄件”，来源单位为当时的临江市夜间城市联动值班室，原始记录索引为夜联-2010-10-C，本卷只保存转报抄件，原始值班登记按来源索引另存。目录没有经办人、值班员姓名或正文摘要。夏宁只用完整来源索引反查中心历史纸档目录，确认夜联-2010-10-C纸质记录家族存在，资料类别为“夜间联动值班登记及地址核查转报”；目录说明2012年机构调整后，旧夜间联动值班资料按年度并入现夜间综合服务中心历史档案保管。三人明确这只证明档案保管沿革和记录来源连续，不能把2010旧机构直接等同当前中心岗位或人员。附核-04关联范围仅为“永安里第17组部分建筑地址核查”，仍不提供201、具体来电或个人。20:31夏宁提交夜联-2010-10-C最小范围原册调阅申请，只申请与附核-04对应记录的页码、形成时间、地址核查转报字段和正文可开放范围，明确不申请人员字段、签字或姓名。随后一张燃气异味普通工单进入，中心先确认来电人已离开可疑区域并联动属地燃气抢修；20:42责任单位仅确认人员在室外等候、抢修人员赶往现场，最终专业结论尚未返回。S2-07仍待实物确认。
meaningful_changes:
  - B3-17的8项建筑对象由建筑地址对应表实际展开为永安里1栋至8栋，永安里6栋首次获得独立建筑层正式地址业务来源；201、单元和住户仍未取得
  - DQ-DZHD-2010-17来源附件目录出现2010年10月夜间联动地址核查抄件附核-04，并给出原始记录索引夜联-2010-10-C
  - 当前中心历史纸档目录可按夜联-2010-10-C追到对应纸质记录家族，正式地址业务卷首次与中心现存的更早夜间联动处置史建立跨部门来源连接
  - 人员索引虽然存在入口但没有被申请；20:31仅提交原册记录范围/业务字段最小调阅，M003目标人员未提前锁定
new_information:
  - DQ-DZHD-2010-17建筑地址对应表中永安里组实际为1栋至8栋八个建筑对象；6栋已证，但表内没有201或住户字段
  - 附核-04为2010年10月夜间联动地址核查转报抄件，来源单位是当时的临江市夜间城市联动值班室，原始记录索引夜联-2010-10-C
  - 夜联-2010-10-C在现夜间综合服务中心历史纸档目录中存在，2012机构调整后旧夜联资料按年度并入现中心历史档案保管；这不证明岗位或人员连续
  - Day 5 20:31已申请附核-04对应原始记录的页码、形成时间、转报业务字段及正文可开放范围，人员字段/签字/姓名未申请
open_questions:
  - 夜联-2010-10-C中与附核-04对应的具体页码、形成时间、正文及值班字段结构是什么，当前仍待档案保管岗核定
  - 永安里6栋201中的201是否能由后续正式地址或居住登记来源独立证明仍未知
  - 当年最后一次相关夜间处置人员仍未锁定；即使原册出现值班字段/签字，也需要独立来源交叉后才能推进M003
  - 燃气异味普通工单截至20:42只确认人员已在室外且抢修在途，专业现场结论与闭环仍待后续处理
  - BK-JBS-160114-03对应旧导向牌Day 5是否仍在S2-07仍未知
  - 完整失址机制、工单系统来源及周衡为何保留永安里记忆仍未解决
ending_state: Day 5约20:42，周衡、梁策、夏宁处于第五次夜班。永安里6栋已由建筑地址对应表获得独立建筑层来源，201仍未取得；附核-04把正式地址住址核对专卷连接到2010年旧夜间联动纸质记录家族夜联-2010-10-C，最小范围原册调阅申请已提交且不含人员字段。燃气异味普通工单已完成安全撤离/责任联动但仍待专业现场最终反馈；S2-07继续待盘点。第58章只允许先处理普通工单闭环并读取原册核定后的值班字段/席位/签批结构，不凭单份记录直接锁定具体人
foreshadowing_touched:
