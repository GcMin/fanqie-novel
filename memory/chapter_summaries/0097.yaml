summary: >-
  22:31一名配送骑手来电称杉桥路与河堤东街路口西北角一棵老悬铃木大枝劈裂，电动车被压但本人无伤，树冠仍有悬挂断枝，非机动车道和部分人行道受阻。中心先让骑手和行人远离树冠，道路巡查设警戒，绿化夜间应急在长期管养归属尚未确认时按公共险情先行排险。22:51悬枝受控处理，22:56主断枝分段卸下，23:04非机动车道恢复通行；骑手车辆留存损失记录后推往维修点，责任与理赔另行核定。排险后才核长期责任：现行道路绿化清单在路口前结束，河堤绿带图层只按片区登记，两套现行记录均不能直接返回单棵树责任；两年前道路绿化巡检照片则明确显示旧单株编号SQ-042，并备注分叉口旧修剪伤、愈合一般、建议后续复查。当前只保留上一期道路绿化合同、最近一次道路/河堤管养边界移交附件和双方现行巡检路线三项最小核验，不把旧编号当前不可检索写成资产消失，也不建立异常候选。
meaningful_changes:
  - 杉桥路路口断枝公共安全风险完成专业排险，23:04非机动车道恢复通行，无人员受伤。
  - 配送骑手从急于取车继续送单转为留在安全区，车辆损失留证后推往维修点，剩余配送任务取消。
  - 团队明确区分“眼前公共险情的临时应急处置责任”和“树木长期管养/后续责任”，长期归属未清不阻止排险，应急队先处置也不自动证明长期管养归属。
  - 两年前SQ-042历史巡检与当前两套现行管理记录形成窄责任核验入口；ARC-014由planned进入active，但当前不建立异常候选。
knowledge_updates:
  zhou_heng:
    - 两年前道路绿化巡检照片证明杉桥路与河堤东街路口西北角该悬铃木曾以SQ-042纳入正常巡检，并备注旧修剪伤需复查。
    - 当前道路绿化清单和河堤绿带资产组都不能直接用SQ-042返回长期管养责任；这只证明当前责任链尚未核清，不证明资产消失或主动删除。
    - 公共险情应急处置责任与长期管养责任属于不同层；前者可以在后者未即时明确时先行履行。
  liang_ce:
    - 当晚绿化险情先由专业应急人员处理，来电人、围观者和中心人员不得为了车辆、树牌或编号返回树冠危险区。
    - 应急先处置不代表应急单位自动承担长期管养或赔偿责任。
  xia_ning:
    - 现场树木状态只确认新鲜撕裂与旧修剪口周边状态需复检，夜间条件不足以把该处直接记成已确认腐朽。
    - 车辆受损、现场排险、长期管养核验和后续理赔分别留痕，不用其中任何一层替代另一层。
