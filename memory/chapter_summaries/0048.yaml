schema_version: 1
chapter: 48
title: 留在纸上的地址
arc: ARC-004
summary: >-
  Day 3 22:56起，周衡、梁策、夏宁确认BK-JBS-160114-03/S2-07实物核验仍为“待实物确认”，没有催样本间或继续扩大检索。因当前轨道协查权限将在次日下午到期，夏宁建立“来源/时间/业务用途/能证明/不能证明”的阶段核验表。三人先把804旧照片限定为现场保存物证：它确实拍到“永安里居民区”和与周衡记忆高度一致的6栋入口，但拍摄年代未独立确认，不能充当市级档案，也不能从6栋直接补出201。随后将2010市级公共导向底图GGDX-2010-11中的YD-073、2011轨道B口对YD-073的引用、2016实体导向牌，以及DX-B-06后续拆除/项目移交/北库实收/BK-JBS-160114-03分类/2019 S2-07留样拆成不同证据层：2016影像证明牌面实际使用“永安里”，后续物资链证明同一项目对象进入正常实物管理链，但后者不能反向证明牌面文字，也不能证明Day 3实物仍在架。同期目标图幅标准地址历史快照继续只保存为“当前版本/图幅/可见范围未见永安里标准地址对象”的有限阴性结果。周衡又把2015青梧苑“物业/工程/住户/中心业务链保留13#，上游标准地址快照只列1—12”单列为业务层分叉的方法案例，明确不能据此把两个案件解释成同一机制。704当前字段“周衡/永安里6栋201”则只证明系统当前如此显示，不能作为历史正式地址、周衡主动提交或住户登记证明。23:21后，夏宁把核验表附入“旧槐荫路B口历史导向资料阶段核验”，明确未来若继续查永安里正式地址，只从门楼牌编制、建筑地址、住户登记/迁入等对应业务源申请，不再让公共导向材料跨层替代；钱先生旧站体验、旧广播、P17/D-17和失物时间差分别保留，不由本资料线解释。23:27阶段核验说明提交，ARC-004与第二卷完成阶段收束。周衡最终把问题从“永安里有没有”改成“哪一层、什么来源”，记录为“公共导向：已证；正式地址：未证；6栋201：需要独立来源”，随后回到正常夜班。
meaningful_changes:
  - 804照片、公共导向、轨道引用、2016实体牌及普通物资链、标准地址有限阴性结果、青梧苑业务层分叉案例和704当前字段首次被统一按来源/业务用途/能证明/不能证明做阶段分层
  - 周衡的调查方法从二元追问“永安里存在/不存在”推进为“哪一层、什么来源”，并把后续正式地址入口锁定为门楼牌编制、建筑地址、住户登记/迁入等独立业务源
  - ARC-004阶段结论完成：历史公共导向层已经跨体系成链，正式地址层仍未闭合，S2-07当前实物状态继续等待正常盘点
  - 第二卷达到阶段结束状态，没有提前完成永安里6栋201、M003或完整失址机制
new_information:
  - 当前轨道协查材料被整理成一份正式的阶段核验说明，核心规则为“同名信息按来源和业务用途分别保存，不做跨层替代”
  - 永安里正式地址层未来可执行的独立来源范围被明确为门楼牌编制底册、建筑地址登记、住户登记或迁入类资料；当前状态统一记为“未取得”而非“无”
  - Day 3 23:27时BK-JBS-160114-03/S2-07仍无实物盘点结果
open_questions:
  - 更早或其他正式门楼牌、建筑地址、住户登记/迁入资料能否独立证明永安里以及6栋201
  - BK-JBS-160114-03对应旧导向牌当前是否仍在S2-07，仍待正常盘点
  - M003目标人员、完整失址机制、工单系统来源及周衡为何保留永安里记忆仍未知
  - 钱先生旧站体验、23:17旧广播、P17-D17观察差异、00:28/05:08时间差仍分别未解释
ending_state: Day 3约23:27，周衡、梁策、夏宁仍在临江市夜间综合服务中心第三夜班。旧槐荫路B口历史导向资料已完成阶段核验说明并停止继续扩搜；公共导向层已证、正式地址层未证、永安里6栋201仍需独立来源。BK-JBS-160114-03/S2-07继续等待正常实物盘点。ARC-004与第二卷阶段收束，下一章开始前需要先规划下一卷/下一短弧，不得直接沿本卷资料无限外扩
