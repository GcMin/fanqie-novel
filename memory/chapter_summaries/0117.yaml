summary: >-
  Day 21 23:47，居家安护终端向夜间中心发起紧急呼叫。78岁的韩素珍自述位于春澄苑7号楼102，起身时腿软后坐地，右髋区域疼痛、无法自行站立，独自在家且无法开门。中心优先联动120、物业和消防，不让当事人自行爬行、扒门或承担医疗判断。23:53物业到门确认房号和屋内回应，23:56 120到场，00:01消防按现场医疗进入必要性协助最小破拆，00:07韩素珍由120转送进一步检查，中心不预填骨折等诊断。救助过程中，居家安护平台却显示韩素珍的服务对象状态已于去年11月18日以“迁出本辖区”为由终止，紧急联系人因此不可用；与此同时，终端JH-07-102-44仍绑定在原服务地址，持续在线并有每月心跳/电池自检，今晚也正常发起求助。韩素珍上担架前自述“我可没搬家”，该话仅按当事人自述保存。夜间技术值守确认老终端硬件通信与业务服务档案可以分离，旧平台迁移、社区名单不同步、终止服务时未生成设备处置单等普通原因仍可能成立，夜间无权限解释去年业务状态。00:18团队只提交白班最小核验：查看去年11月18日状态变更依据、是否同时生成终端解绑/拆除工单、以及终止后JH-07-102-44为何持续在线绑定；不查询户籍、房产或长期居住隐私。00:22现实救助工单关闭，ARC-028启动，当前不建立异常候选。
meaningful_changes:
  - 韩素珍从独自在家无法起身、无法开门推进为物业确认、消防协助入户并由120安全转送进一步检查，现实人身风险完成专业交接。
  - “服务对象已迁出终止”与“终端仍在原地址持续在线并成功报警”被拆分为两个独立业务状态，差异从偶然页面提示推进为有明确设备号和历史运行记录的最小核验项。
  - ARC-028建立，后续被收窄到去年11月18日业务状态变更和设备解绑/拆除流程；当事人自述不替代业务记录，也不扩查户籍房产。
knowledge_updates:
  zhou_heng:
    - 知道韩素珍在春澄苑7号楼102通过安护终端发起真实求助，物业到门确认、120与消防完成进入和转送；当前现场存在/求助事实不等于证明长期居住、户籍或产权。
    - 知道安护平台服务档案去年11月18日以“迁出本辖区”终止，但JH-07-102-44仍持续在线、自检并在今晚正常报警；两层记录不能互相覆盖。
    - 知道普通旧平台迁移、名单同步或设备处置单遗漏仍可能解释当前差异，下一步只查业务流程记录。
  liang_ce:
    - 知道人身救助已经完成，去年服务状态没有夜间现实处置必要；要求先核流程、不要从居民身份开始扩查。
  xia_ning:
    - 已分别保存韩素珍原始求助与“我可没搬家”自述、平台“迁出终止”状态、终端在线/自检/报警记录、物业/120/消防处置结果和白班核验单，不用其中一层覆盖其他来源。
