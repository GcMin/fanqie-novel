summary: >-
  Day640母亲已在新荷街真住并保管房门两钥匙、正式住户卡及信箱短钥匙，甲乙箱青白碗蓝旧票盒、原双碗画废样、邹姨合作第一张、孩子旧署名船和新方窗船都在。Day639邻格韩姨转交的自寄明信片已收入抽屉，邮政错格质量反馈只有一次受理号没有调查结论。Day64007:37母亲本户信箱核空，物业公布当日10:00至11:30普通清沟。08:45预放三只锥桶和两袋物料已挤窄信箱旁正常住户石板路、现场暂挂“绕后门”牌；韩姨拖购物车去给妹妹送菜受阻。母亲拒擅改围挡或带人走无普通住户权限的后勤门，向物业许桐真报。09:07许桐实查并撤错误指路牌、有责让工人挪物料，韩姨空车试通；09:26清沟班长与许桐当次签认连续行人通路和工作范围。10:08母亲只从安全围挡外看一段沟内枯叶饮料瓶，未推旧年积水原因；11:38班组本段实清沟、盖板复位清场后许桐核现场并公告恢复正常通路，未承诺整院雨季永久安全。15:11韩姨买菜归来同母亲聊天，谈邹姨合作画、衣服袖口和尊重孩子决定新方窗船位；15:37韩姨按明示邀请在母亲新屋短坐约十五分钟，只看母亲本人歪双碗画及邹姨合作画、远看不摸孩子新船，未见蓝票盒或旧宅私档。21:24夏宁中心仅收仁合里旧四楼安全限项，R-12/F014无跨源进展。Day641晨母亲在正常已恢复的石板路与韩姨远远挥手，居民通路当次实际可用。
