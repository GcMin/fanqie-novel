schema_version: 1
chapter: 4
title: 多出来的路
arc: ARC-001
summary: >-
  周衡与梁策先检查围墙北侧消防门及墙外道路，物业赵全再次否认13栋存在。回到原坐标后，停车区草坪灯数次熄灭，每次亮起时冬青和围墙之间的空间都发生变化，最终出现一条此前不存在的窄路。夏宁从固定监控中只能看到二人站在冬青前，无法看见道路；周衡现场肉眼和手机相机却都能记录它。二人进入后发现定位失真、图片难以发送，并先后见到投诉人描述的坏路灯、梧桐和老式晾衣架。道路尽头出现一栋七层住宅楼，侧牌显示13。
meaningful_changes:
  - 周衡第一次亲眼确认现实空间可以出现正常布局无法容纳的道路和建筑
  - 13栋从异常数据地址升级为可见实体
  - 多媒介证据开始出现明显差异
new_information:
  - 异常道路现场可见且手机可拍，但同一时刻停车区固定监控看不到
  - 路内定位与图片传输出现异常表现
  - 投诉人此前描述的路线细节与新出现道路吻合
open_questions:
  - 道路为何只对部分观察/记录方式可见
  - 13栋内部是否真的存在704和住户
ending_state: Day 2约01:07，周衡与梁策站在异常道路尽头，确认前方七层住宅楼号为13
