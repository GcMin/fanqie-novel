  - "三种描纸处理产生可比较的视觉结果，但没有改动软版、制作第三张正式印样或借出原印。"
  - "活动室事项只推进到询问桌子位置与展示规则，尚未报名或取得展示授权。"
  - "孩子把下一步从继续造桥改为先做不承载空架样，并补入观察线不得被遮挡的第四项要求；样件未制作、未测试。"
  - "孩子确认周六三点踢球，不以纸车修复进度作为参加条件。"
knowledge_updates:
