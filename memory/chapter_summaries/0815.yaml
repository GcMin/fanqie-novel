  - "韩姨看见两张试印及三种描纸比较，只知道母亲暂不补线；没有借走原纸，也不知道白口真实成因。"
  - "孩子与晓漫知道原三项支撑条件及新增观察线要求；空架样只是计划，没有制作或验证。"
