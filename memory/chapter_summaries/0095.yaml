summary: >-
  Day 18 20:56—21:31，第十八次夜班继续。夜间药房转来配送协助：骑手依据订单中的“槐西高架桥下17号”到达高架西侧辅路后无法导航到收件点，前方还有隔离栏与匝道车流；收件人电话可正常接通，是槐西桥下便民停车场西区夜间值守人员，腿脚不便。中心先处理现实用药，不让收件人远距离穿越停车场，也不让骑手钻桥底或翻越隔离栏。收件人明确同意由停车场当班人员代取密封药袋；夏宁核到停车场现行对外入口为“槐西路206号附1号”东侧入口，骑手沿外围道路绕行约600米，停车场机动岗按订单尾号与收件电话核对后接取密封药袋并送至西区值守亭，21:14收件人确认包装完整、姓名正确，现实用药交付完成。随后再核“17号”：当前经营备案、现行场地图和公共地址库均使用“槐西路206号附1号/槐西桥下便民停车场/西区值守亭”，没有现行“桥下17号”正式门牌；2023年桥下空间安全整治前的运营交接附件显示，西侧该位置当时属于停车场内部“17号值守点”，整治后旧西侧通道/小门调整并统一对外入口，值守点继续存在但改称“西区值守亭”，内部数字牌不再沿用。药房客服又确认订单地址来自收件人多年前自行保存的历史配送自由文本，后续复购一直默认带出，不会每次与公共地址库重校验；熟悉片区的旧配送员通常能凭俗称和电话完成配送，今晚新骑手依赖导航才暴露旧文本问题。21:24收件人确认将未来默认配送地址更新为“槐西路206号附1号，槐西桥下便民停车场，西区值守亭”，本次原始订单仍保留旧文本并另存修改记录。21:31本单按“历史内部点位号 + 现行正式地址 + 配送系统历史自由文本”普通闭环，ARC-012完成，不建立异常候选，不扩查其他桥下旧编号。
meaningful_changes:
  - 夜间必要药品从“骑手已到附近但无法定位”推进为经收件人授权、现行安全入口和停车场值守协助，于21:14完整交付给收件人
  - “槐西高架桥下17号”对象层首次明确：它不是现行正式门牌，而是2023年安全整治前停车场内部“17号值守点”旧称，当前位置对应西区值守亭
  - 当前正式地址与历史内部点位关系被普通场地改造资料解释，公共地址库搜不到旧称不等于地点消失
  - 药房长期可使用旧称由客户历史自由文本+熟悉片区配送经验解释；未来默认地址已在本人确认后更新，原订单与修改记录分别保留
  - ARC-012普通闭环，不建立异常候选，不新增F008，不触碰M004/M005，也不重开永安里居民身份层
knowledge_updates:
  zhou_heng:
    - 知道槐西高架桥下17号是2023年整治前停车场内部值守点旧称，现行对外地址为槐西路206号附1号，旧点位现称西区值守亭。
    - 知道药房配送地址是客户历史保存自由文本，并非公共地址库实时生成；旧称长期有效可以由熟悉片区的配送经验解释。
  liang_ce:
    - 知道本次安全交付通过现行东入口完成，收件人明确授权停车场当班人员代取密封药袋；没有必要让骑手或收件人进入桥下危险区域验证旧编号。
  xia_ning:
    - 知道本次原始订单保留“槐西高架桥下17号”，未来默认地址在收件人确认后改为现行正式地址+西区值守亭，两个版本分别留痕。
