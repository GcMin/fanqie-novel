  Day360 08:57曹国荣到阿棋寄养点核旧合同11:12到期、下午一次已付上门服务不能代替接送手续；本人联系承运商，10:18确认14:10一辆接受固定箱的单程宠物运输车。10:59真签付延时照护至14:20，11:12原寄养期限届满而犬仍有责照护、不倒填老杜交接。曹父将旧搪瓷碗带回榆叶巷并放窗台下地砖，后巷清洁车虽未回但翘砖及旁停自行车继续影响通行。14:08有约车到，真实核运输箱固定和主人亲领、14:20前完成真实出舍并运抵旧家；14:53何师傅按原一次上门试行提前几分钟到场，阿棋在旧碗旁喝水但听公交气刹突然向外门前趋，由何师傅控绳，曹父膝盖发软扶桌，没人受伤。16:03服务如实记室内适应与风险、拒写已完成室外遛行；父亲自行决定不得当日永久留下。本人另约返程、核实机构夜间空位，17:21真实把犬送回原寄养点，由有责人员亲收，父亲亲签付费三天新的过渡寄养而不转让主人身份。曹茵晚间收到有限凭据并与父亲通话，20:26夜间中心仅按本人授权和有责记录限项登记短时离舍/实际返家/真回寄养三个状态。长远室外安全牵犬、后巷维修、连续家庭照护仍未落实，F003仍只是2019原簿第73页非身份栏式，F008/M004/M005无新增证据。
