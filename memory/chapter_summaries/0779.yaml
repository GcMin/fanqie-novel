summary: >-
  Day644母亲仍在新荷街合法独立居住，Day643分馆实名短展并16:03亲领回的歪双碗本人原画及旧匿名、新署名展签都留在甲箱，不以原作借展。09:17小吴来电仅传社区便民驿站询问；10:20母亲实看驿站墙面、助行器轮椅通道与坐姿观看高度，陆姓工作人员未提前接收作品。13:08母亲在松桥分馆重新登记开放手作台，独立试印两张，再于14:22印第三张新双碗画，右碗边沿留有可见小缺口，15:41纸干后在背面署本人姓名和日期；旧原画偶然错位不被冒充复刻。16:16母亲亲带新作到驿站，双方当面核尺寸作者和独立作品，签一周室内限项借展接收，不转借、不宣称永久馆藏、不授权网上宣传，展卡只署姓名不公开新住址电话。墙上旧挂点不匹配，改放固定矮柜上稳固桌面相框，另名工作人员实核通行后16:38正式陈列，等候老人实际看见。原画、两张未采用的试样、邹姨合作画、外甥亲选低柜内侧亲签方窗船仍按各自权属留新荷街；晓漫外甥仅得私聊有限信息，夜间夏宁仍只得仁合里旧四楼本人授权安全限项。Day639邮政错格质量反馈仅受理未结；仁合里旧屋闭锁双封水电隔离禁返住、整班守门与新开门许可未落实，R-12/F014历史旧证无新跨源证明。
