summary: >-
  Day54308:37母亲在禾汀首层同房从公共厨房断裂夹子联想前日杜阿姨旧青布背带借还口述。杜阿姨10:17主动回电话，找到自己私用的旧借物册，念到青布带、小吴借、外侧勾并说明此本不是按日记账，所谓勾仅是自己月底看见东西在柜子里的核物记号，而非借用人当面归还签名；楼里和邻街均曾有人被叫小吴，没日期也不能确认对应本户旧搬家。母亲在蓝夹旧记录旁补记新解释，不抹旧文字。午间晓漫到禾汀听后把背带借还人改记为疑似小吴且身份日期用途未知，不把小吴作为人名公开搜寻，尊重杜不能泄漏邻居号码；父亲当年修椅、母女相处与外甥纸仓门延续。15:42杜本人同意由孙女只发旧册相关局部照片，青布带字样可见、前小字模糊、勾在还栏外、扣松补针字样无日期无作者；照片和杜当代解读均不足以鉴定木箱搬运或证明亡夫修过背带。17:30妹妹通话仅记年轻人骑三轮带绳却不知姓氏，母亲另页写不构成小吴辨认。20:56母亲亲回拨夜班中心，夏宁周衡梁策仅记录有源私人有限图片与杜自述，四楼不开封、清运不恢复，Day54407:06交班时晓漫语音决定暂不在旧群搜人。禾汀商户真付到Day549午两卡可开双箱不搬且无本日新款；四楼旧12cm口亡夫板分封单照明有限其余水电隔离整屋禁返住，五楼旧漏源无结论，F014旧联系号码最初来源、历史通知本人收悉、旧押金各渠道实退及2019旧案无跨源证。
