summary: >-
  Day163 20:17第161次夜班，夏宁收到次日上午新公交站坡板施工整改完成、拟专业复验通知，非站点迁移令；21:09郑师傅想按Day161即两夜前的过期撤旧单拆旧站剩余设施，中心拒越权。牛青的母亲膝盖术后用带轮助行器，错误地图显示新站，牛青只限同意转达需要可达路线，不传病历。Day164 08:00交白班，09:48坡板独立专业分项复验合格，10:06公众路口连续通路因带电临供箱及护栏阻塞未通过，围挡仍封；11:19禁止让公众由装卸车道绕入。13:26按权协调有资质供电班与道路责任人合法调整，14:55箱体保护复核完成，16:08实测全段、16:36正式获得这段通路本次专业合格记录。牛青母女从合法原站实际乘车去医院，具体就诊结果未知。运营主管仍未发新站生效令，旧站继续依法停靠，Day161提前卸下的两块旧线路板继续封存，车辆语音与第三方地图待逐端核。Day164 20:00第162夜班夏宁真实接班，不能把两份合格单推出迁站完成。白榆路另案工门仍封、雨棚卡10取6余4、普通夜间代拨公话无准；F003历史旧人实听回话及2018 A2同笔、F008新增可靠记忆样本、M004/M005仍未确证。
