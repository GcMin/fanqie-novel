ending_state: "Day649夜新荷街本人正常真住，前租客封口旧信已被本人合法真领且物业暂存结存关闭，母亲不冒名签保管；邮政Day639错格仍待核、Day648外号牌已修，两者不混。家中母亲蓝椅与孩子赠红杯独立私藏、驿站本人《两只碗》短借展继续，仁合里旧屋闭锁双封禁返住R-12/F014未证。"
