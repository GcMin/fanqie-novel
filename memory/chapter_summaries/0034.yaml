chapter: 34
title: 同步清单
arc: ARC-002
summary: >-
  Day 2 22:21起，周衡、梁策、夏宁沿DZFK-150907-06直接引用的来源批次进入基础数据交接档，查到《2015年9月第一批标准地址同步清单》。该批次数据时点为2015-08-31 24:00，由“临江市标准地址基础库”下发，夜间综合服务中心于09-01 05:42接收并做格式/条数校验后生成只读夜联查询索引。青梧苑在该上游快照中一期楼栋范围为1—6、二期为7—12，二期六条住宅楼栋子项也只见7至12；13栋没有独立条目、删除/停用标记或当批变更项。由于该快照早于09-07的LJ-150907-0041，可确认夜联当晚查不到13栋并非0041工单发生后才在中心内部产生。交接来源链只能追到“临江市标准地址基础库”批次/日间维护责任字段，现有夜班权限看不到青梧苑项目为什么形成1—12的原始建设、门牌或申报材料。周衡再对照2016物业接管楼栋表，结果同样只列1—12，但该表没有2015标准地址批次号或可证明同源的来源编号，因此只记录“结果一致、来源关系未证”。三人由此收束ARC-002：2015中心标准地址链继承的上游快照本身已只列1—12，而同期E-07工程图、WX维修、ATT回访/刘桂兰13#704等正常物业/工程/住户链仍保留13#建筑；当前只能确认不同正常业务链在2015年已经分叉，不能解释为中心夜班删除、人为阻止或建筑物理不存在。22:44轨道方回报现行临江南站公共区域、权限内指定区域、当班车辆清检和失物登记已完成本轮核查，仍未找到钱先生或黑色帆布包。22:46夏宁续联钱先生，其可正常应答，无头晕/胸闷/心慌，仅称久坐腰酸，仍自述在原长椅附近，常用药仍在黑包。中心与轨道方把后续处置改为暂按30分钟固定短联络、轨道值班保持响应；一次未接先立即回拨并通知轨道值班，连续失联、出现症状或位置变化时立即升级人员查找/医疗协助。22:52周衡完成记录，青梧苑档案线暂时停在标准地址源上游边界，钱先生工单继续处理中。
meaningful_changes:
  - 2015中心标准地址链的来源从“维护侧标准地址源”推进为可核验的上游同步批次：2015-08-31快照本身已经只列青梧苑1—12，且早于0041工单
  - 当前证据进一步排除“0041之后由夜联中心把13栋从标准地址表删除”这一省事解释；历史分叉点被上移到中心接收标准地址快照之前
  - 2016物业接管表虽然同样只列1—12，但没有来源编号证明与2015标准地址批次同源，因此仍保持来源关系未证边界
  - ARC-002完成阶段收束：正常标准地址链与正常物业工程/维修/回访/住户链在2015年已保存不同楼栋边界，原因未知
  - 钱先生工单从反复无结果的重复巡查转为固定安全联络+明确失联/症状升级条件，获得可执行的阶段处置方案但仍未办结
new_information:
  - 《2015年9月第一批标准地址同步清单》数据时点为2015-08-31 24:00，09-01 05:42由临江市标准地址基础库下发/中心接收
  - 青梧苑一期范围1—6、二期7—12；二期住宅子项只见7至12，13栋无独立条目、删除/停用标记或当批变更项
  - 中心在该链条中负责接收、校验和生成查询索引；现有夜班权限只能追到标准地址基础库批次，不能看到青梧苑最初楼栋边界形成依据
  - 2016物业接管表与2015标准地址快照结果一致但当前无证据证明同源
  - Day 2 22:46钱先生仍可正常应答、无头晕胸闷心慌，常用药仍在黑包；后续暂按30分钟短联络，失联/症状/位置变化触发升级
open_questions:
  - 临江市标准地址基础库为什么在2015-08-31快照中只把青梧苑列为1—12，其更早的建设/门牌/项目申报形成依据是什么
  - 2016物业接管楼栋表是否与2015标准地址源共享更早的上游资料，目前仍未证明
  - 为什么同期物业工程图、维修、回访和刘桂兰住户链能正常承认13#建筑，而标准地址基础库不含13栋
  - 永安里6栋201仍缺独立历史证明；M003、失址完整机制、系统来源和周衡保留记忆原因均未解决
  - 钱先生实际位置、黑色帆布包以及其旧站环境如何与现行临江南站并存仍未知
ending_state: Day 2约22:52，周衡、梁策、夏宁仍在临江市夜间综合服务中心第二夜班；ARC-002“纸档里的十三栋”完成阶段收束，青梧苑档案调查暂时停在上游标准地址快照边界。钱先生工单仍为处理中，22:46本人可联系且无新不适，中心/轨道方已建立30分钟固定短联络与明确升级条件，下一阶段优先回到钱先生旧站错位的实际处置
