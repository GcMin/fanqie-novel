timeframe: "Day 18 23:47—Day 19 00:29"
summary: >-
  Day 18 23:47，第十八次夜班继续。白榆路28号晴岚公寓B座居民来电称一层门厅和楼梯间有明显“像煤气”的刺激性异味；来电人已到室外，但其行动不便的父亲仍在五楼。中心没有先凭物业记录判断气味来源，而是按潜在燃气风险处理：要求来电人不重新进楼、不自行操作开关/电梯/阀门，联动消防与燃气应急，物业只做外围接应。23:55消防到场并携检测设备进入，随后协助使用助行器的老人沿确认过的路线安全撤至室外；00:01老人到达小区空地。燃气应急随后对楼外设施、公共区域、燃气立管及表前重点连接位置检测，未发现可燃气体异常或供气压力异常；异味最明显位置反而集中在地下一层污水提升设备间。燃气风险被专业检测排除后，物业工程才继续核其他来源。当天18:06—18:42该设备间曾进行污水提升井格栅/杂物清理，维护记录中的“检查盖板复位”签认为空。00:11排水维保人员按权限现场检查，确认提升井检查盖板一侧未完全压入密封槽、密封条局部翻边，设备本身运行正常且无污水外溢。00:14盖板和密封条复位，设备间原有机械排风启动；消防与燃气应急继续复核，公共区域异味逐步下降。00:22现场确认公共区域可分批返回且电梯可正常使用，老人由物业陪同乘电梯回家；00:26工单按“污水提升井维护后盖板密封复位不完整”普通原因闭环。原始“疑似燃气”来电、专业燃气检测结果、下午空签认和今晚复位/通风记录分别保留，不把最初风险描述事后改成“误报”。00:29 ARC-015续办栏清空，随后公共线路再次响起，但下一事件事实尚未建立。
meaningful_changes:
  - 行动不便老人从仍在楼内推进为由消防协助安全撤离，并在风险解除后由物业陪同正常返回，现实人员安全需求完整闭环。
  - “疑似燃气泄漏”从未知高风险状态推进为燃气专业检测未见异常；真实异味来源进一步定位到污水提升井维护后的检查盖板密封复位缺项。
  - 检查盖板与密封条完成复位、设备间通风恢复、公共区域异味下降，住户分批返回；下午原始空签认与今晚修正分别留痕。
  - ARC-015按普通维护收尾遗漏完成，不建立异常候选，不新增F008，不触碰M004/M005。
knowledge_updates:
  zhou_heng:
    - 知道晴岚公寓B座当晚真实存在刺激性异味，但现场燃气专业检测未发现可燃气体异常，不能用最终普通原因倒推最初消防/燃气联动没有必要。
    - 知道异味来自污水提升井检修后检查盖板密封未完全复位；现场当前状态与下午维护记录空签认分别保存，不靠人员记忆补事实。
  liang_ce:
    - 知道居民和物业在燃气风险未排除前不应返回楼内自行闻味、开关设备或试阀；专业人员到场后再按现场结果处理。
  xia_ning:
    - 知道“疑似燃气”是来电时的原始风险描述，后续检测排除燃气后也不应覆盖成“误报”；下午空签认与今晚复位记录继续分层留痕。
