schema_version: 1
chapter: 66
title: 他为什么没说
arc: ARC-006
summary: >-
  Day 9 07:49起，第八次夜班进入最后交班。周衡先把东景花园电梯困人工单明确交成“人员解困完成 / 二号梯停用待检”，没有把设备故障写成已修复；08:01白班接管后，周衡在离岗前直接追问梁策为何此前不主动说明与2010旧夜联永安里记录的本人关联。梁策承认第58章看到C-3时已经认出这是自己过去的记录联络席位，但当时只能确认席位，不能确认22:51—22:53具体动作一定由本人完成；他担心自报姓名会让调查先按熟人姓名反向检索，因此选择不说，并明确承认“什么都不先说明”是自己处理错了。周衡进一步追问第一夜青梧苑13栋时梁策为何立即要求不要改地址。梁策说明这是旧夜联长期工作形成的个人习惯：遇到现行地址表无法映射、但来话人位置描述稳定的情况，优先保留原始地址/原表述，核址与后续结果另行记录，不直接覆盖来话字段；他只能确认自己长期这样工作，不能确认当年是否有成文制度，也不能把普通查不到地址与当前异常机制等同。梁策还记得旧记录席旁曾有一类独立的地址待核/未映射补充登记，但准确名称、是否每班使用、2010-10-18永安里事项是否进入该类登记都记不清，明确拒绝用回忆补成事实。夏宁把三人的争论落成新的“本人关联”工作规则：材料出现当前组成员本人、旧席位、签字或明确经办关系时，被涉及者先说明本人关联，并区分独立来源已证、本人可靠记得、本人不确定；口述不替代证明，也不自动进入检索条件。梁策接受并承诺以后先说明“认出了什么 / 不能证明什么”。08:19三人准备离开，下一步只把“地址待核/未映射类补充登记”作为梁策口述待目录交叉，不按梁策姓名检索。
meaningful_changes:
  - 周衡与梁策的矛盾从“为何一直不说”推进为双方明确承认的信息披露问题；梁策首次承认自己把证据纪律扩大成了过度信息控制
  - 三人建立可执行的本人关联披露规则：独立来源已证 / 本人可靠记得 / 本人不确定分层，口述不替代证据也不自动成为检索条件
  - 梁策首次有限说明第一夜“不改原地址”的来源：旧夜联时期形成的保留原地址、核址另记工作习惯，但该内容仍只属于本人亲历口述，未被独立制度材料交叉
  - 取得第67章可合法核验的旧业务类别入口：旧夜联疑似存在地址待核/未映射类补充登记；准确名称及永安里是否入册仍未知
new_information:
  - 梁策不提前自报C-3关系的具体动机是避免本人姓名和口述先行改变调查路径；他承认这种做法造成新的信任与信息风险
  - 梁策可靠确认自己在旧夜联长期采用“保留原地址、核址另记”的工作方式，但不能确认其成文制度状态，也不能确认所有无法映射地址属于同一异常
  - 梁策记得存在地址待核/未映射性质的补充登记，但准确名称、永安里第17组是否进入其中、具体2010-10-18通话内容均不确定
  - 今后调查直接涉及本组人员本人时，必须先披露本人关联，同时继续把口述与独立证据分开
open_questions:
  - 旧夜联是否实际存在可与梁策口述对应的地址待核/未映射类补充登记，正式名称、保管状态和2010-10-18乙班是否有相关条目仍待独立目录/记录交叉
  - 永安里6栋201中的201、单元和住户层仍无独立历史来源
  - BK-JBS-160114-03对应旧导向牌Day 9当前实物是否仍在S2-07继续待正常盘点
  - 当年为何启动永安里第17组夜间核址、完整失址机制、工单系统来源及周衡为何保留永安里记忆仍未解决
ending_state: Day 9约08:19，第八次夜班已经结束，周衡、梁策、夏宁仍在中心离岗前区域。M003仍保持完成且证据边界不变；周衡/梁策已建立“本人关联先披露、口述与证明分开”的新合作规则。梁策提供了旧夜联地址待核/未映射补充登记这一有限口述线索，但正式名称和永安里是否进入其中均未知。第67章只能按2010年10月、旧夜联、乙班/地址待核业务类别做有限目录或记录交叉，不按梁策姓名捕鱼，也不让口述直接成为历史事实
