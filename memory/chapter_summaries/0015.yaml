schema_version: 1
chapter: 15
title: 十一年前
arc: ARC-001
summary: >-
  周衡与梁策在02:44安全退出804并沿仍稳定存在的新增楼梯下到704，告知刘桂兰已找到804但尚未确认住户，随后离开13栋回到正常青梧苑门岗。根据804旧维修卡底部的公司名，他们核对物业交接资料，确认临江安泰物业在2016年1月前负责青梧苑，旧通讯录中的工程主管陈德福手机号与804维修卡完全一致；但工程图纸、消防和屋面钥匙交接目录仍只列1至12栋。交接目录另显示2015年度维修单/回访记录有六箱纸质资料留存于物业地下资料间，需白班按手续调取。夏宁在中心侧定位到2014—2016旧夜间联动扫描备份，确认这批资料并未全部做全文文字识别，只能按日期、片区和原单位编码检索；安泰物业单位编码能够筛出2015年8至9月的原始扫描件。03:31周衡与梁策回到中心，三人开始从2015年8月3日的纸质夜间联动登记扫描件逐份核查。
meaningful_changes:
  - 调查从804现场空间异常正式转入2015年前后的历史物业与夜间联动资料核查
  - 陈德福与2015年前后青梧苑的现实物业任职关系及旧手机号得到独立资料交叉验证
  - 找到两条具体历史资料入口：物业留存的2015纸质维修/回访资料，以及中心2014—2016未全文检索的原始扫描归档
  - 当前系统搜不到永安里/13栋不再能单独作为“历史上没有记录”的依据
new_information:
  - 临江安泰物业在2016年1月前负责青梧苑
  - 旧通讯录记载陈德福为工程主管，手机号与804维修卡一致
  - 物业交接目录中的建筑/工程资料仍只列1至12栋
  - 2015年度维修单和回访记录有六箱纸质资料，当前位于物业地下资料间并需白班按手续调取
  - 夜间中心保留2014—2016原始联动扫描备份，部分正文未做全文文字识别，可按旧单位编码和日期筛选
open_questions:
  - 2015年8至9月原始联动扫描件是否出现13栋、804或永安里
  - 物业地下六箱2015纸质资料中是否存在与13栋或陈德福相关的记录
  - 为什么旧钥匙柜存在“13屋面”钥匙，而2016交接目录仍只列1至12栋
  - 804未知男性为何把已退休两年的陈德福认作刚刚离开的维修人员
ending_state: Day 2约03:31，周衡、梁策已回到临江市夜间综合服务中心，夏宁定位并打开2015年8至9月旧联动扫描归档；第一张2015年8月3日登记表已显示在屏幕上，尚未发现13栋或永安里的旧记录
