chapter: 67
title: 旧事只到这里
arc: ARC-006
summary: >-
  Day 9第九次夜班20:06开始后，周衡、梁策、夏宁先完整处理一张临河路老体育馆北侧辅路污水检查井冒溢普通工单：确认无人受伤、井盖完整后联动排水维护，现场设置临时围挡并清掏下游支管，20:36复查水位回落且不再外溢，20:41来电人确认道路恢复通行后办结，中心没有替专业单位猜测堵塞原因。随后夏宁只按2010年10月、旧夜联和地址核对/补记业务类别检索历史目录，没有输入梁策姓名或永安里6栋201，找到正式记录类别《来话地址补核登记簿》。目录与填写说明显示，该簿用于来话地址无法直接匹配当时现行地址表但位置描述足以继续核查/转办的事项，字段包括原来话地址、匹配状态、核址流水及后续结果/转报索引；填写规则明确原来话地址照录保留，后续核定地址、转办去向和核址结果另栏登记，不得用核定结果覆盖原来话字段。该资料独立支持梁策此前“保留原地址、核址另记”工作记忆的一部分，但只证明这一类登记簿的记录方式，不能扩大为旧夜联全部制度或异常机制。继续以2010-10-18乙班和既有流水夜联-2010-10-C/43收窄后，找到该簿当日乙班第17项，最小开放字段记载22:31“永安里第17组部分建筑地址核对”，匹配状态“现行地址表未直接命中，转补核”，原字段“照录保留”，责任席位C-3，并引用DQ-YH-20101018-17-04及夜联-2010-10-C/43；没有201、单元或住户字段。C-3出现时梁策主动执行前一章建立的本人关联披露规则，先说明C-3与本人有关、自己用过这类簿，同时明确该行是否亲手落笔仍以记录为准；夏宁没有因此用梁策姓名新增检索条件，只标注既有席位关联且具体落笔人员未开放。正式册名与梁策此前模糊记忆不同，三人按十六年普通记忆误差处理，没有新增F008样本。21:04后关闭历史副本，本章明确停在“这类簿存在、该记录方式存在、永安里当晚进入过同类补核流程”三项有限结论；为什么当晚核4/6/7栋、201、住户、S2-07、完整失址机制和周衡记忆原因仍未知。
meaningful_changes:
  - 梁策此前仅属口述的“保留原地址、核址另记”工作记忆获得《来话地址补核登记簿》目录与填写规则的独立有限支持，但其适用范围被明确限定为该类记录方式而非旧夜联全部制度
  - 2010-10-18乙班《来话地址补核登记簿》第17项把永安里第17组事项接入“现行地址表未直接命中→原字段照录保留→转补核→关联既有核址/转报流水”的业务链，但没有补出201、单元或住户
  - 梁策在C-3再次出现时主动先披露本人关联并限制口述证明范围，前一章建立的合作规则第一次在真实调查中被执行，周衡与梁策的关系边界由口头约定推进为实际行为
  - 正式册名与梁策模糊记忆不一致被按普通十六年记忆误差处理，F008仍只有王启明一个明确具体事件记忆冲突样本
new_information:
  - 旧夜联历史资料中确有《来话地址补核登记簿》这一记录类别，目录说明包含旧门牌、居民俗称、地址表同步滞后等普通原因，不得把整类登记解释成失址名单
  - 该簿填写规则要求原来话地址照录保留，后续核定/转办/核址结果另栏记录，不得覆盖原来话字段
  - 2010-10-18乙班第17项与夜联-2010-10-C/43、DQ-YH-20101018-17-04直接关联，事项为永安里第17组部分建筑地址核对，匹配状态为现行地址表未直接命中并转补核
  - 该条责任席位为C-3，但本次开放不提供具体落笔人员；梁策主动声明本人关联不替代记录判断
open_questions:
  - 为什么2010-10-18当晚永安里第17组最终选择核4栋、6栋、7栋，现有补核登记仍未提供原因
  - 永安里6栋201中的201、单元和住户层仍无独立历史来源
  - BK-JBS-160114-03对应旧导向牌Day 9当前实物是否仍在S2-07继续待正常盘点
  - 完整失址机制、工单系统来源、主动维持/删除主体及周衡为何保留永安里记忆仍未解决
ending_state: Day 9约21:05，第九次夜班进行中。周衡、梁策、夏宁已确认《来话地址补核登记簿》及其“原地址保留、核址另记”规则，并取得2010-10-18永安里第17组同日关联条目；梁策的新本人关联披露规则首次实际执行。ARC-006只剩弧末收束，第68章不得继续从梁策记忆深挖，而应整理“人员链已证/旧工作记忆已有限交叉/机制仍未知”，并从201、S2-07或其他既有合法证据线中选择下一弧入口
