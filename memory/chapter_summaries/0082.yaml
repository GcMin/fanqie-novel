chapter: 82
title: 水往哪边走
arc: ARC-008
summary: >-
  Day 16 00:17起，三人把第81章槐河路下穿通道已经恢复通行后的2047/2048连接差异单独转为工程资料续办，只申请2021年原排水平面图、涉及西侧雨水口的设计变更、对应竣工资料和2022年图层更新记录，没有安排夜间开井或示踪。Day 16白班另核到北口施工段挡泥条曾被车轮压开、雨后存在裸土泥沙进入边沟条件，施工单位已补挡泥措施；该记录只留在堵塞物来源层，不用于解释管线连接。20:08第十六次夜班读取工程回执：2021年5月原施工图确将YS-HH-2047/2048画向南侧下穿泵井支管；同年9月因现场既有地下综合管束位置与前期资料偏差、原南向接管净距不足，设计变更批准将两只西侧雨水口改接北向既有重力雨水支线。11月竣工图和验收记录采用变更后走向，并可与昨晚北向检查口的现场观察对应。2022年市政排水图层迁移时，雨水口点位按竣工设施清单正确更新，但该变更竣工图在移交包中只有签章PDF、缺可直接导入的矢量线文件，更新记录明确留下“西侧变更支管线位待竣工图复核补录”；因此现行图层继续保留2021年5月施工图旧南向连接线。三人由此把2047/2048差异按普通工程变更+数据回填不完整闭环，不再核维护责任或建立异常候选，并提交普通图层修正单。20:31新的公共线路转入松桥路玉泉巷：三只生活垃圾桶连续两天未清运、最外一只已满溢，来电人称主路清运车每天经过却未进巷。中心先安排属地保洁处理满溢，再准备核当晚清运调度、路线与责任范围；章末原因尚未判断。
meaningful_changes:
  - 2047/2048实际北向连接首次由2021年批准设计变更、竣工图和验收资料独立支持，现场流向观察得到正常工程来源解释
  - 现行管线图差异首次由2022年数据更新记录解释为变更线位未完成矢量回填，属于普通资料同步问题，不建立服务边界异常候选
  - 槐河路排水连接核验正常收口，原计划的维护责任继续下钻被取消，ARC-008按“普通原因足够即停止”规则调整后续粗纲
  - 松桥路玉泉巷三只垃圾桶连续两天未清运成为新的当前服务入口；现实满溢处置优先，路线/责任原因尚未核
new_information:
  - 2021年5月施工图曾把YS-HH-2047/2048接至南侧泵井支管
  - 2021年9月正式设计变更把两只西侧雨水口改接北向既有重力雨水支线，11月竣工资料与验收采用变更后关系
  - 2022年图层迁移正确更新了雨水口点位，但因变更竣工图仅有签章PDF且缺可直接导入的矢量线文件，西侧变更支管线位被标记待补录，现行图层因此保留旧拓扑
  - 北口施工段存在泥沙进入边沟条件并已补挡泥措施，但没有来源鉴定，不能将全部堵塞物唯一归因施工
  - Day 16 20:31松桥路玉泉巷出现三只生活垃圾桶连续两天未清运的普通公共服务工单，当前只取得来电人口述与正常收集点状态
open_questions:
  - 玉泉巷当晚实际清运单位、排班路线、收集点是否列入路线以及连续两天漏收的普通业务原因
  - 若路线或责任范围存在真实不一致，是否能由车辆调度、道路通行、合同切换、临时漏班或数据更新解释
  - 永安里居民身份/实际居住、M004/M005、完整失址机制和周衡记忆原因继续未知且当前不重开
ending_state: Day 16约20:31，第十六次夜班进行中。槐河路2047/2048连接差异已经由2021批准工程变更与2022图层回填遗漏普通闭环，图层修正单已登记，不再进入维护责任核验。新的玉泉巷生活垃圾满溢工单刚进入处理：三只桶连续两天未清运，中心先联动属地保洁处理现实满溢，并准备按实际调度表、清运路线和责任范围核原因。第83章只能先完成现实清运处置并核普通路线/责任原因，不得把来电人“车每天经过但不进巷”的观察直接写成服务边界异常。
