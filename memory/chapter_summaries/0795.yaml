summary: >-
  Day660清晨韩姨满载菜车在新荷街院门左侧洞口一条外侧金属压条翘角卡左轮，人车未受伤；Day655灰带高系补三针仍没见擦轮，此次不能直接判轮或织带永久故障。右侧门扇正常通行，母亲和韩姨请物业许桐按公共设施受理号登记，不把保洁看过当已修。10:26维修班长现场确认左门压条外端翘起固定点松、片下细沙，只断雨后观察而不推雨为根因；提示架安全隔离左门并保留右门通路。13:40后工班实际拆旧变形条、清基面、换低斜金属过渡条并固定，反复核门叶开闭、物业空车测试后韩姨本人先空载再以水瓶土豆作近似载荷各自进退；此次左门洞可过不推全楼无障碍或永久合格，母亲不代签工程责任。傍晚孩子与晓漫来访，红七右后带角左偏纸车仍归孩子、Day658宽纸路旧右/新左框及底端挡边保留；孩子不把车放公共门口试，只画院门新坡、注韩姨车过而本人纸车未试，原纸记半只轮差未擦。物业当夜有责限项结单，韩姨再买菜短程通过但灰带仍需自行观察。夜间夏宁仅获旧仁合里四楼授权闭锁双封水电隔离Day536撤清运禁返住、Day656外巡误显更正、Day657无许可维修撤单、Day659旧通知按钮本户移除的旧屋限项，不获新荷街院门与家庭私人信息；整班专业守门/再开许可未成立，R-12末签现门型Day577擦响原因、F014旧联系号旧信旧押金七号箱五楼2019旧卷均无跨源新证。
