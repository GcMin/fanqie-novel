  - "活动室实际撤去误导A4告示并留合法原样；本场三张印纸受限核对，群内一条消息限制并发布公开可用更正。"
  - "邱在本人受控渠道收信息仍不被逼签，韩本人自愿作无代理征证授权的限定声明。"
