summary: >-
  Day346 20:49河望路雨后绿篱旁乔芮牵绳空了，八岁黄棕犬毛豆被园林推车吓到脱绳，蓝项圈铃铛仍在狗身上；协寻系统因地点聚合把车站南侧20:40真收的另一只黑白花犬错映成毛豆已接收。20:57街道值守卢青用照片和志愿队单据确认两犬不同且另一犬有独立报事人。21:06向夜间中心分别报动物失联和绿化带检修槽未盖、围护破口的人身风险，夏宁分源、周衡问收尾记录、梁策先护行人。21:23养护带班曾跃证盖板待复位且围护部分被风掀，保留行人隔离。22:02有责人员只核准作业窄道，救助志愿者方槿让乔芮低声按习惯呼唤，凭铃声、蓝项圈与左后腿白毛在外侧绿篱确认毛豆，22:19用软套和运输箱安全救出，照片、项圈联系及本人认领核实后真正归还。23:07专业只复位本段槽盖/限项撤隔离，其余养护区仍封；兽医初查看无须立即处理的明显外伤，但后续健康观察仍必要。Day347 11:12平台按权附来源更正：另一犬真收容、毛豆独立真救助交接，其他地点聚合未全面查；乔芮仅授权遮个人电话地址的限项工作交接，拒将救助照片做宣传，购买防脱胸背带。与北槐夜市、永安里史料无新增联系；F008/M004/M005仍无确证。
