summary: >-
  Day 21 22:31，第二十次夜班继续。陈女士从槐景苑2号楼东侧客梯内来电，轿厢停在4层与5层之间附近，照明、通风正常，本人无伤。物业已经收到轿厢报警，但夜间值守从楼栋资产快捷入口点进“2号楼东梯”后命中一条2023年停用、设备代码末尾0417的旧资产卡，一时无法据此确认当前维保单位。中心没有让陈女士扒门或自行判断机械位置，只请她读取轿厢内现行《特种设备使用标志》上的设备代码与应急联系方式；该标识对应另一条末尾9826的设备记录。当前维保单位确认9826仍在合同内，并说明2号楼2023年做过整梯更新、旧梯曾注销，但不替物业判断其内部资产映射。22:43维保人员到场，22:48按专业程序将陈女士安全救出；她无伤且不需要医疗协助。22:51现场初步判断为门锁回路信号异常触发保护停车，具体故障点待进一步检测，东梯保持停用待检；物业以西梯和楼梯作为替代通行并设置现场提示。22:56物业深层设备页确认新设备9826状态在用，原设备0417停用；夜间快捷入口之所以仍跳旧资产卡，需要查看2023更新交接后的名称/编号映射。23:00人员困梯服务工单关闭，另建最小内部核验，只查“2号楼东梯”快捷入口与0417/9826之间的资产映射和交接记录，不查住户、不扩到全小区设备。23:04东梯继续停用检查，ARC-027 active，当前不建立异常候选。
meaningful_changes:
  - 陈女士从被困轿厢推进为22:48由专业维保安全救出，无伤；现实人员安全问题完成。
  - 东侧客梯从运行中保护停车推进为停用待检，物业落实西梯/楼梯替代通行与现场提示，不因人员脱困就强行恢复设备。
  - 物业最初模糊的“这台电梯已停用”被拆分为旧设备0417停用记录与当前设备9826在用记录；旧/新设备不被合并成同一条事实。
  - ARC-027建立，后续只核2023整梯更新后的物业快捷入口资产映射/交接链；当前不建立异常候选，不新增F008，不重开F009，不提前确认M004/M005。
knowledge_updates:
  zhou_heng:
    - 知道槐景苑2号楼东侧客梯当前使用登记与维保合同对应设备9826；物业楼栋快捷入口先命中的0417属于2023年停用的旧设备记录。
    - 知道居民口头“东梯”、物业快捷资产名称、现行设备代码、维保合同对象属于不同证明层；映射未核清前不能写成“停用设备重新运行”。
  liang_ce:
    - 知道本次先完成专业困人救援，设备编号映射另算；中心不为查编号介入机械救援或扩大到整小区设备。
  xia_ning:
    - 已分别保存陈女士原始来电、物业旧0417快捷查询、轿厢现行9826标识、维保合同确认、专业救援结果与物业深层设备页，不用后续正确设备记录覆盖最初错误查询。
