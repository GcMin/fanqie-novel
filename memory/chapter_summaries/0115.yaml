ending_state: >-
  Day 21 23:04，第二十次夜班继续。陈女士已安全离开轿厢且无伤；槐景苑2号楼东侧客梯设备9826保持停用待检，物业已落实替代通行。ARC-027 active：旧设备0417停用记录与当前9826在用记录均已分层保存，唯一必要待核项是2023整梯更新后物业楼栋快捷入口的名称/设备代码映射与交接记录；尚不建立异常候选。
next_entry: >-
  第116章暂定《物业查的是哪一台》，只能核2023整梯更新后的资产映射/交接记录。优先排除普通迁移、配置未更新、旧快捷入口残留等原因；若普通链完整即收口ARC-027。不得查住户身份，不扩查整小区设备，不新增F008，不重开F009，不提前确认M004/M005。
