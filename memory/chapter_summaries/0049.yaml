schema_version: 1
chapter: 49
title: 掉下来的门牌
arc: ARC-005
summary: >-
  Day 3 23:27，第二卷阶段核验刚结束，下一张普通工单立即进入：来电人报老城区“花枝巷17号”院门旁一块门牌右上固定件松动，存在坠落风险。周衡先要求来电人避开牌子正下方、不要自行架梯拆除；夏宁发现“花枝巷17号”在现行标准地址服务中没有当前有效对象，但系统返回同一坐标院落“槐北路112号附1”。她保留来电人口述旧地址，同时按坐标和现行候选地址联系东桥街道夜间值守/门楼牌维护。23:34责任单位核实该院落2018年因旧城支巷并址整编由“花枝巷17号”调整为“槐北路112号附1”，现行地址沿革卡完整保存旧号、新号、生效日期2018-06-18、变更原因、来源文书“东桥片区门楼牌调整通知2018年第27批”和当前有效状态。23:42维护人员到场后确认现行蓝色标准门牌固定正常，真正松动的是侧墙上一块2018年后一直未拆的旧白底搪瓷牌“花枝巷17号”。现场先做绕行隔离，23:51拆除松动旧牌并封护墙面孔位；旧牌物理残留与其正式地址状态被明确区分。来电人说明附近老住户和熟人仍习惯使用旧称，但收快递通常使用现行槐北路地址。00:02回访确认风险解除，00:05工单处置完成。三人因此获得一份完全正常的正式地址变更控制样本：居民口头旧称、旧实体牌、现行有效门牌和正式沿革文书可以同时存在而互不替代。周衡记录正常沿革至少包含旧号、新号、生效时间、变更原因、来源文书、当前状态，并把“实体旧牌是否残留”单独记录。夏宁随后只取得历史门楼牌“沿革索引目录”的目录级说明：资料按行政区片、变更批次和来源文书归档，夜间联动账号不能打开历史底册全文。三人决定第50章先用花枝巷这条正常样本理解索引规则，不直接以“永安里6栋201”全文搜索。
meaningful_changes:
  - 第三卷/ARC-005正式启动，但开场先完成一张真实普通门楼牌坠落风险工单，没有让主线调查压过现实安全职责
  - 周衡第一次获得“正常正式地址变更”的现实控制样本，从第二卷抽象的“需要独立正式地址来源”推进为知道正常沿革记录具体会留下哪些字段
  - 实体旧门牌仍存在被证明可以只是普通管理遗留，不能因此判断旧地址当前仍有效；口头旧称、旧实体牌、现行标准地址和正式沿革文书四层被明确拆开
  - 获得历史门楼牌沿革索引的目录级入口，下一步可按区片/变更批次/来源文书学习正常检索方式，而不是先搜永安里答案
new_information:
  - “花枝巷17号”与“槐北路112号附1”是同一院落的正常旧号/新号关系，2018-06-18因旧城支巷并址整编生效
  - 现行地址沿革卡可保存旧号、新号、生效时间、变更原因、来源文书和当前有效状态
  - 2018年停用的旧搪瓷牌直到Day 4前夜仍可能因普通管理遗留留在墙上；现场拆除旧实体牌不会注销已经存在的系统沿革记录
  - 历史门楼牌资料存在按行政区片、变更批次和来源文书组织的沿革索引，夜间联动账号当前只可看目录说明，不可打开历史底册全文
open_questions:
  - 临江市历史门楼牌沿革索引具体如何把旧号、新号、批次和来源文书关联，需第50章继续理解正常样本
  - 旧槐荫路/永安里所在历史图幅是否存在可执行的正式地址沿革入口，当前尚未查询
  - BK-JBS-160114-03对应旧导向牌Day 4前夜是否仍在S2-07，仍待正常盘点
  - 永安里6栋201独立历史证明、M003目标人员、完整失址机制、工单系统来源及周衡为何保留永安里记忆均未解决
ending_state: Day 4约00:10，周衡、梁策、夏宁仍在临江市夜间综合服务中心第三夜班。花枝巷17号旧门牌坠落风险已闭环，现行槐北路112号附1门牌正常；三人掌握一份正式地址正常变更控制样本，并仅取得历史门楼牌沿革索引的目录级入口。下一步第50章先沿该正常样本理解旧号/新号索引和来源文书结构，不直接检索永安里答案
