schema_version: 1
chapter: 71
title: 物证不是住址
arc: ARC-007
summary: >-
  Day 11约20:29，第十一次夜班刚开始，第70章末亮起的公共线路接入海棠苑3号楼2单元入口上方标识松脱工单。无人受伤，中心先要求物业封住牌下区域并引导住户绕行；夜间维修拆下斜挂的亚克力单元牌并设置临时“3号楼2单元”指引，永久固定留白班，周衡只闭环“坠落风险解除/入口可识别”，没有把实体牌拆下写成地址变化。20:58后，三人回到已收口的S2-11物资结论：`BK-JBS-160114-03`现物可定位、外部分类号与来源对象`DX-B-06`匹配、牌面未复核；不再为看牌面追加拆封。夏宁只以`DQ-DZHD-2010-17`及其中已证永安里6栋建筑对象查询“关联资料类型”，没有输入201或周衡姓名。目录规则显示，建筑对象以下的单元、房号等下级地址归入“历史分户/子地址资料”类，正常检索应优先使用父级建筑对象、来源卷册或历史地址对象索引；具体居民身份、家庭关系、证件及人口登记内容不随分户地址资料自动开放。当前只读取目录级规则，没有展开六栋具体房号。21:07，夏宁按永安里6栋父级建筑对象、`DQ-DZHD-2010-17`来源关联和约2010年前后形成时段提交最小目录核验，只请求资料存在性、资料类型、当前保管机构、形成时间范围及非居民身份字段开放范围，不申请居民姓名/家庭关系/证件，也未以201作为检索词。21:11申请仍为待资料保管范围确认。调查由公共导向/物资层正式转入分户/子地址资料目录层，但201、具体单元/房号、住户和完整机制继续未知。
meaningful_changes:
  - `BK-JBS-160114-03`物资线被正式留在“现物可定位/牌面未复核”的阶段结论，不再为重复查看牌面扩大权限
  - 东桥历史资料目录确认存在“历史分户/子地址资料”这一正常资料类别，并明确应通过父级建筑对象/来源索引查询建筑以下单元、房号等下级地址
  - 分户/子地址资料与具体居民身份/家庭关系/证件资料的开放层被明确拆开，后者不随前者自动开放
  - 21:07已只以已证永安里6栋父级建筑对象提交目录核验，调查首次获得一条不依赖“201”答案关键词的下级地址资料入口
new_information:
  - 海棠苑3号楼2单元实体标识夜间因坠落风险被拆下并以临时纸质指引替代，普通工单只处理实体安全/识别，不改变单元地址本身
  - 历史分户/子地址资料目录规则允许按父级建筑对象、来源卷册或历史地址对象索引查询下级地址资料
  - 当前最小目录核验只问六栋相关资料是否存在、资料类型、现保管机构、形成时间范围及非居民身份字段开放范围
open_questions:
  - 永安里6栋是否实际存在可用的历史分户/子地址记录、现由谁保管、能开放哪些字段，仍待目录核验返回
  - 201、具体单元/房号、住户身份及周衡家庭关系仍无独立历史来源
  - 为什么2010-10-18当晚选择核4栋、6栋、7栋仍未知
  - 完整失址机制、工单系统来源、主动维持/删除主体及周衡为何保留永安里记忆仍未知
ending_state: Day 11约21:11，第十一次夜班继续。公共导向/物资线维持现物可定位的阶段结论并停止扩权；夏宁已用`DQ-DZHD-2010-17`中的永安里6栋父级建筑对象提交历史分户/子地址资料最小目录核验，状态待资料保管范围确认。第72章只能读取该核验实际返回，允许出现移交、未数字化、缺页或权限限制，不得提前确认201或住户。
foreshadowing_touched:
