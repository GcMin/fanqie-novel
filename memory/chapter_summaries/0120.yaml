summary: >-
  Day 22 21:04，罗敏从青禾路46号原青禾小学北楼来电。原学校早已撤并，现场当前作为“青禾社区综合服务点”开展夜间书法课，二楼走廊顶内管道突然漏水并向墙面插座区域蔓延。中心先要求12名学员与罗敏共13人撤至一楼干燥区域，不涉水取物、不自行操作楼道配电箱；青禾街道管理员到场后保持配电间封闭，等待持证电工。供水夜间应急按青禾路46号仍在计量的院落总表定位现场，周衡、梁策随应急人员外出。21:18后，持证电工确认一楼配电间干燥并切除二楼受影响区域回路，供水人员确认外网压力正常、漏点位于楼内；关闭北楼内部支路阀后水势停止，检修口内一段老化金属接头出现裂口，二楼保持停水、受影响电路停用，待干燥检测与维修。人员安全和基本服务处置完成后，团队才最小核对地点记录：教育目录中的“青禾小学撤并/原校址停用”只描述学校机构状态；2021年9月移交索引确认北教学楼、门房及部分院落在撤校后移交青禾街道，作为公共服务用房继续使用；街道现行设施卡记录“青禾街道公共服务用房，青禾路46号”，内部点位名为“青禾社区综合服务点”。市级公共设施页只收录独立登记服务机构和对外办事大厅，该点位没有独立机构代码，因此按内部点位名搜索不到；供水总表仍保留历史户名“青禾小学生活用水”，备注街道管理点编号，且不影响本次抢修。21:41漏水处置关闭，21:43周衡、梁策离开现场。ARC-030按普通机构撤并、房屋移交继续使用、目录收录范围不同及历史资产户名完整闭环，不建立异常候选。
meaningful_changes:
  - 13名课程参与者从二楼漏水与潜在带电风险区域全部撤至一楼并最终安全离场，无人员受伤；现实风险由未控制推进为专业隔离完成。
  - 北楼二层受影响电路被持证电工切除，内部支路阀关闭，漏点收窄为老化金属接头裂口；二楼保持停用，维修与干燥检测转正常责任流程。
  - “青禾小学已撤并/原校址停用”与现场建筑仍被社区使用的表面冲突被分层解释：学校机构结束后建筑已正式移交街道作为公共服务用房，内部点位未作为独立机构进入市级公开目录，供水旧户名只是历史资产名称。
  - ARC-030在本章普通闭环；不新增F008，不重开F009，不提前确认M004，不触碰M005。
knowledge_updates:
  zhou_heng:
    - 知道青禾小学教育机构于2021年撤并，但北教学楼、门房及部分院落随后正式移交青禾街道继续作为公共服务用房，机构停用不能替代建筑实体和后续用途状态。
    - 知道“青禾社区综合服务点”是街道内部点位名而非独立登记机构，因此在市级公开机构目录按该名称搜索不到有普通目录口径解释。
    - 知道供水旧户名仍写“青禾小学生活用水”只证明历史资产命名与当前计量服务关系，不需要为本次夜间抢修先改资料。
  liang_ce:
    - 知道本次现实风险由楼内老化接头漏水与受潮用电区域形成，专业止水/断电后应立即把目录差异按普通业务边界收口，不扩大成数据治理或异常调查。
  xia_ning:
    - 已分别保存原教育机构撤并状态、2021房屋移交索引、街道现行设施卡、市级公开目录收录规则、供水旧户名与本次现实处置结果，不用其中一层覆盖其他来源。
