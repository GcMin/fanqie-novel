chapter: 70
title: 旧牌还在不在
arc: ARC-007
summary: >-
  Day 10 20:31起，第69章末地下车库卷帘门普通安全工单被完整处理：入口卷帘门停在半空且自动控制仍偶有动作，中心先要求封住门下区域、车辆改走东侧出入口并禁止现场自行顶门/遥控；20:46专业维保到场后切断自动控制，确认门帘未脱轨、无人受压，将门体提升到安全位置并机械固定，原入口停用、车辆改道，具体控制部件留白班拆检，因此夜班只闭环“夹人/坠落风险已控制、设备停用、通行有替代方案”，没有写永久修复。Day 11 15:11白班维保完成控制部件更换和整机测试，15:26恢复入口，历史状态按发生时间分别保留。Day 11第十一次夜班20:02后，三人读取白天16:08完成的`BK-JBS-160114-03 / S2-11`最小核验：15:32—15:58由运营资料样本间保管人员与物资账务人员执行，只核目标架位/分类号/外部标签与可见保管标识，未拆封、清洁、翻面或移动无关样本。S2-11目标格位当前有一件扁平板状历史标识留样，数量1，外部分类标签为`BK-JBS-160114-03`，当前定位S2-11，随件外部来源对象编号为`DX-B-06`，保管用途仍为历史标识留样；与2022年S2-07→S2-11库内架位调整以及既有2016项目对象/北库分类链可直接对应。包装遮住牌面，本次回执明确未核牌面文字，因此当前可以写“目标分类号对应现物在S2-11可定位、账实位置接上”，不能写“Day 11重新看见牌面永安里”。2016改造前影像中DX-B-06牌面写“永安里”仍只按既有历史影像来源保存。郭铭在轨道物资权限内确认该次核验可记为历史标识留样现物可定位，牌面不属于本次结论。三人判断继续拆包装只会重复公共导向牌面、不能推进201/住户，因此停止为看字追加申请。20:28夏宁转向已证建筑对象`DQ-DZHD-2010-17`/永安里6栋，准备下一步只查询该建筑对象合法的分户/子地址资料目录、保管机构与可开放字段，不直接输入“201”跨库搜索。
meaningful_changes:
  - `BK-JBS-160114-03`当前现物状态首次被Day 11工作时段现场核验闭合：S2-11存在数量1的对应实体，外部分类号、来源对象`DX-B-06`和架位与既有物资链一致
  - 第69章“S2-07原架位未见→2022记录指向S2-11”的位置链与第70章S2-11实际现物接上，公共导向/物资线取得可审计阶段结论
  - 牌面文字因本次未拆封/未翻面继续保持“未复核”，人物没有为了标题式好奇扩权；既有2016影像与Day 11现物状态仍按不同来源保存
  - 调查主动停止继续追旧牌牌面，下一入口转为已证永安里6栋建筑对象的分户/子地址资料目录，ARC-007从“在架”逐步转向“在册”
new_information:
  - Day 11 15:32—15:58样本间保管人员与物资账务人员完成S2-11指定格位最小核验
  - S2-11有`BK-JBS-160114-03`对应历史标识留样现物，数量1；外部标签同时保留来源对象编号`DX-B-06`
  - 当前外部分类标签/来源编号/架位/数量与2022位置记录及既有物资链一致，可记账实位置相符、现物可定位
  - 本次未打开包装或读取牌面，故Day 11牌面文字不新增事实；2016影像中的“永安里”仍是历史影像结论
open_questions:
  - 永安里6栋是否存在可合法追踪的历史分户/子地址资料、由谁保管、可开放哪些字段
  - 永安里6栋201中的201、单元和住户层仍无独立历史来源
  - 为什么2010-10-18当晚选择核4栋、6栋、7栋仍未知
  - 完整失址机制、工单系统来源、主动维持/删除主体及周衡为何保留永安里记忆仍未知
ending_state: Day 11约20:29，第十一次夜班刚开始。`BK-JBS-160114-03`已由S2-11工作时段最小核验确认当前现物可定位，外部分类标签、来源对象`DX-B-06`、数量和架位与既有物资链一致；牌面未复核。公共导向物证线取得阶段结论，201/住户仍未证。夏宁已打开东桥区历史建设资料目录入口，下一章只能从已证永安里6栋建筑对象查询分户/子地址资料目录、保管与开放规则，不直接用“201”跨库捕鱼
