ending_state: >-
  Day 21约20:30，第二十次夜班刚开始。2018项目对象边界已核清：31、33、35、37号当年保留使用，39、41、43、45、47号及附属建筑完成本期拆除验收。当前标准地址层仍无31—37号对象，2018以后是否存在普通停用、并号、改址或后续更新尚未核。ARC-025继续active，F009进一步收窄；不新增F008，不重开永安里居民身份层，不触碰M004/M005。
next_entry: >-
  第112章只能在当前门牌/建筑地址层仍有必要核验时继续，优先查看31—37号保留建筑在2018以后是否存在标准地址停用、并号、改址或后续更新记录。不得把2018“保留使用”直接写成当前正式门牌有效，不查居民身份，不联系历史项目人员补证，不新增F008，不提前确认M004/M005。
