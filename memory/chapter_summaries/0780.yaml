summary: >-
  Day645母亲新荷街真住，晨看Day644未采用的两张双碗试样；昨日真正借给社区便民驿站的第三张带小缺口新印独作仍在固定矮柜的桌面相框16:38旧陈列位，借期一周。小陆早上发现志愿者误加未核黄卡，编写“等待亲人归来的母亲”虚构身世，随即撤牌并电话告知母亲。10:11母亲到驿站核对Day644接收页仅准一周本站室内、无外宣权限，黄卡留站内纠错且不再公开。拄杖老太太亲见字过小反光，同时自由理解碗缺口而不接受所谓作者唯一意义。志愿者小汪到场承认照模板臆写，误想改成“独居”亦被母亲纠止；尚未发出的社区信息待发草稿当场撤销且小陆核见，未声称外界从未拍照。母亲决定新作正式命名《两只碗》，独立展示卡仅写该作品名、纸版新印、本人公开姓名和本站短期借展，拒绝杜撰个人经历。小陆调整大字和相框可视角度，组织坐姿和空轮椅核正常通路，13:48实际登记卡片纠正与陈列位置；原一周借展和保管人均未改变。母亲返新荷街与韩姨短谈；晓漫私下发来外甥自拟题《杯子打架》的新两杯草稿，家人尊重孩子署名与命名权。夜间夏宁只获本人授权仁合里旧四楼安全限项，旧四楼禁返住R-12/F014仍无跨源新证。
