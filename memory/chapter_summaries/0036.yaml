schema_version: 1
chapter: 36
title: 旧广播
arc: ARC-003
summary: >-
  Day 2 23:26起，郭铭在轨道历史资料权限内调出《槐荫路终点站广播分区及改造移交表》，旧语音包夜间无法直接调取，中心未扩大查档。资料显示旧终点站清客广播文本版本HY-QK-02，2015文本核对表中可见“本次列车终到槐荫路站，请全部乘客下车”，与第35章23:17中心通话录音可辨部分高度对应；三人只确认历史话术存在并可对应，不推定本次声音来自旧广播系统。HY-QK-02覆盖旧站台B2分区，旧扬声器B2-04位置标注“旧站务亭北角，P17柱东侧”。清晨现场核查留下的旧新柱号对照与2016改造移交表共同确认：旧B2扬声器设备已拆除，但P17结构柱未拆，只更换外包饰面，并因施工原位测量需要被保留为旧设备定位基准；现行位置仍在临江南站站台东段正常公共区域，轨道人员可从站务室安全步行抵达。周衡等人把P17只记为历史广播覆盖区域与现行结构之间的实体锚点，没有把它写成钱先生当前位置证明，也没有把旧图与现行图拼成空间重合结论。23:41中心穿插处理一张便利店冷柜外机噪音普通工单。23:46固定联络正常接通，钱先生仍无头晕/胸闷/心慌，仅腰酸，未离开长椅，本轮未再次听见旧广播，手机精确电量仍未询问。确认本人稳定后，梁策才允许轨道值班人员前往现行P17公共区域核查，明确不做广播测试、不打开设备、不进入轨行区、不让钱先生移动。23:49轨道人员正从站务室按正常路线前往P17，本章结束。
meaningful_changes:
  - 第35章通话中的旧站广播从可复核声音证据推进为可与历史HY-QK-02清客文本、B2广播分区交叉对应的正常轨道资料证据
  - 旧B2-04位置被收束到仍存在的P17结构柱；P17成为历史旧站广播区域与现行车站结构之间第一个可由轨道人员安全实地核查的实体锚点
  - 钱先生23:46固定联络正常完成，仍安全、未移动、无新症状；中心没有要求其寻找柱号、喇叭或出口
  - 轨道处置从对整座现行车站的泛化重复搜索推进为基于P17的有限公共区现场核查，且不做设备/广播触发实验
new_information:
  - 历史终点清客广播文本版本为HY-QK-02，2015文本核对表可见“本次列车终到槐荫路站，请全部乘客下车”
  - HY-QK-02历史覆盖旧站台B2广播分区，B2-04旧扬声器位置标注在旧站务亭北角、P17柱东侧
  - 2016改造中旧B2广播设备已撤销，但P17结构柱被保留作原位测量基准；其现行位置仍在临江南站公共站台东段
  - Day 2 23:46钱先生无新症状、未移动，本轮未再次听见旧广播，当前精确手机电量仍未知
  - Day 2 23:49轨道人员已从站务室沿正常公共路线前往P17核查，不做广播测试或设备操作
open_questions:
  - 现行P17位置能否出现与钱先生环境相对应的可独立核验结果，双方是否会围绕同一固定锚点形成新的现实对照
  - 钱先生实际位置、黑色帆布包和常用降压药仍在哪里
  - 23:17录音中的HY-QK-02式旧站广播为什么会出现，其与现行临江南23:16列车到发有什么关系仍未知
  - P17历史/现行对应不能证明钱先生身处过去、两套空间重合或失址机制
  - 永安里6栋201仍缺独立历史证明，M003不得提前完成
ending_state: Day 2约23:49，周衡、梁策、夏宁仍在临江市夜间综合服务中心第二夜班；钱先生23:46仍安全可联系、未移动、无新症状，下一次30分钟固定联络应为Day 3约00:16。轨道值班人员正从正常公共通道前往现行P17位置核查；P17目前只是可执行的结构锚点，不是钱先生位置证明
