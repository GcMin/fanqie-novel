summary: >-
  Day 23 21:49，一名女子从南桐巷144号院原机修厂宿舍8号楼2单元求助：其父胸口不适，120已经出车，但导航把急救车带到约六百米外的南桐家园8栋。中心明确医疗判断由120负责，只协助现场定位；东桥街道夜间值守确认144号院仍有6、8、10号三栋老楼，并安排社区巡查员在可通行的西口接车。21:57急救车进入正确院落，21:59急救人员进入老8号楼2单元，22:07患者被转移下楼，22:10急救车送医，中心不补写诊断。现实处置结束后才做最小地址核验：南桐巷144号院在用，街道现行资产卡把三栋楼记作西楼、中楼、东楼，其中老8号楼对应中楼；现场实体8号楼牌仍在。中心地址服务中“机修厂宿舍8号楼”存在历史别名解析，但目标错误指向相邻南桐家园8栋，源任务更新时间为两年前且源附件夜间不可查。22:19后仅留下两项白班核验：确认144号院6/8/10号是否有正式楼栋编号整编及8号楼与中楼关系依据；核两年前历史名称兼容映射为何指向南桐家园8栋。患者身份、房产、家庭成员和整院住户均不查。22:24医疗联动完成，22:26保留本次误导路线与实际到达路线，ARC-035 active，不建立异常候选。
meaningful_changes:
  - 急救车从被错误导航至南桐家园8栋推进为由街道/社区现场引导进入南桐巷144号院老8号楼，患者由120顺利接走送医，现实医疗到达障碍完成处置。
  - “机修厂宿舍8号楼搜不到”推进为更具体的地址服务问题：历史别名实际存在，但当前错误解析到约六百米外的南桐家园8栋；本次误导路线和现场实际到达路线均被保存。
  - 144号院老8号楼现场称呼与街道资产卡“中楼”关系得到当前业务层确认，但是否存在正式楼号整编、错误历史别名映射源任务为何形成仍待最小白班核验。
  - ARC-035建立并保持active；当前材料不足以建立异常候选，不新增F008，不重开F009/F010，不提前确认M004，不触碰M005。
knowledge_updates:
  zhou_heng:
    - 知道南桐巷144号院老8号楼现实仍可由街道值守、现场楼号牌和本次120实际到达共同定位；这些事实不自动等于中心当前标准建筑对象名称仍应为8号楼。
    - 知道中心地址服务对“机修厂宿舍8号楼”的历史别名不是缺失，而是当前解析到相邻南桐家园8栋；下一步只需核楼号沿革与历史别名源任务。
  liang_ce:
    - 知道本次应先保障120到达，不在患者未转送前追地址数据；现实处置完成后也只允许核会影响公共服务定位的最小字段。
    - 确认患者身份、房产、家庭成员、整院住户与当前地址误导原因无必要关系，不应扩查。
  xia_ning:
    - 已分别保存原始求助、街道现场引导、两张无人物照片、急救实际到达位置、错误导航终点、当前街道资产名称和中心历史别名解析结果。
    - 知道社区口述“白天提过一次老楼名不好搜”目前没有正式工单号支持，不能写成已提交过数据修复。
