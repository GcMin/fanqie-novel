summary: >-
  Day61607:40母亲在松桥南廊同房双箱双卡青白碗，孩子昨日装好的蓝色已用票盒里有一张真票，两张家人版画需收存。七晚住房真款仅到Day61912。母亲自行电话核松桥分馆一楼阅览开放与本人借书条件，10:07实到馆检索版画/拓印书，第一本现场可读，第二本显示在馆却待整理上架；同桌男读者欲凭亡妻书签续借遭要求核身份，母亲不窥别人的旧物。11:26母亲带本人证件和现用手机核借阅条款和联系信息，馆员将仁合里旧房地址留原记录、临时消息用短信分开，不认定旧屋已可住或客舍永久。第二本经馆员核整理车找到并当面记录第十九页旧折角，两书真实借出，各有到期凭条。12:40独自吃饭与晓漫短信交流，购无胶画夹，15:10回南廊按约已清洁，青白碗甲乙箱不搬，妥善收存画并让书避开水杯；例行烟感检测只是预告。16:24物业仍无完整实际失锁守门签领和替岗交接，未允许开旧门。19:12外甥经晓漫视频问票盒并学书不等于船票、下次印桥先试纸；21:27母亲只向中心限项回报旧封控不变，不上报图书馆私事。Day61707:09南廊双箱双卡双碗蓝票盒仍在，住房真付到Day61912，母亲已把两书归还期限记进画夹、承诺本人负责归还；仁合里四楼双封水电隔离Day536撤清运禁返住继续，旧R-12最终签、现门完整型号Day577根因及F014旧号旧信旧押金历史跨源均未证。
