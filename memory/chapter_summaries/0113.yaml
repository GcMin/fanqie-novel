next_entry: >-
  第114章只能核夜保巡查表版本来源、下发/交接时间以及它与市场当前过渡经营清单的版本关系。优先排除旧版本、外包交接或字段口径等普通解释；若普通链完整即收口。不得查商户身份证、住址、产权等无必要信息，不新增F008，不重开F009/永安里居民层，不提前确认M004/M005。
