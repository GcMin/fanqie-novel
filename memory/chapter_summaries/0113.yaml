summary: >-
  Day 21 21:06，第二十次夜班继续。夏宁接起第112章末的新公共线路来电，背景卷帘门声来自东桥区青石桥五金机电市场北排17号。郑师傅关店时前门卷帘门故障无法再次开启，后侧共用走廊的室外出口又从外部锁闭；本人无伤、现场无烟火或燃气风险。中心要求其停止操作卷帘门、不钻门缝、不自行拆电机，并联动119与市场夜间值守。21:17消防到场，确认后通道外门挂锁可开，真正阻断通行的是门扇下方从外侧插上的地插销；值班保安承认自己20:50按夜间巡查清单把北排当作“停用区”锁闭，没有逐间确认。21:20消防解除锁闭，郑师傅从后通道安全离开，无需医疗转运。随后市场夜间负责人停止强启卷帘并将维修转白班，消防要求当晚先核北排实际人员状态。现场确认11、17、19号仍有人；市场当月过渡经营清单显示11、15、17、19号仍在过渡经营期，另两间仅保留白天搬运权限，而夜保巡查清单却将北排9—20号统一标记为“停用、无人”，更新时间为本月3日。当前只能确认两张市场管理表发生直接冲突，尚不能判断是旧版本、外包交接、字段合并还是其他原因。21:35市场暂停使用冲突巡查表，改为夜间锁闭前逐间确认并由市场值守与夜保双签，当晚后通道保持内部可通行。21:41郑师傅确认安全离场，人员受困工单关闭。ARC-026《值班表上没人》启动，后续最小核验仅限夜保巡查表的版本来源、交接时间及其与当前过渡经营清单的关系。
meaningful_changes:
  - 郑师傅从前门卷帘故障且后通道外锁、无法自行离开，推进为消防21:20解除后通道锁闭并安全脱困；卷帘门维修转白班。
  - 市场夜间安全措施从按“停用无人”清单直接锁闭，推进为暂停冲突清单、锁闭前逐间确认并实行市场值守/夜保双签，后通道恢复安全使用。
  - 第五卷下一弧ARC-026建立：当前现场、市场当月过渡经营清单与夜保“全排停用无人”巡查表形成独立可核的业务冲突，并已产生现实安全后果，但当前仍优先按普通版本/交接问题排查，不建立异常候选。
knowledge_updates:
  zhou_heng:
    - 知道青石桥市场北排本次受困由卷帘门故障与夜保按“停用无人”巡查表锁闭后通道共同造成；消防已完成安全脱困，市场已即时修正锁闭流程。
    - 知道现场11/17/19号夜间有人、市场当月过渡经营清单仍列11/15/17/19号、夜保巡查表却写9—20号全部停用无人；三层事实必须分开保存，冲突原因尚未知。
  liang_ce:
    - 知道本次救援优先级高于追表单责任，且夜保表与当前经营清单冲突尚不足以命名异常；下一步只核版本/交接链。
  xia_ning:
    - 已分别保存来电人陈述、消防现场结果、市场当月过渡经营清单、夜保巡查清单及20:50锁闭执行事实，不用其中一层覆盖另一层。
