summary: >-
  Day 22 22:33，贺建明从石榴巷26号老杜面馆来电，称后厨出现明显燃气异味。本人、两名店员和三名顾客共六人已撤到室外，无人不适。中心要求人员继续远离店面、不返回操作电气设备或取物，并联动燃气夜间应急与消防；周衡、梁策从汇景东路返程途中改赴现场，只负责人员/外围确认，不介入燃气专业检测。22:52燃气抢险关闭商户支路阀，22:57确认后厨灶具前端连接接头松动并有轻微渗漏，现场隔离后不恢复供气，要求更换合格部件并经专业检漏确认后再启用。六人均安全，现实燃气风险于23:03完成当前处置。受理时22:34，中心标准地址页明确显示同一对象“石榴巷26号”为在用，夏宁按日常流程保存了受理截图；现实处置完成后，她为工单补处置单位时发现同一地址对象变灰，详情显示状态已于22:52:07更新为停用，来源为“标准地址交换库夜间同步”，后继地址为空，夜间权限无法查看源变更单。现场23:09仍有实体“石榴巷26号”门牌，燃气抢险资产页和本次出车定位也仍挂该地址，但这些只能证明现场/燃气资产当前状态，不能替标准地址库判断地址是否有效。贺建明只按本人经历说明门牌近期未更换，不被升级成产权或正式地址证明。23:12夏宁保留22:34在用截图与当前停用页面，不用后者覆盖原始受理记录，并建立最小白班核验：只查22:52停用状态的源变更记录、夜间交换批次依据以及是否存在门牌整编/拆分/并号/纠错后的后继标准地址。不查店主身份、房产或沿街住户。ARC-032《刚刚还在的地址》启动，当前只建立时间边界明确的记录状态差异，不确认异常机制、不提前触碰M004/M005。
meaningful_changes:
  - 老杜面馆六名人员从疑似燃气泄漏风险中全部撤离并保持安全；商户支路由燃气专业人员关闭隔离，故障连接件进入正常更换/检漏流程，当前现实风险完成处置。
  - 石榴巷26号同一标准地址对象从22:34受理时“在用”推进为22:52:07夜间同步后“停用”，前后两个状态均有独立时间截图保存，且当前后继地址为空、源变更依据夜间不可见。
  - 现场门牌与燃气资产仍使用石榴巷26号，但团队明确这些证据不能越级替代标准地址状态；普通夜间批次同步、整编、拆分、并号或纠错仍待优先核验。
  - ARC-032启动并建立F010作为窄范围待核状态变化样本；不新增F008、不重开F009、不确认M004、不触碰M005。
