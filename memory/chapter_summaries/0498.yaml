summary: >-
  Day360 22:17青杉里6号楼702齐曼发现楼梯间烟和热塑料味，立刻回屋关门联系物业及119并按消防指引和儿子等候；物业群公告却称“楼内全部撤离”。22:24物业向夜间中心报告已疏散六人，实为门岗闸机出行六条，其中两名是外卖骑手；夏宁周衡不将绿字人数当逐户真实撤离，保留原报文并将702仍困两人的有源信息按渠道移交现场消防。22:43梁策只到外围警戒线旁给指定岗位交真实位置，不擅入烟区，物业周庆林逐户核已知位置，601庄阿姨因未接电话仅列待确认。23:06消防实际到702核身份，23:19母子真实撤至安全区；23:27另由专业人员找到601庄阿姨带离、现场医护仅作实际评估，她与家属团聚。23:49物业试称楼里全出来被夏宁追溯来源后改为只证702两人及601一人，原六条虚已撤保源；Day361 00:38消防有责本轮控险但电气隔离排查尚待完成，不签全楼恢复。02:15齐曼拒丈夫未获许可回屋取物；03:27物业实置临时管控与夜联络人，齐曼决定先投亲属，07:26本班有限回报确认601经专业评估由家属陪离安置点、702母子尚未返家，电气原因和何时恢复仍未结案。独立普通设施错映非2019历史签认史料，F008/M004/M005无新证。
