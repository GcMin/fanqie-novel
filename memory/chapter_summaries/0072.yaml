schema_version: 1
chapter: 72
title: 六栋的目录
arc: ARC-007
summary: >-
  Day 11 21:19起，第十一次夜班继续。周衡先处理东河路旧客运站对面路灯杆检修门敞开、内部接线区暴露的普通安全工单：中心按杆号定位并联动市政照明，现场完成断电、绝缘遮护和临时封闭，永久更换锁舌留白班；21:07提交的永安里6栋历史分户/子地址目录核验整夜保持“待资料保管范围确认”，三人08:00正常交班，没有为档案结果滞留。Day 12 15:42，东桥区旧城历史建设资料室完成核定；20:04第十二次夜班读取回执。目录确认永安里6栋父级建筑对象确有“历史分户/子地址资料”建筑级关联项，约形成于2010年前后，现由东桥区旧城历史建设资料室保管，纸质原卷在册；数字化只做到卷级/建筑级著录，卷内分户页未逐页数字化。回执建立建筑级关联索引`DQ-FH-2010-17-B06`，只说明其对应`DQ-DZHD-2010-17`中的永安里6栋父级对象，不返回单元、房号或住户。后续按页利用时，可申请父级建筑对象、单元/房号标识、形成时间、地址状态/变更标记、原卷页码及直接来源文号等非居民身份字段；若原页混载姓名、证件、家庭关系等身份字段，必须遮蔽后提供，居民身份内容不随分户字段自动开放。周衡明确记录“201仍未取得”。利用说明另提示同批资料表式存在差异，可先看同类公开样表或普通建筑脱敏利用件以控制字段范围；夏宁因此没有直接打开六栋正文，而是先筛同年代、同表式、现存且地址沿革完整的普通建筑控制样本，为第73章建立入口。
meaningful_changes:
  - 永安里6栋从“是否存在分户/子地址资料未知”推进为“存在可追踪建筑级目录项、纸质原卷在册、现保管机构明确”
  - 新建立`DQ-FH-2010-17-B06`建筑级关联索引，但其本身不包含具体房号结论，201继续未证
  - 分户资料的非居民身份可开放字段及身份字段遮蔽规则第一次具体化，合法利用路径从抽象目录类别推进到可执行页项申请条件
  - 三人没有因目录存在直接申请六栋正文，而决定先用同年代同表式普通建筑的脱敏利用件做控制样本，下一步调查方法进一步收窄
new_information:
  - 永安里6栋历史分户/子地址资料纸质原卷在册，约形成于2010年前后，现由东桥区旧城历史建设资料室保管
  - 卷内分户页未逐页数字化属于正常保管/数字化状态，不等于资料不存在或被删除
  - `DQ-FH-2010-17-B06`为六栋建筑级关联目录索引
  - 后续可申请单元/房号标识、形成/变更时间、原卷页码和来源文号等非身份字段；居民姓名、证件、家庭关系等须独立授权或遮蔽
open_questions:
  - 六栋具体分户页采用何种表式、实际包含哪些单元/房号，仍未读取
  - 201是否在独立历史分户资料中存在仍未知
  - 具体住户身份、家庭关系及周衡家庭史仍无独立来源
  - 为什么2010-10-18夜间选择核4/6/7栋、完整失址机制、工单系统来源、主动维持/删除主体和周衡记忆原因仍未知
ending_state: Day 12约20:26，第十二次夜班开始不久。六栋已获得可追踪的历史分户/子地址建筑级目录索引`DQ-FH-2010-17-B06`，纸质原卷在册但分户页未逐页数字化；具体房号和201尚未读取。夏宁已筛出同年代、同表式、现存且地址沿革完整的普通建筑候选控制样本，但尚未打开。第73章只能先建立正常分户资料字段/遮蔽结构，再决定六栋最小页项申请。
