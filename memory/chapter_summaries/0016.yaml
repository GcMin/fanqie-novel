schema_version: 1
chapter: 16
title: 消失的档案
arc: ARC-001
summary: >-
  周衡、梁策与夏宁从03:31后继续人工核查2015年8至9月旧夜间联动扫描。连续多页只出现青梧苑2栋、5栋、7栋、9栋、11栋、12栋等普通故障，直到2015年9月7日的一张登记表中发现流水号LJ-150907-0041：00:46居民来电，地址明确写为“青梧苑13栋”，内容为楼道公共照明反复熄灭，记录显示已转临江安泰物业工程值班并在01:12回访“恢复照明”。三人核对前后页日期、扫描批次、页码与导入目录，确认该条位于2017年统一扫描的2015年9月上旬纸质联动登记册批次中，非孤立插页。夏宁随后查询当前迁移数据库，0041无匹配记录，而相邻0040、0042仍可查；她明确保留“迁移漏项”等正常原因，不把差异直接解释成异常规则。完成原页核验前，夏宁阻止只截取地址栏；梁策决定核验后打印整页保存。04:17夏宁转去接正常工单，旧档案窗口暂时最小化，梁策打开老式激光打印机预热，但本章结束时纸质副本尚未生成。
meaningful_changes:
  - 第一次获得中心官方历史归档中曾把青梧苑13栋当作正常地址受理和处置的直接记录
  - F005从“找到多来源核查入口”推进为旧扫描存在0041而当前迁移数据库缺失该条的直接媒介差异，但原因与规律仍未确认
  - 三人的下一步从继续寻找13栋记录转为保存完整原页证据，决定采用整页打印而非只截取地址字段
new_information:
  - 2015年9月7日00:46的LJ-150907-0041记录地址为青梧苑13栋，事项为楼道公共照明反复熄灭
  - 该记录显示已转安泰物业工程值班，01:12回访结果为恢复照明
  - 记录所在扫描文件为“城西联动_2015-09_03.tif”第7页，前后日期与页序连续，导入目录指向2015年9月上旬纸质联动登记册
  - 当前迁移数据库查不到0041，但相邻0040与0042仍存在；目前不能排除普通迁移漏项
open_questions:
  - 旧扫描中的0041内容在后续重新查看时是否仍保持不变
  - 打印出的整页副本能否在电子来源发生变化时保留当前内容
  - 青梧苑地下六箱2015维修/回访纸质资料是否存在对应13栋记录
  - 为什么2016物业交接目录已完全不承认13栋，而2015中心联动登记曾正常受理该地址
ending_state: Day 2约04:17，周衡、梁策、夏宁仍在临江市夜间综合服务中心；夏宁正在接正常调度电话，含LJ-150907-0041的旧扫描窗口已最小化但尚未关闭，老式激光打印机正在预热，整页副本尚未打印
