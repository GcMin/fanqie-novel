chapter: 50
title: 旧号新号
arc: ARC-005
summary: >-
  Day 4 00:12起，周衡、梁策、夏宁继续第三夜班，只沿第49章正常案例“花枝巷17号→槐北路112号附1”的来源文书进入历史门楼牌沿革索引，不使用旧地名全文搜索。夏宁按“东桥片区→2018年→第27批”定位目录，确认夜间账号只能看到来源文书、登记册页段、条目顺序及旧址/现址索引关系，历史底册影像仍无权限。花枝巷条目可从第27批目录指向停用旧址记录和现行槐北路112号附1，现行地址卡又能反向回到同一生效日期与来源文书。为避免拿已知答案验证已知答案，三人从同一第27批目录随机选择另一条普通记录“纸坊巷8号→槐北路108号”，再只查现行槐北路108号地址卡，独立核到同一2018-06-18生效日和同一第27批来源文书，证明该索引路径可在第二普通样本上重复。目录摘要同时显示同一批中存在重新编门牌、支巷并主路生成附号、原门牌注销但不设对应新号等不同处置类型，因此同批次本身不能替具体条目补变更原因。两条普通样本也进一步确认正式沿革索引不负责记录居民口头旧称或旧实体牌是否仍残留。随后夏宁查看“历史资料定位说明”：已知来源文书时可沿行政区片/年度或批次/条目定位并用现行地址卡交叉核；未知来源文书的更早资料，则应先以行政区片、历史图幅或旧道路范围加大致年代申请候选索引，再由保管部门返回候选卷册/批次/来源文书，夜间账号仍不能直接打开底册。00:35前，夏宁把此前2010公共导向底图已核过的旧B口行政区片与历史图幅号填入目录范围申请草稿，但因时间范围尚未确定，提交按钮保持不可用；申请未提交，也没有输入“永安里”或“6栋201”。S2-07实物核验仍无结果。
meaningful_changes:
  - 花枝巷单一控制样本被推进为可重复验证的正常正式地址索引方法；第二条普通记录纸坊巷8号→槐北路108号能够通过同一批次目录与现行地址卡双向交叉核
  - 周衡掌握两类合法入口：已知来源文书时沿片区/批次/条目核对，未知来源文书时先用历史位置范围或图幅+年代申请候选索引，不以目标地名无来源全文搜索
  - 同一变更批次被确认可包含不同处置类型，因此“同批”不能替单条记录补变更原因；正式沿革索引也不替实体门牌或居民口头叫法承担证明责任
  - 旧B口历史图幅首次被填入门楼牌沿革目录的申请条件，但由于年代尚未确定，申请仍停留在未提交草稿；第51章获得明确、低风险的正常入口
new_information:
  - 历史门楼牌沿革目录可按行政区片、年度/批次和来源文书定位到条目与登记页，但目录不等于历史底册全文
  - 东桥片区2018年第27批中“纸坊巷8号→槐北路108号”可由现行地址卡反向核到2018-06-18及同一来源文书，成为第二个普通控制样本
  - 对缺来源文书的较早纸质资料，目录说明允许使用行政区片+历史图幅/旧道路范围+大致年代先申请候选索引范围，再继续追卷册/批次/来源文书
  - 第50章结束时旧B口图幅申请草稿只填了行政区片和历史图幅，时间范围与申请理由仍空，因此未提交
open_questions:
  - 应以什么年代范围申请旧B口对应的历史门楼牌索引，申请后会返回哪些候选卷册/批次/来源文书仍未知
  - 旧槐荫路/永安里所在历史图幅是否存在任何可执行的正式地址沿革记录仍未知
  - BK-JBS-160114-03对应旧导向牌Day 4是否仍在S2-07，仍待正常盘点
  - 永安里6栋201独立历史证明、M003目标人员、完整失址机制、工单系统来源及周衡为何保留永安里记忆均未解决
ending_state: Day 4约00:35，周衡、梁策、夏宁仍在临江市夜间综合服务中心第三夜班。两条普通正式地址变更已验证沿革索引的正常检索路径；旧B口行政区片和历史图幅号已经填入未提交的目录范围申请草稿，但年代尚未确定，没有查询永安里或查看任何目标区片结果。S2-07继续待正常实物核验。第51章只按历史图幅+年代申请对应门楼牌目录范围，并严格保存有限阴性结果
