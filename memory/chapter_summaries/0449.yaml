summary: >-
  Day310 20:29宋知弦在民槐社区展厅见第十二张《桥头补鞋的人》挂位空白，线上二维码与十二件到位绿字存在而实际实物未核。20:38负责人许桢确认Day310 19:52司机仅勾已到场、纸质逐件签收空白。21:06夜间中心受报、21:22物业在合法摄像下确认灰罩推车压到消防疏散门开启范围、后坡道棚接缝滴水；21:35获权人员把车安全移入干燥工作间并经物业实核本扇消防门全幅开启，不替整栋建筑验收。21:47馆内保管岗与作者见证两箱总共十二张实际存在，但最后一件外框玻璃裂、有细屑，相纸是否受潮及破损责任未定。22:27宋知弦只同意临时保管、不认可全部无损签收，次日按约只展十一件。Day311 09:08影像展真以十一件开放并如实公告一件暂缓；10:31物业与馆核司机到场被馆汇总映作逐件接收，旧记录保留，新实点验不倒填昨夜签收。修护人员预约并非鉴定、责任待查。20:03作者确认空墙真实说明，母亲照片仍有原底片在家而不冒充原展品可安全悬挂。F003 Day311仅限阅2022通用目录名可容同批多个拍摄子项、子项到原始封件号受限，14:02申请仅收件；不证2019互签封口、2016旧书面回告在封或历史自然人实获答。Day195三旧件/沈家票分源，F008/M004/M005无新证。
