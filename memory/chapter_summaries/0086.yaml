chapter: 86
title: 站牌还在这里
arc: ARC-008
summary: >-
  Day 16 22:48—23:07，第十六次夜班继续。新槐路西口来电人准备赶往东桥换乘站，实体站牌和乘客端仍显示47路停靠，但上一班在春台街口转走。中心先联动公交夜间调度解决现实末班出行：站点当前仍在用、47路常规停靠关系未变；22:37左右新槐路西段轻微交通事故造成车辆横停及油液/碎片占道，交警临时限制公交进入该段，公交22:40向47路相关班次下发短时绕行指令。上一班22:43按指令从春台街口进入文成路，下一班同样处于绕行范围，不会到新槐路西口。夏宁因此没有让来电人继续等待，而是核实春台街北口步行路线当前可通行，并经公交调度确认19路不受影响；来电人22:51转移，22:57到达替代站，23:00回访确认已经上车并可前往东桥换乘站。继续核乘客信息发现，运营调度22:40已改变车辆路径，但乘客信息侧没有同步生成临时不停靠站点提示，原ETA继续按正常站序滚动；22:53信息值守补发新槐路西口等受影响站点的临时不停靠状态，22:55原5分钟ETA消失。实体站牌、站点台账、常规线路关系、临时调度和实际车辆轨迹均能互相解释，本案按“临时交通管制+合法短时绕行+乘客信息短时同步滞后”普通闭环，不建立服务边界异常候选。23:07新的公共线路来自河滨公园北门公共厕所：门口标识与城市服务地图仍显示夜间开放，但来电人现场发现自动门无法进入、室内灯亮，当前只记录现实如厕需求与开放信息/门禁状态差异，原因未知。
meaningful_changes:
  - 新槐路西口来电人的末班出行从继续等待不确定47路推进为已执行替代路线，并于23:00确认乘坐19路前往东桥换乘站
  - 上一班47路转向首次取得可审计普通原因：新槐路西段临时交通管制后，公交调度22:40下发短时绕行，车辆22:43按指令执行；下一班也在同一绕行范围
  - 新槐路西口站点与47路常规停靠关系均未取消，实体站牌/基础台账继续存在与临时某班次不停靠并不冲突
  - 乘客端ETA差异定位为运营调度已变更而乘客信息侧临时不停靠提示晚约13分钟生成，22:55已纠正
  - 公交线普通闭环后原第87章继续核服务边界的事实前提失效，ARC-008改从河滨公园北门公共厕所新的真实服务事件进入
new_information:
  - Day 16约22:37新槐路西段轻微交通事故触发短时交通限制，22:40公交调度对47路相关班次下发绕行指令
  - 上一班47路22:43按临时绕行从春台街口转入文成路；下一班同样不应到新槐路西口
  - 47路新槐路西口站点仍为在用且常规停靠关系有效，没有永久停站或线路撤销
  - 乘客信息侧未与22:40运营调度同时生成临时不停靠提示，22:53补发、22:55撤掉原ETA
  - Day 16 23:07河滨公园北门公共厕所出现“开放标识/地图显示夜间开放，但自动门现场无法进入”的新工单，原因尚未核实
open_questions:
  - 河滨公园北门公共厕所当前自动门为何无法进入，是否为开放时段、门禁控制、清洁/检修、设备故障或服务信息同步等普通原因
  - 公厕当前现实替代如厕点、设施实际开放状态、值守/保洁和城市服务地图信息如何对应
  - 永安里居民身份/实际居住、M004/M005、完整失址机制和周衡记忆原因继续未知且当前不重开
ending_state: Day 16约23:07，第十六次夜班进行中。新槐路西口47路事件已经由临时交通管制、正常调度绕行和乘客信息短时同步滞后完整解释；来电人已改乘19路完成现实出行，不建立服务边界异常候选。新的河滨公园北门公共厕所工单刚进入：开放标识和城市服务地图仍显示夜间开放，但自动门无法进入且室内灯亮。第87章只能先解决来电人的现实如厕需求，再核开放时段、门禁/设备、值守与服务信息普通原因，不得为了旧章名继续追已闭合的公交服务边界。
