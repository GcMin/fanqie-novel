summary: >-
  Day653母亲在新荷街将昨日亲做的两张单碗试印纸分隔收存，左下单碗右边大片留白的第二张仍由自己背签，未替换已于Day651真取回的借展双碗。晓漫发孩子四轮纸盒汽车只能原地打转视频，母亲先请带原车来核而未凭视频远程断因。近午从韩姨处取得两支未开封饮料吸管作为套管材料，母亲自备钝头旧木棒，旧纸棒太粗没有硬塞。14:17晓漫和孩子带Day649空盒制车及剩硬纸来，孩子先亲看Day638低柜内侧方窗船仍在，要求保留车顶本人红笔「七」与Day652新剪有角第四轮。查出四纸轮被胶带直接压死在车底，孩子同意只拆胶带；拆时纸盒底纤维撕破一小处，孩子亲选卡纸内补片。母亲成人操作刻刀、剪和打孔器，剪两段吸管固定车底为轴套，两根钝头木棒穿管与四纸轮固定，孩子只让胶带固定轮和棒不跨吸管。首次装上左后轮悬空，因后吸管贴高，孩子亲揭胶重贴；四轮落桌滚动却仍偏左，有角轮仍点桌。母亲搭稳防滑低坡硬板，孩子不助推首趟实走56厘米并记左转，另次用力撞书角，第三次从坡走53厘米仍左偏。他不许晓漫剪圆第四轮，亲手画自己走过的左弯路线与停车框，将记录和纸车都带回家。韩姨只在门口短问，孩子只请晓漫先询问修车店是否方便观看而非预定同意。母亲清理工具与胶带背衬，旧屋夜间仅向中心报已授权闭锁安全限项，Day639邮政答复已限定收讫、Day649原租客旧信真归还与F014历史旧证仍分源。夜间晓漫私人照片见纸车停在孩子画的弯路尽头，母亲不替他决定何时走直。
