summary: >-
  Day 19 01:18，第十八次夜班继续。云港路与桃溪巷口附近一辆夜间配送面包车右前轮突然陷入路面，驾驶员无伤但车辆倾斜，裂缝边缘持续渗水。中心先让道路巡查封住受影响车道，在后方交通停稳后协助驾驶员从安全侧离车，禁止其自行倒车、加速脱困、钻车底或返回搬货。01:27道路夜间维护到场，只确认表面破口不到半米、裂缝和地下受影响范围明显更大，暂不允许救援车贴近。01:31供水应急到场，附近支管末端压力自01:14后持续下降；分段关阀后01:38现场渗水同步明显减少，确认当前漏水与该段在用供水支管有关，但道路继续封控，因为停止冲刷不等于已被冲空的基层恢复承载。梁策到现场负责联动与人员边界，道路人员划定稳定区域后，车辆救援从稳定车道以绞盘回收面包车，01:54车辆脱困且无人受伤。车移开后确认沥青下基层存在比表面开口更大的淘空区。01:59供水人员从稳定作业面开挖，现场确认一处在用支管接口密封失效并伴随周围土体冲刷；无法仅凭压力曲线或现场状态精确倒推漏水起始时间，因此不扩写故障史。02:12接口处理完成，02:21压力复测稳定且受影响用户恢复供水。道路侧随后清理松软材料、确认空腔范围并进行夜间应急回填/压实；02:36完成临时面层与受控通行恢复，局部围挡保留，正式面层修复转白班。供水故障修复与道路结构恢复分别记录，车辆损失按正常保险/责任流程处理。02:46事件按普通“供水支管接口密封失效→水流冲刷基层→局部路面塌陷”闭环，ARC-017完成，不建立异常候选。
meaningful_changes:
  - 驾驶员从倾斜车辆内、后续车辆仍可能压过危险区域，推进为安全离车、车道封控、车辆受控回收且无人受伤。
  - 可见渗水从未知来源推进为专业现场确认的在用供水支管接口密封失效，并完成接口处理和压力复测、恢复供水。
  - 道路风险从表面不足半米的破口推进为确认地下基层存在更大淘空区，完成夜间应急回填和受控通行恢复，正式面层修复转白班。
  - 团队明确“漏水停止/供水修复完成”与“道路重新具备安全通行条件”是两个不同完成状态，不能相互替代。
  - ARC-017普通闭环，不新增F008，不重开永安里身份层，不触碰M004/M005。
knowledge_updates:
  zhou_heng:
    - 知道云港路本次局部塌陷由在用供水支管接口密封失效、漏水冲刷基层解释；漏水持续多久当前无足够证据且与当晚处置无关。
    - 知道停止漏水只能终止继续冲刷，不能证明既有地下淘空已经恢复承载；供水修复和道路安全恢复需分别由对应专业责任方确认。
  liang_ce:
    - 知道面包车脱困前必须先划定稳定救援区域；其现场职责是联动和把非专业人员留在危险区外，不替代道路/供水专业判断。
  xia_ning:
    - 知道工单应分别记录供水故障修复、车辆脱困、道路夜间应急恢复和白班永久面层修复，不用任一完成状态覆盖其他未完成事项。
