summary: >-
  Day651母亲在新荷街早晨准备用硬背板、干隔纸及外层防水套接回本人Day644第三张独立新印且右碗沿原有少墨缺口的《两只碗》，与Day643原始歪双碗独作分开。驿站小陆约下午15点取还，拒留复印及续展。韩姨仍记得Day650本人亲印的四针纸，普通邻里对话不转成作品或钥匙代理。驿站Day645换过的中性大字说明卡仍在，灰帽老人从缺墨想到自家旧搪瓷碗，母亲只解释印版缺色，不被代写身世。15:05后小陆将站方相框从矮柜移至洁净台，核Day644接收登记、原照片、纸背本人署名和日期以及右碗沿旧缺墨和无新增明显折脏；母亲将画确实放入自己隔纸硬背板文件袋持有之后，站方才签实际归还和关闭保管项，公用相框及说明卡仍归站方。老人独自在小票背面画两个不同圆圈，不请求复制原画。以后成人开放桌只由站方另议，母亲未获教师职位或授权网络使用作品。回新荷街后本人将新印双碗与旧原双碗分开隔纸收存，晓漫仅获限项实领照片，方窗船及孩子红杯产权未变；母亲在新空白试纸背面写下一只碗构想，尚未印。夜间仅报告旧仁合里四楼本人授权安全限项，R-12/F014仍无跨源新证，Day639邮政错格调查仍待核。
