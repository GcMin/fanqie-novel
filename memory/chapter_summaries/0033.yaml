schema_version: 1
chapter: 33
title: 旧地址表
arc: ARC-002
summary: >-
  Day 2 21:34起，周衡、梁策、夏宁不再继续翻夜联旧册，而是从旧系统正常运维资料核对2015年夜联实际使用的地址索引。历史说明确认夜联工位查询的是定期同步、只读的标准地址主表；两次正式同步之间，新路名、新交付小区、门牌调整等可通过临时增补处理，长期写入主表必须有正式来源，夜班值守只有反馈/核址权限。三人先反查第32章旧册前后页的普通地址样本：栖霞路南延段在取得道路命名通知后进入临时增补并随下一版主表转正；另一新交付小区也在街道回正式名称和门牌范围后补入，因此“地址索引未检/待核”本身确属普通业务状态。随后夏宁用完整流水号LJ-150907-0041在“疑难地址反馈”中找到DZFK-150907-06：2015-09-07 08:14，夜班交接后正式反馈“青梧苑13栋，夜联地址索引未检出；责任物业已接受原述并完成现场处置，请核标准地址源”。2015-09-08 10:37维护意见为标准地址源无对应新增楼栋记录，未取得可用于增补的正式新增/变更来源，因此本次不入地址主表，业务记录保留来话原述并由责任单位现场核址。继续核对2015年7—9月可查主表/更新登记，没有发现13栋新增入库记录，也没有发现删除13栋的变更记录；因此当前证据不支持“13栋先进入这套标准地址表、后来被删除”，只确认2015年中心标准地址链与同一时期物业工程图、维修、回访和住户链已经发生可追溯分叉。DZFK处理依据另引用“2015年9月第一批标准地址同步清单”及来源批次号，成为下一步正常调查入口。22:12夏宁短联络钱先生，其仍可正常应答、无新不适、仍自述在原长椅附近，并称自己减少亮屏以省电；未报告精确剩余电量，轨道方仍无新定位结果，黑色帆布包仍未找到。22:18周衡完成分列记录，下一步只核标准地址同步清单及交接来源。
meaningful_changes:
  - 2015夜联“地址索引未检13栋”从单一值班员手写备注推进为正式疑难地址反馈与维护结果，证明中心当年确实走过普通地址维护流程而13栋仍未进入标准地址主表
  - 通过栖霞路和新交付小区的正常补录闭环，进一步确认地址未检本身不是异常分类，关键差异在于13栋始终没有取得可用于标准库增补的正式来源
  - 当前证据边界由“十三栋可能后来从地址表被删”收窄为“现可查2015年7—9月标准地址链未见其入库也未见删除记录”，避免过早假定人为删除
  - 同一时期中心标准地址链与物业工程/维修/回访/住户链的历史分叉被正式建立，并取得上游标准地址同步清单这一下一步入口
  - 钱先生安全链继续维持，本人仍可联系且无新不适，但实际位置和黑包仍未解决
new_information:
  - 2015夜联使用定期同步的只读标准地址主表，并以临时增补/疑难地址反馈处理新路名、新小区或未标准化门牌；正式入主表需要可追溯来源
  - DZFK-150907-06于2015-09-07 08:14正式反馈青梧苑13栋无法在夜联地址索引检出，同时记录责任物业已接受原述并完成现场处置
  - 2015-09-08 10:37维护侧因标准地址源无对应新增楼栋、未取得正式新增/变更来源而决定不把13栋增补进地址主表，业务侧继续保留来话原述并由责任单位核址
  - 现可查2015年7—9月主表/更新登记未见13栋新增记录，也未见删除13栋的变更记录
  - DZFK处理依据引用“2015年9月第一批标准地址同步清单”及来源批次号，正文位于基础数据交接档而非夜联旧册
  - Day 2 22:12钱先生仍可正常应答、无新不适，主动减少手机使用以省电；没有新的精确电量数据
open_questions:
  - 2015年9月第一批标准地址同步清单具体如何列青梧苑楼栋，其上游来源和交接单位是什么
  - 为什么同一时期物业工程图、维修、回访和住户链能正常承认13#建筑/704，而标准地址源无法取得13栋正式新增来源
  - 2016接管楼栋表只列7至12是否与2015标准地址源属于同一上游链条，当前尚未证明
  - 永安里6栋201仍缺独立历史纸档证明，M003不得提前完成
  - 钱先生实际位置和黑色帆布包仍在哪里
ending_state: Day 2约22:18，周衡、梁策、夏宁仍在临江市夜间综合服务中心第二夜班。可确认2015中心标准地址维护流程曾正式收到13栋缺失反馈，但因没有可用于标准库增补的正式来源而未将其纳入主表；现可查同期更新历史也未见13栋被删除。下一步只核DZFK引用的2015年9月第一批标准地址同步清单及交接来源；钱先生安全链继续
