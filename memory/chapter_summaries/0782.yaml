summary: >-
  Day647母亲继续真住新荷街，Day646自己印制的四张椅子试纸有序留存，第四张背签私人抽屉、前三张作为不同试印失败记录；Day644驿站有责室内一周借展她的新印双碗，Day645中性展卡仍有效。晓漫上午来电，外甥拿Day645自题《杯子打架》原稿想来亲手压印；母亲确认自己没有替他预印，承诺下午只用成人看护安全工具。上午母亲核桌面垫板平整，将食饭饮水与颜料分区，自费购有完整说明的少量红色水洗颜料；韩姨楼下仅普通闲聊不代办。14:20晓漫和孩子真实来访，外甥亲核Day638方窗船还在原来低柜内侧木架，不许擅改架位，不拿原画当刀具底纸；孩子自己决定只印两杯图案、标题待干后亲写，用钝头压纹笔试图控制杯柄反向，尖刀仅成人可用。15:05第一张红印杯口与杯柄局部断，三水点只现两颗；第二张红深浅不匀但三点都出现，一点恰碰杯口，孩子选择保留且没有强行重压湿纸。三人清洁、饭桌恢复、共食晚饭后，孩子决定第一张两水点画送外婆、第二张自己留，没授权驿站展示。17:30纸干后孩子在第一张背面亲署日期姓名，第二张正面写自己选的《杯子打架》并署名，分别装夹，晓漫带孩子正常离开，房卡仍母亲自持、方窗船未挪。21点后母亲仍仅向夏宁中心报旧仁合里四楼本人授权闭锁安全限项，旧屋双封水电隔离整屋禁返住及R-12/F014旧证缺口不变。
