title: 打印出来的纸
arc: ARC-001
summary: >-
  Day 2约04:17后，夏宁先处理一单正常夜间调度，再重新核验LJ-150907-0041所在旧扫描整页、前后页和2017扫描批次。04:23，她按整页打印，第一张实体副本完整保留2015年9月7日、流水号0041、地址“青梧苑13栋”、楼道公共照明报修及01:12“恢复照明”等内容，并另纸记录打印时间和来源。随后夏宁关闭查看器并从原路径重新打开同一文件，发现第7页0041的流水号、时间、事项、处置结果和页序均未变化，唯独地址栏变为“青梧苑12栋”；另一工位从同一路径打开也显示12栋。04:30再次打印当前页面后，第二张纸同样显示12栋，而04:23第一张仍显示13栋。三人只记录“当前电子源与先前打印件发生差异”，没有推断所有电子介质都会变化或纸张永久安全。04:34前，他们把04:23的13栋打印件锁入调度席抽屉，保留04:30的12栋打印件作当前来源对照，并形成临时留证顺序：原页全景、来源和时间、纸质副本、再查。
meaningful_changes:
  - 第一张完整纸质副本在电子来源变化前成功生成，实体证据第一次保存了当前电子源已经不再显示的“青梧苑13栋”内容
  - 同一旧扫描源在重新打开后从13栋变为12栋，且第二次打印跟随当前电子源显示12栋，F005由跨系统差异推进为同源前后差异
  - 周衡、梁策、夏宁把多媒介保存从个人习惯升级为明确的临时处置顺序，今后遇到来源冲突先留完整页面和时间来源再继续查询
new_information:
  - 04:23整页打印的LJ-150907-0041仍明确写“青梧苑13栋”
  - 重新打开同一“城西联动_2015-09_03.tif”第7页后，0041地址变为“青梧苑12栋”，其余已核字段暂未发现变化
  - 另一工位打开同一路径也显示12栋；04:30第二次打印同样为12栋
  - 两次打印件被分别标记来源/时间并保留，04:23的13栋版本暂存于夏宁调度席带锁抽屉
open_questions:
  - 旧扫描为何在重新打开后只改变0041地址栏，是否还会继续发生变化
  - 04:23纸质打印件能稳定保留13栋内容多久，纸张是否只是本次暂时未变化
  - 这种变化是否会影响人的记忆、对既有证据的理解或其他媒介
  - 青梧苑地下六箱2015维修/回访纸质资料是否仍保留13栋相关记录
ending_state: Day 2约04:34，周衡、梁策、夏宁仍在临江市夜间综合服务中心；电子旧扫描当前显示0041地址为青梧苑12栋，04:23第一版纸质打印件仍显示13栋并锁入夏宁调度席抽屉，04:30第二版打印件显示12栋并作为当前来源对照；三人已采用“先完整留证再继续查询”的临时策略
