schema_version: 1
chapter: 5
title: 十三栋
arc: ARC-001
summary: >-
  周衡与梁策抵达13栋后，从门禁、电表、抄表通知、物业公告、信报箱和楼内住户等多个细节确认这不是一栋空壳：它有持续使用的水电设施、跨越多年的生活痕迹和互相认识的住户。夏宁则确认固定监控里二人在冬青处消失，定位仍停在停车场。四楼住户自然认识704“刘阿姨”，并称自己已在楼内住六七年。二人登上七楼，确认楼梯和外观都只到七层；在704门口却听见头顶传来撞击与拖动声。刘桂兰随后正常开门，确认自己就是投诉人。
meaningful_changes:
  - 周衡确认13栋具有长期真实居住痕迹，不能再把它当成单纯视觉异常
  - 普通住户证词将刘桂兰和13栋纳入一套稳定日常关系
  - 七层建筑上方出现清晰噪音，问题转向内部楼层矛盾
new_information:
  - 13栋为七层一梯两户住宅，内部存在实际用电、公告和住户生活痕迹
  - 四楼住户认识704刘桂兰并称自己在楼内居住六七年
  - 固定监控无法显示异常道路和二人进入后的真实位置
open_questions:
  - 13栋的水电/物业记录在现实系统中能否查到
  - 七层顶板上方的噪音从何而来
  - 刘桂兰对楼上结构如何认知
ending_state: 周衡与梁策已进入13栋七楼并见到704投诉人刘桂兰；头顶持续有拖动声
