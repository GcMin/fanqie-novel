name: Validate Fanqie ready chapters

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publisher-check.yml"
      - "chapters/ready/**"
      - "plans/chapter_plan.csv"
      - "publisher/**"
      - "requirements.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install publisher dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate all ready chapters without publishing
        env:
          GITHUB_REPOSITORY: GcMin/fanqie-novel
          GITHUB_BRANCH: main
          PUBLISH_ENABLED: "false"
        run: python -m publisher check
