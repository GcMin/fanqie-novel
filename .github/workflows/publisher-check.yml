name: Validate Fanqie ready chapters

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publisher-check.yml"
      - "chapters/ready/**"
      - "plans/chapter_plan.csv"
      - "publisher/**"
      - "tests/test_check_local.py"
      - "requirements.txt"
  pull_request:
    paths:
      - ".github/workflows/publisher-check.yml"
      - "chapters/ready/**"
      - "plans/chapter_plan.csv"
      - "publisher/**"
      - "tests/test_check_local.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install validation dependency only
        run: python -m pip install PyYAML==6.0.2
      - name: Test offline snapshot validation
        run: python -m unittest discover -s tests -p test_check_local.py -v
      - name: Validate this checkout without Git sync or publishing
        env:
          PUBLISH_ENABLED: "false"
        run: |
          echo "Checked commit: $(git rev-parse HEAD)"
          python -m publisher.check_local --repo .
